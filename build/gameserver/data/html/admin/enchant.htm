<html><title>Enchant</title><body><center>
	<table width=260>
		<tr>
			<td width=40><button value="Main" action="bypass -h admin_admin" width=40 height=15 back="sek.cbui94" fore="sek.cbui92"></td>
			<td width=180 align=center>Enchant a slot</td>
			<td width=40></td>
		</tr>
	</table>
	<img src="l2ui.SquareWhite" width=275 height=1><br>
	Type the level, then pick the slot.<br>
	<table width=240>
		<tr>
			<td width=80 align=right>Enchant level</td>
			<td width=80><edit var="enchant" width=70 height=15></td>
			<td width=80></td>
		</tr>
	</table><br>
	Weapons and shield
	<table width=250>
		<tr>
			<td><button value="R. Hand" action="bypass -h admin_enchant rhand $enchant" width=80 height=19 back="L2UI_ch3.smallbutton2_over" fore="L2UI_ch3.smallbutton2"></td>
			<td><button value="L. Hand" action="bypass -h admin_enchant lhand $enchant" width=80 height=19 back="L2UI_ch3.smallbutton2_over" fore="L2UI_ch3.smallbutton2"></td>
			<td></td>
		</tr>
	</table><br>
	Armor
	<table width=250>
		<tr>
			<td><button value="Head" action="bypass -h admin_enchant head $enchant" width=80 height=19 back="L2UI_ch3.smallbutton2_over" fore="L2UI_ch3.smallbutton2"></td>
			<td><button value="Chest" action="bypass -h admin_enchant chest $enchant" width=80 height=19 back="L2UI_ch3.smallbutton2_over" fore="L2UI_ch3.smallbutton2"></td>
			<td><button value="Legs" action="bypass -h admin_enchant legs $enchant" width=80 height=19 back="L2UI_ch3.smallbutton2_over" fore="L2UI_ch3.smallbutton2"></td>
		</tr><tr>
			<td><button value="Gloves" action="bypass -h admin_enchant gloves $enchant" width=80 height=19 back="L2UI_ch3.smallbutton2_over" fore="L2UI_ch3.smallbutton2"></td>
			<td><button value="Feet" action="bypass -h admin_enchant feet $enchant" width=80 height=19 back="L2UI_ch3.smallbutton2_over" fore="L2UI_ch3.smallbutton2"></td>
			<td><button value="Under" action="bypass -h admin_enchant under $enchant" width=80 height=19 back="L2UI_ch3.smallbutton2_over" fore="L2UI_ch3.smallbutton2"></td>
		</tr><tr>
			<td><button value="Cloak" action="bypass -h admin_enchant cloak $enchant" width=80 height=19 back="L2UI_ch3.smallbutton2_over" fore="L2UI_ch3.smallbutton2"></td>
			<td></td>
			<td></td>
		</tr>
	</table><br>
	Jewels
	<table width=250>
		<tr>
			<td><button value="Necklace" action="bypass -h admin_enchant neck $enchant" width=80 height=19 back="L2UI_ch3.smallbutton2_over" fore="L2UI_ch3.smallbutton2"></td>
			<td><button value="L. Ear" action="bypass -h admin_enchant lear $enchant" width=80 height=19 back="L2UI_ch3.smallbutton2_over" fore="L2UI_ch3.smallbutton2"></td>
			<td><button value="R. Ear" action="bypass -h admin_enchant rear $enchant" width=80 height=19 back="L2UI_ch3.smallbutton2_over" fore="L2UI_ch3.smallbutton2"></td>
		</tr><tr>
			<td></td>
			<td><button value="L. Finger" action="bypass -h admin_enchant lfinger $enchant" width=80 height=19 back="L2UI_ch3.smallbutton2_over" fore="L2UI_ch3.smallbutton2"></td>
			<td><button value="R. Finger" action="bypass -h admin_enchant rfinger $enchant" width=80 height=19 back="L2UI_ch3.smallbutton2_over" fore="L2UI_ch3.smallbutton2"></td>
		</tr>
	</table><br>
	Appearance
	<table width=250>
		<tr>
			<td><button value="Face" action="bypass -h admin_enchant face $enchant" width=80 height=19 back="L2UI_ch3.smallbutton2_over" fore="L2UI_ch3.smallbutton2"></td>
			<td><button value="Hair" action="bypass -h admin_enchant hair $enchant" width=80 height=19 back="L2UI_ch3.smallbutton2_over" fore="L2UI_ch3.smallbutton2"></td>
			<td><button value="Hair All" action="bypass -h admin_enchant hairall $enchant" width=80 height=19 back="L2UI_ch3.smallbutton2_over" fore="L2UI_ch3.smallbutton2"></td>
		</tr>
	</table><br>
	<font color="B09878">It works on your target, or on you when nothing is targeted.</font>
</center></body></html>
