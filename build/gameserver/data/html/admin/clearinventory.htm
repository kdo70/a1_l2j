<html><title>Items</title><body>
	<table width=270>
		<tr>
			<td width=45><button value="Main" action="bypass -h admin_admin" width=45 height=15 back="sek.cbui94" fore="sek.cbui92"></td>
			<td width=180 align=center>Clear Inventory</td>
			<td width=45><button value="Back" action="bypass -h admin_item" width=45 height=15 back="sek.cbui94" fore="sek.cbui92"></td>
		</tr>
	</table><br>
	<center>
		You are about to destroy <font color="LEVEL">%count%</font> item(s) owned by <font color="LEVEL">%name%</font>, equipped ones included. This can't be undone.<br>
		Cursed weapons and the control item of an active pet or mount are kept.<br>
		<br>
		<table width=270>
			<tr>
				<td align=center><button value="Confirm" action="bypass -h admin_clear_inventory confirm %name%" width=75 height=21 back="L2UI_ch3.Btn1_normalOn" fore="L2UI_ch3.Btn1_normal"></td>
				<td align=center><button value="Cancel" action="bypass -h admin_item" width=75 height=21 back="L2UI_ch3.Btn1_normalOn" fore="L2UI_ch3.Btn1_normal"></td>
			</tr>
		</table>
	</center>
</body></html>
