# ===========================================================================
# Предметы
# ===========================================================================
# Жизненный цикл предметов, лежащих на земле: как они подбираются, сколько
# лежат и что игроку разрешено с ними делать.


# ---------------------------------------------------------------------------
# Автоподбор
# ---------------------------------------------------------------------------

# Отправлять обычный дроп с монстров сразу в инвентарь убийцы.
# По умолчанию: False
AutoLoot = False

# То же самое для дропа с рейд-боссов.
# По умолчанию: False
AutoLootRaid = False

# Если False, трава продолжает падать на землю, даже когда включён AutoLoot.
# По умолчанию: False
AutoLootHerbs = False


# ---------------------------------------------------------------------------
# Предметы на земле
# ---------------------------------------------------------------------------

# Разрешить игрокам выбрасывать предметы на землю.
# По умолчанию: True
AllowDiscardItem = True

# Разрешить создание нескольких нескладируемых предметов за один раз.
# По умолчанию: True
MultipleItemDrop = True

# Задержка в секундах перед уничтожением выпавшей травы. 0 отключает.
# По умолчанию: 15
AutoDestroyHerbTime = 15

# Задержка в секундах перед уничтожением выпавшего предмета. 0 отключает.
# По умолчанию: 600
AutoDestroyItemTime = 600

# То же самое для надеваемых предметов (броня, оружие, бижутерия).
# 0 отключает.
# По умолчанию: 0
AutoDestroyEquipableItemTime = 0

# Исключения для отдельных предметов, переопределяющие задержки выше.
# Формат: idПредмета-секунды,idПредмета-секунды...
#   57-0   : предмет с id 57 никогда не уничтожается.
#   57-600 : предмет с id 57 уничтожается через 600 секунд.
# По умолчанию: 57-0,5575-0,6673-0
AutoDestroySpecialItemTime = 57-0,5575-0,6673-0

# Множитель, применяемый к задержке уничтожения предметов, выброшенных
# игроками. При 0 они лежат вечно.
# По умолчанию: 1
PlayerDroppedItemMultiplier = 1


# ---------------------------------------------------------------------------
# Примерка
# ---------------------------------------------------------------------------

# Разрешить игрокам примерять оружие и броню в магазинах. Каждая примерка
# стоит WearPrice аден, а предмет надет на WearDelay секунд.
# По умолчанию: True / 5 / 10
AllowWear = True
WearDelay = 5
WearPrice = 10
