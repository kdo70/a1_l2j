# ===========================================================================
# GeoEngine
# ===========================================================================
# Загрузка геодаты, линия видимости и поиск пути.
#
# Список регионов в конце этого файла читается самим GeoEngine, поэтому он
# должен оставаться именно в этом файле.


# ---------------------------------------------------------------------------
# Геодата
# ---------------------------------------------------------------------------

# Путь к файлам геодаты. Может указывать за пределы папки сервера, например
# на установленный клиент ("C:/Program Files/Lineage II/system/geodata/").
# Примечание: если геодата L2OFF лежит в папке "Lineage II/system/geodata/",
# включается внутриигровая команда ///geodata, позволяющая ГМу видеть геодату.
# По умолчанию: ./data/geodata/
GeoDataPath = ./data/geodata/

# Тип файлов геодаты.
#   L2J   : файлы L2J (например, 22_16.l2j)
#   L2OFF : файлы L2OFF (например, 22_16_conv.dat)
# По умолчанию: L2OFF
GeoDataType = L2J


# ---------------------------------------------------------------------------
# Передвижение
# ---------------------------------------------------------------------------

# Количество допустимых неудач построения геопути до записи предупреждения в
# лог. Значения ниже 15 подтягиваются вверх, так как ИИ нужен этот запас для
# нормальной работы.
# По умолчанию: 50
MaxGeopathFailCount = 50


# ---------------------------------------------------------------------------
# Линия видимости
# ---------------------------------------------------------------------------

# Высота, с которой начинается линия видимости, в процентах от роста
# персонажа.
# По умолчанию: 75
PartOfCharacterHeight = 75

# Максимальная высота препятствия, которому разрешено превышать линию
# видимости.
# По умолчанию: 32
MaxObstacleHeight = 32


# ---------------------------------------------------------------------------
# Поиск пути
# ---------------------------------------------------------------------------

# Вес перемещения по оси и по диагонали.
# По умолчанию: 10 / 14
MoveWeight = 10
MoveWeightDiag = 14

# Вес, используемый вместо двух приведённых выше, когда флаги перемещения
# целевого узла заблокированы в любом направлении. Он уводит рассчитанный
# путь подальше от препятствий, вместо того чтобы вести его вплотную к ним.
# По умолчанию: 30
ObstacleWeight = 30

# Вес эвристики, которая оценивает стоимость пути от узла до цели. Для
# корректной работы он должен оставаться больше MoveWeight.
# По умолчанию: 12
HeuristicWeight = 12

# Максимальное количество узлов, создаваемых за один проход поиска пути.
# По умолчанию: 10000
MaxIterations = 10000


# ---------------------------------------------------------------------------
# Список регионов
# ---------------------------------------------------------------------------
# Мир состоит из 176 регионов (11 x 16), по одному файлу геодаты на каждый.
# Список ниже определяет, какие из них загружаются.
#   16_10  : загружать регион. Сервер не запустится, пока каждый включённый
#            регион не будет корректно загружен.
#   #16_10 : пропустить регион. Тогда он считается зоной, где «разрешено всё»:
#            агрессия, атаки, каст заклинаний и перемещение проходят сквозь
#            стены и препятствия, а поиск пути не используется.
# Закомментированные ниже регионы не поддерживаются клиентом L2.
