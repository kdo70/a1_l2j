# ===========================================================================
# GeoEngine
# ===========================================================================
# Geodata loading, line of sight and pathfinding.
#
# The region list at the bottom of this file is read by the GeoEngine itself,
# so it has to stay in this very file.


# ---------------------------------------------------------------------------
# Geodata
# ---------------------------------------------------------------------------

# Path of the geodata files. It can point outside of the server folder, for
# example on a client install ("C:/Program Files/Lineage II/system/geodata/").
# Note : when L2OFF geodata sit in the "Lineage II/system/geodata/" folder,
# the ingame ///geodata command is enabled, which lets a GM see the geodata.
# Default: ./data/geodata/
GeoDataPath = ./data/geodata/

# Type of the geodata files.
#   L2J   : L2J files (e.g. 22_16.l2j)
#   L2OFF : L2OFF files (e.g. 22_16_conv.dat)
# Default: L2OFF
GeoDataType = L2OFF


# ---------------------------------------------------------------------------
# Movement
# ---------------------------------------------------------------------------

# Amount of geopath failures tolerated before a warning is logged. Values
# below 15 are clamped, as the AI needs that room to run properly.
# Default: 50
MaxGeopathFailCount = 50


# ---------------------------------------------------------------------------
# Line of sight
# ---------------------------------------------------------------------------

# Height the line of sight starts at, as a percent of the character height.
# Default: 75
PartOfCharacterHeight = 75

# Maximum height of an obstacle allowed to exceed the line of sight.
# Default: 32
MaxObstacleHeight = 32


# ---------------------------------------------------------------------------
# Pathfinding
# ---------------------------------------------------------------------------

# Weight of a movement, axially and diagonally.
# Default: 10 / 14
MoveWeight = 10
MoveWeightDiag = 14

# Weight used instead of the two above when the movement flags of the target
# node are blocked in any direction. It keeps the computed path away from the
# obstacles, rather than glued to them.
# Default: 30
ObstacleWeight = 30

# Weight of the heuristic, which estimates the cost from a node to the target.
# It must stay above MoveWeight to work properly.
# Default: 12
HeuristicWeight = 12

# Maximum amount of nodes generated by a single pathfinding process.
# Default: 10000
MaxIterations = 10000


# ---------------------------------------------------------------------------
# Region list
# ---------------------------------------------------------------------------
# The world is made of 176 regions (11 x 16), one geodata file each. The list
# below picks the ones being loaded.
#   16_10  : load the region. The server refuses to start until every enabled
#            region is properly loaded.
#   #16_10 : skip the region. It is then considered "everything-allowed" :
#            aggression, attacks, spellcasts and movements go through walls
#            and obstacles, and no pathfinding is used.
