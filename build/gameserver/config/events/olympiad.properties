# ===========================================================================
# Olympiad
# ===========================================================================
# Schedule, participation rules and rewards of the Olympiad games.


# ---------------------------------------------------------------------------
# Schedule
# ---------------------------------------------------------------------------

# Time of the day, hour and minute, the competition period starts at.
# Default: 18 / 0 (6pm)
OlyStartTime = 18
OlyMin = 00

# Duration, in ms, of the competition period. Change it by steps of 10
# minutes.
# Default: 21600000 (6 hours)
OlyCPeriod = 21600000

# Duration, in ms, of a single battle.
# Default: 180000 (3 minutes)
OlyBattle = 360000

# Delay, in seconds, before the participants are teleported to the arena.
# Default: 30
OlyWaitTime = 30

# Delay, in seconds, before the battle starts. Buffs are granted 20 seconds
# before the end of that delay.
# Default: 60
OlyWaitBattle = 60

# Delay, in seconds, before the participants are teleported back to town.
# Default: 40
OlyWaitEnd = 40


# ---------------------------------------------------------------------------
# Participation
# ---------------------------------------------------------------------------

# Amount of participants required to start a game, classed and non classed.
# Default: 5 / 9
OlyClassedParticipants = 5
OlyNonClassedParticipants = 9

# Amount of matches required to be eligible to the hero status.
# Default: 5
OlyMinMatchesToBeClassed = 9


# ---------------------------------------------------------------------------
# Points
# ---------------------------------------------------------------------------

# Points granted on the first Olympiad cycle.
# Default: 18
OlyStartPoints = 18

# Points granted every week, past the first cycle.
# Default: 3
OlyWeeklyPoints = 3

# Maximum amount of points won or lost on a single match.
# Default: 10
OlyMaxPoints = 10

# Divider applied on the points at stake, on classed and non classed games.
# Default: 3 / 5
OlyDividerClassed = 3
OlyDividerNonClassed = 5


# ---------------------------------------------------------------------------
# Rewards
# ---------------------------------------------------------------------------

# Reward of a classed and of a non classed game.
# Format: itemId-itemCount;itemId-itemCount...
# Default: 6651-50 / 6651-30
OlyClassedReward = 6651-50
OlyNonClassedReward = 6651-30

# Amount of reward items given per Olympiad point exchanged.
# Default: 1000
OlyGPPerPoint = 1000

# Clan reputation points granted by a hero of the clan.
# Default: 300
OlyHeroPoints = 300


# ---------------------------------------------------------------------------
# Misc
# ---------------------------------------------------------------------------

# If True, the Olympiad managers announce the start of every fight.
# Default: True
OlyAnnounceGames = True
