# ===========================================================================
# Олимпиада
# ===========================================================================
# Расписание, правила участия и награды Олимпийских игр.


# ---------------------------------------------------------------------------
# Расписание
# ---------------------------------------------------------------------------

# Время суток (час и минута), в которое начинается период соревнований.
# По умолчанию: 18 / 0 (18:00)
OlyStartTime = 18
OlyMin = 00

# Длительность периода соревнований, в мс. Изменяйте шагом по 10 минут.
# По умолчанию: 21600000 (6 часов)
OlyCPeriod = 21600000

# Длительность одного боя, в мс.
# По умолчанию: 180000 (3 минуты)
OlyBattle = 360000

# Задержка в секундах перед телепортацией участников на арену.
# По умолчанию: 30
OlyWaitTime = 30

# Задержка в секундах перед началом боя. Бафы выдаются за 20 секунд до конца
# этой задержки.
# По умолчанию: 60
OlyWaitBattle = 60

# Задержка в секундах перед телепортацией участников обратно в город.
# По умолчанию: 40
OlyWaitEnd = 40


# ---------------------------------------------------------------------------
# Участие
# ---------------------------------------------------------------------------

# Количество участников, необходимое для старта игры, в классовых и
# внеклассовых боях.
# По умолчанию: 5 / 9
OlyClassedParticipants = 5
OlyNonClassedParticipants = 9

# Количество боёв, необходимое для права претендовать на статус героя.
# По умолчанию: 5
OlyMinMatchesToBeClassed = 9


# ---------------------------------------------------------------------------
# Очки
# ---------------------------------------------------------------------------

# Очки, выдаваемые в первом цикле Олимпиады.
# По умолчанию: 18
OlyStartPoints = 18

# Очки, выдаваемые каждую неделю после первого цикла.
# По умолчанию: 3
OlyWeeklyPoints = 3

# Максимальное количество очков, выигрываемых или теряемых за один бой.
# По умолчанию: 10
OlyMaxPoints = 10

# Делитель, применяемый к разыгрываемым очкам в классовых и внеклассовых
# боях.
# По умолчанию: 3 / 5
OlyDividerClassed = 3
OlyDividerNonClassed = 5


# ---------------------------------------------------------------------------
# Награды
# ---------------------------------------------------------------------------

# Награда за классовый и за внеклассовый бой.
# Формат: idПредмета-количество;idПредмета-количество...
# По умолчанию: 6651-50 / 6651-30
OlyClassedReward = 6651-50
OlyNonClassedReward = 6651-30

# Количество наградных предметов, выдаваемое за одно обменянное олимпийское
# очко.
# По умолчанию: 1000
OlyGPPerPoint = 1000

# Очки репутации клана, приносимые героем клана.
# По умолчанию: 300
OlyHeroPoints = 300


# ---------------------------------------------------------------------------
# Разное
# ---------------------------------------------------------------------------

# Если True, менеджеры Олимпиады объявляют начало каждого боя.
# По умолчанию: True
OlyAnnounceGames = True
