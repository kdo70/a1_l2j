# ===========================================================================
# Seven Signs
# ===========================================================================
# Seven Signs cycle and the festival of darkness running along with it.


# ---------------------------------------------------------------------------
# Seven Signs
# ---------------------------------------------------------------------------

# If True, anyone can join any side, whatever the regular requirements are.
# Default: False
SevenSignsBypassPrerequisites = False


# ---------------------------------------------------------------------------
# Festival
# ---------------------------------------------------------------------------

# Amount of party members required to enter a festival. Clamped to 2 - 9.
# Default: 5
FestivalMinPlayer = 5

# Maximum contribution of a single player during a festival.
# /!\ This value isn't affected by the server drop rates.
# Default: 1000000
MaxPlayerContrib = 1000000

# Delay, in ms, before the festival manager starts.
# Default: 120000 (2 minutes)
FestivalManagerStart = 120000

# Duration, in ms, of a festival.
# Default: 1080000 (18 minutes)
FestivalLength = 1080000

# Duration, in ms, of a full cycle : the festival, plus the waiting time.
# Default: 2280000 (38 minutes)
FestivalCycleLength = 2280000

# Delays, in ms, counted from the festival start, of the two monster spawns
# and of the two swarms following them.
# Default: 120000 / 300000 / 540000 / 720000 (2, 5, 9 and 12 minutes)
FestivalFirstSpawn = 120000
FestivalFirstSwarm = 300000
FestivalSecondSpawn = 540000
FestivalSecondSwarm = 720000

# Delay, in ms, counted from the festival start, of the chests spawn.
# Default: 900000 (15 minutes)
FestivalChestSpawn = 900000
