# ===========================================================================
# Seven Signs
# ===========================================================================
# Цикл Seven Signs и идущий вместе с ним фестиваль тьмы.


# ---------------------------------------------------------------------------
# Seven Signs
# ---------------------------------------------------------------------------

# Если True, любой может присоединиться к любой стороне, независимо от
# обычных требований.
# По умолчанию: False
SevenSignsBypassPrerequisites = False


# ---------------------------------------------------------------------------
# Фестиваль
# ---------------------------------------------------------------------------

# Количество членов группы, необходимое для входа на фестиваль. Ограничено
# рамками 2 - 9.
# По умолчанию: 5
FestivalMinPlayer = 5

# Максимальный вклад одного игрока за фестиваль.
# /!\ На это значение не влияют серверные рейты дропа.
# По умолчанию: 1000000
MaxPlayerContrib = 1000000

# Задержка в мс перед запуском менеджера фестиваля.
# По умолчанию: 120000 (2 минуты)
FestivalManagerStart = 120000

# Длительность фестиваля, в мс.
# По умолчанию: 1080000 (18 минут)
FestivalLength = 1080000

# Длительность полного цикла, в мс: фестиваль плюс время ожидания.
# По умолчанию: 2280000 (38 минут)
FestivalCycleLength = 2280000

# Задержки в мс, отсчитываемые от начала фестиваля, для двух волн спавна
# монстров и двух следующих за ними роёв.
# По умолчанию: 120000 / 300000 / 540000 / 720000 (2, 5, 9 и 12 минут)
FestivalFirstSpawn = 120000
FestivalFirstSwarm = 300000
FestivalSecondSpawn = 540000
FestivalSecondSwarm = 720000

# Задержка в мс, отсчитываемая от начала фестиваля, для спавна сундуков.
# По умолчанию: 900000 (15 минут)
FestivalChestSpawn = 900000
