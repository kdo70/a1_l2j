# ===========================================================================
# Minigames
# ===========================================================================
# The two recurring side activities : the lottery and the fishing tournament.


# ---------------------------------------------------------------------------
# Lottery
# ---------------------------------------------------------------------------

# Enable the lottery, along with the ticket sellers.
# Default: True
AllowLottery = True

# Initial amount of the jackpot, in Adena.
# Default: 50000
LotteryPrize = 50000

# Price of a ticket, in Adena.
# Default: 2000
LotteryTicketPrice = 2000

# Part of the jackpot shared between the players who found 5, 4 and 3 winning
# numbers.
# Default: 0.6 / 0.2 / 0.2
Lottery5NumberRate = 0.6
Lottery4NumberRate = 0.2
Lottery3NumberRate = 0.2

# Amount of Adena given to the players who found 2 winning numbers or less.
# Default: 200
Lottery2and1NumberPrize = 200


# ---------------------------------------------------------------------------
# Fishing tournament
# ---------------------------------------------------------------------------

# Enable the fishing tournament.
# Default: True
AllowFishChampionship = True

# Item given as a reward.
# Default: 57 (adena)
FishChampionshipRewardItemId = 57

# Amount of that item given to the five first winners.
# Default: 800000 / 500000 / 300000 / 200000 / 100000
FishChampionshipReward1 = 800000
FishChampionshipReward2 = 500000
FishChampionshipReward3 = 300000
FishChampionshipReward4 = 200000
FishChampionshipReward5 = 100000
