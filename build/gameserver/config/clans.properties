# ===========================================================================
# Clans
# ===========================================================================
# Clans, alliances and the manor system they run on the castles they own.


# ---------------------------------------------------------------------------
# Penalties
# ---------------------------------------------------------------------------
# Amounts of days a character or a clan has to wait, once one of those events
# happened.

# Before joining another clan.
# Default: 5
DaysBeforeJoinAClan = 1

# Before creating a new clan.
# Default: 10
DaysBeforeCreateAClan = 10

# Before a clan dissolution is effective.
# Default: 7
DaysToPassToDissolveAClan = 7

# Before joining a new alliance, when the clan left its alliance.
# Default: 1
DaysBeforeJoinAllyWhenLeaved = 1

# Before joining a new alliance, when the clan was dismissed from it.
# Default: 1
DaysBeforeJoinAllyWhenDismissed = 1

# Before accepting a new clan, when the alliance dismissed one.
# Default: 1
DaysBeforeAcceptNewClanWhenDismissed = 1

# Before creating a new alliance, when the previous one was dissolved.
# Default: 10
DaysBeforeCreateNewAllyWhenDissolved = 10


# ---------------------------------------------------------------------------
# Alliances and wars
# ---------------------------------------------------------------------------

# Maximum amount of clans in an alliance.
# Default: 3
MaxNumOfClansInAlly = 3

# Amount of members both clans need to declare a clan war.
# Default: 15
ClanMembersForWar = 15

# Amount of days a clan has to wait to declare war back to a clan.
# Default: 5
ClanWarPenaltyWhenEnded = 5


# ---------------------------------------------------------------------------
# Clan warehouse
# ---------------------------------------------------------------------------

# If True, the "browse warehouse" privilege also grants the right to withdraw
# from it.
# Default: False
MembersCanWithdrawFromClanWH = False


# ---------------------------------------------------------------------------
# Manor
# ---------------------------------------------------------------------------

# Enable the manor system, on every castle.
# Default: True
AllowManor = True

# Time of the day, hour and minute, the manor period is refreshed at.
# Default: 20 / 0 (8pm)
ManorRefreshTime = 20
ManorRefreshMin = 0

# Time of the day, hour and minute, the next period is approved at.
# Default: 6 / 0 (6am)
ManorApproveTime = 6
ManorApproveMin = 0

# Duration, in minutes, of the maintenance period.
# Default: 6
ManorMaintenanceMin = 6

# Delay, in hours, between two saves of the manor production.
# Default: 2
ManorSavePeriodRate = 2
