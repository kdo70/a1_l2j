# ===========================================================================
# Разработка
# ===========================================================================
# Отладочные переключатели и журналы аудита. Все они предназначены для
# тестового сервера: они либо заваливают логи, либо ломают игровой мир.


# ---------------------------------------------------------------------------
# Отладка
# ---------------------------------------------------------------------------

# Пропустить загрузку таблиц спавна, оставив мир без NPC.
# По умолчанию: False
NoSpawns = False

# Подробные отладочные сообщения. Они легко заваливают логи игрового сервера.
# По умолчанию: False
Developer = False

# Логировать каждый неизвестный или необработанный клиентский пакет.
# По умолчанию: False
PacketHandlerDebug = False


# ---------------------------------------------------------------------------
# Журналы
# ---------------------------------------------------------------------------

# Логировать чат, в log/chat.
# По умолчанию: False
LogChat = False

# Логировать операции с предметами, в log/item. Может занимать очень много
# места.
# По умолчанию: False
LogItems = False

# Логировать действия ГМов, в log/gmaudit.
# По умолчанию: False
GMAudit = False
