#=============================================================
#                        Champion mobs
#=============================================================

# Enable the champion mobs system.
# Random monsters within the allowed level range become champions,
# with boosted stats and rewards. Default: False.
ChampionMobsEnable = True

# Force champion mobs to be passive (non aggressive). Default: False.
ChampionMobsPassive = False

# Chance, in %, for an eligible monster to become a champion. 0 disables. Default: 0.
ChampionMobsFrequency = 25

# Title shown by champion mobs.
ChampionMobsTitle = *Champion*

# Minimum and maximum monster level allowed to become a champion.
ChampionMobsMinLevel = 1
ChampionMobsMaxLevel = 80

# Stats multipliers for champion mobs.
ChampionMobsHpMultiplier = 20
ChampionMobsPAtkMultiplier = 3
ChampionMobsPDefMultiplier = 20
ChampionMobsMAtkMultiplier = 5
ChampionMobsMDefMultiplier = 20

# XP and SP rewards multiplier for champion mobs.
ChampionMobsXpSpMultiplier = 20

# Adena rewards multiplier for champion mobs.
ChampionMobsAdenaMultiplier = 10

# Bonus reward item, dropped on champion kill.
ChampionMobsRewardItemId = 6673
ChampionMobsRewardItemQty = 5

# Chance, in %, to obtain the bonus reward item. 0 disables. Default: 0.
ChampionMobsRewardChance = 100

# Visual effect used by champion mobs to glow with a red aura.
# Available values: bleeding, redcircle, flame (see AbnormalEffect enum).
ChampionMobsAura = bleeding
