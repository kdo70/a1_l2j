# ===========================================================================
# Bosses
# ===========================================================================
# Raid bosses and grand bosses. Their spawn points and respawn delays live on
# the datapack side, in data/xml.


# ---------------------------------------------------------------------------
# Raid bosses
# ---------------------------------------------------------------------------

# Regeneration and defence of the raid bosses and their minions, on a base of
# 1 = 100%.
# Default: 1. for all
RaidHpRegenMultiplier = 1.
RaidMpRegenMultiplier = 1.
RaidDefenceMultiplier = 1.

# If True, the paralyzing curse thrown at the players way below the boss level
# is disabled.
# Default: False
DisableRaidCurse = False


# ---------------------------------------------------------------------------
# Grand bosses
# ---------------------------------------------------------------------------

# Delay, in minutes, between the entrance of the party and the appearance of
# the boss.
# Default: 30 / 20 / 10
AntharasWaitTime = 30
ValakasWaitTime = 20
FrintezzaWaitTime = 10
