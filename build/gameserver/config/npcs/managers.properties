# ===========================================================================
# NPC-менеджеры
# ===========================================================================
# Сервисные NPC, которые не спавнятся по умолчанию, и менеджер виверн.
# Первых трёх спавните командой //spawn <id>.


# ---------------------------------------------------------------------------
# Class Master - //spawn 50000
# ---------------------------------------------------------------------------

# Если True, мастер профессий предлагает все профессии дерева классов, а не
# только следующую. Тогда Dwarven Fighter может сразу стать Artisan,
# Scavenger, Warsmith, Bounty Hunter, Maestro или Fortune Seeker, тогда как
# Warsmith может стать только Maestro.
# По умолчанию: False
AllowEntireTree = False

# Стоимость и награда за каждую смену профессии.
# Формат: профессия;[забираемые предметы];[выдаваемые предметы];профессия;...
#   1;[57(100000)];[];2;[57(1000000)];[];3;[57(10000000),5575(1000000)];[6622(1)]
#     1-я профессия за 100k адены, 2-я за 1kk адены, 3-я за 10kk адены плюс
#     1kk древней адены, с наградой в виде одной Book of Giants.
#   1;[];[];2;[];[];3;[];[]
#     каждая смена профессии бесплатна и без награды.
#   1;[];[];2;[];[]
#     предлагаются только первая и вторая профессии.
# По умолчанию: (пусто, что отключает NPC)
ConfigClassMaster = 1;[];[];2;[];[];3;[];[]


# ---------------------------------------------------------------------------
# Wedding Manager - //spawn 50001
# ---------------------------------------------------------------------------

# Цена свадьбы, в аденах.
# По умолчанию: 1000000
WeddingPrice = 1000000

# Разрешить однополые браки.
# По умолчанию: False
WeddingAllowSameSex = False

# Требовать, чтобы оба игрока были в формальном костюме.
# По умолчанию: True
WeddingFormalWear = True


# ---------------------------------------------------------------------------
# Scheme Buffer - //spawn 50002
# ---------------------------------------------------------------------------

# Количество схем, которое может сохранить персонаж.
# По умолчанию: 4
BufferMaxSchemesPerChar = 4

# Фиксированная цена бафа, переопределяющая цену умения. -1 сохраняет цену
# умения.
# По умолчанию: -1
BufferStaticCostPerBuff = -1


# ---------------------------------------------------------------------------
# Менеджер виверн
# ---------------------------------------------------------------------------

# Уровень, которого должен достичь страйдер, чтобы превратиться в виверну.
# По умолчанию: 55
RequiredStriderLevel = 55

# Количество кристаллов (грейд B), расходуемых на это превращение.
# По умолчанию: 10
RequiredCrystalsNumber = 10
