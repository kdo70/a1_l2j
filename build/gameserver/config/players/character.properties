# ===========================================================================
# Персонаж
# ===========================================================================
# Характеристики, защиты и штрафы, применяемые к персонажу игрока, а также
# правила распределения опыта внутри группы.


# ---------------------------------------------------------------------------
# Характеристики
# ---------------------------------------------------------------------------

# Скорость регенерации, где 1 = 100%.
# По умолчанию: 1. для всех
HpRegenMultiplier = 1.
MpRegenMultiplier = 1.
CpRegenMultiplier = 1.

# Количество HP, восстанавливаемое при воскрешении, где 1 = 100%.
# По умолчанию: 0.7
RespawnRestoreHP = 0.7

# Если True, более слабый эффект из группы стака отменяется при использовании
# более сильного, а более слабый эффект, наложенный после, отменяется тоже.
# Если False, эффекты не отменяются; более слабый возвращается, когда более
# сильный заканчивается, если он всё ещё активен.
# По умолчанию: True
CancelLesserEffect = True


# ---------------------------------------------------------------------------
# Защиты
# ---------------------------------------------------------------------------

# Длительность в секундах защиты, выдаваемой после телепорта или входа в игру.
# 0 отключает её.
# По умолчанию: 0
PlayerSpawnProtection = 0

# Длительность в секундах защиты от агрессивных монстров, выдаваемой при
# подъёме из мнимой смерти (fake death). 0 отключает её.
# По умолчанию: 5
PlayerFakeDeathUpProtection = 5


# ---------------------------------------------------------------------------
# Смерть
# ---------------------------------------------------------------------------

# Если True, смерть заставляет персонажа терять опыт и, возможно, уровень.
# По умолчанию: True
AllowDelevel = True

# Шанс в %, получить штраф смерти при убийстве монстром.
# По умолчанию: 20
DeathPenaltyChance = 20


# ---------------------------------------------------------------------------
# Приватные лавки
# ---------------------------------------------------------------------------

# Количество слотов приватной лавки (продажа/покупка). На официальных
# серверах гномы получают 5 слотов, а остальные расы — 4.
# По умолчанию: 5 / 4
MaxPvtStoreSlotsDwarf = 5
MaxPvtStoreSlotsOther = 4


# ---------------------------------------------------------------------------
# Правила дропа deep blue
# ---------------------------------------------------------------------------

# Если True, приведённые ниже штрафы к дропу применяются к монстрам, чей
# уровень сильно ниже уровня игрока:
#   - разница в 9 уровней делит дроп на 3;
#   - сверх этих 9 уровней шанс дропа снижается на 9% за каждый лишний
#     уровень (9 уровней = -9%, 10 уровней = -18%, ...).
# Они применяются и к обычному дропу, и к споилу и игнорируют серверные
# рейты, когда дропом является адена, — так же, как на официальных серверах.
# По умолчанию: True
UseDeepBlueDropRules = True


# ---------------------------------------------------------------------------
# Группа
# ---------------------------------------------------------------------------

# Способ исключения участника из распределения опыта.
#   auto       : участник отсекается, когда его доля меньше группового
#                бонуса, который он даёт (30% в группе из 2 человек). Тогда
#                он не получает ничего и больше не учитывается в групповом
#                бонусе.
#   level      : участник отсекается при разрыве больше PartyXpCutoffLevel
#                уровней.
#   percentage : участник отсекается, если его доля ниже
#                PartyXpCutoffPercent.
#   none       : никто и никогда не отсекается.
# По умолчанию: level
PartyXpCutoffMethod = level

# Используется способом "percentage". Не задавайте здесь высокие значения.
# По умолчанию: 3.
PartyXpCutoffPercent = 3.0

# Используется способом "level". Не задавайте здесь низкие значения.
# По умолчанию: 20
PartyXpCutoffLevel = 20

# Радиус, используемый групповыми проверками: прогресс квестов,
# распределение предметов и т. д.
# По умолчанию: 1500
PartyRange = 1500
