# ===========================================================================
# Character
# ===========================================================================
# Stats, protections and penalties applied on a player character, plus the
# rules used to share the experience inside a party.


# ---------------------------------------------------------------------------
# Stats
# ---------------------------------------------------------------------------

# Regeneration speed, on a base of 1 = 100%.
# Default: 1. for all
HpRegenMultiplier = 1.
MpRegenMultiplier = 1.
CpRegenMultiplier = 1.

# Amount of HP restored on revive, on a base of 1 = 100%.
# Default: 0.7
RespawnRestoreHP = 0.7

# If True, the weaker effect of a stack group is canceled when a stronger one
# is used, and a weaker effect added afterwards is canceled aswell. If False,
# effects aren't canceled ; the weaker one comes back when the stronger one
# runs out, as long as it is still active.
# Default: True
CancelLesserEffect = True


# ---------------------------------------------------------------------------
# Protections
# ---------------------------------------------------------------------------

# Duration, in seconds, of the protection granted after a teleport or a login.
# 0 disables it.
# Default: 0
PlayerSpawnProtection = 0

# Duration, in seconds, of the protection against aggressive monsters granted
# when standing up from a fake death. 0 disables it.
# Default: 5
PlayerFakeDeathUpProtection = 5


# ---------------------------------------------------------------------------
# Death
# ---------------------------------------------------------------------------

# If True, dying makes the character lose experience, and eventually a level.
# Default: True
AllowDelevel = True

# Chance, in %, to get a death penalty when killed by a monster.
# Default: 20
DeathPenaltyChance = 20


# ---------------------------------------------------------------------------
# Private stores
# ---------------------------------------------------------------------------

# Amount of slots of a private store (sell/buy). On retail, dwarves get 5
# slots, while the other races get 4.
# Default: 5 / 4
MaxPvtStoreSlotsDwarf = 5
MaxPvtStoreSlotsOther = 4


# ---------------------------------------------------------------------------
# Deep blue drop rules
# ---------------------------------------------------------------------------

# If True, the drop penalties below are applied on the monsters way below the
# player level :
#   - 9 levels of difference divide the drops by 3 ;
#   - past those 9 levels, the drop chance is lowered by 9% per extra level
#     (9 levels = -9%, 10 levels = -18%, ...).
# They are applied on both regular and sweep drops, and ignore the server
# rates when the drop is Adena - which is retail behavior.
# Default: True
UseDeepBlueDropRules = True


# ---------------------------------------------------------------------------
# Party
# ---------------------------------------------------------------------------

# Method used to cut a member out of the experience distribution.
#   auto       : the member is cut when his share is lower than the party
#                bonus he grants (30% on a 2 members party). He then earns
#                nothing, and isn't counted for the party bonus anymore.
#   level      : the member is cut past PartyXpCutoffLevel levels of gap.
#   percentage : the member is cut below PartyXpCutoffPercent of the share.
#   none       : nobody is ever cut.
# Default: level
PartyXpCutoffMethod = level

# Used by the "percentage" method. Don't use high values here.
# Default: 3.
PartyXpCutoffPercent = 3.0

# Used by the "level" method. Don't use low values here.
# Default: 20
PartyXpCutoffLevel = 20

# Range used by the party checks : quest progress, item distribution, etc.
# Default: 1500
PartyRange = 1500
