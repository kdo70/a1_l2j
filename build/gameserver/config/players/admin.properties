# ===========================================================================
# Admin
# ===========================================================================
# Access levels, GM login behavior and the petitions players send to them.
#
# The access levels themselves are defined on the database, in the
# "access_levels" table.


# ---------------------------------------------------------------------------
# Access
# ---------------------------------------------------------------------------

# Access level granted to every character on creation.
# /!\ Anything above 0 turns every single player into a GM.
# Default: 0
DefaultAccessLevel = 0


# ---------------------------------------------------------------------------
# GM login
# ---------------------------------------------------------------------------

# Grant the hero aura to a GM.
# Default: False
GMHeroAura = False

# Set a GM invulnerable on login.
# Default: False
GMStartupInvulnerable = False

# Set a GM invisible on login.
# Default: False
GMStartupInvisible = False

# Block the private messages sent to a GM on login.
# Default: False
GMStartupBlockAll = False

# List a GM on the /gmlist on login.
# Default: True
GMStartupAutoList = True


# ---------------------------------------------------------------------------
# Petitions
# ---------------------------------------------------------------------------

# Allow players to send ingame petitions.
# Default: True
PetitioningAllowed = True

# Amount of petitions a player can send per session.
# Default: 5
MaxPetitionsPerPlayer = 5

# Amount of pending petitions. Past that amount, new ones are rejected.
# Default: 25
MaxPetitionsPending = 25
