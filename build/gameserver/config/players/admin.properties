# ===========================================================================
# Администрирование
# ===========================================================================
# Уровни доступа, поведение ГМа при входе и петиции, которые ему отправляют
# игроки.
#
# Сами уровни доступа определяются в базе данных, в таблице "access_levels".


# ---------------------------------------------------------------------------
# Доступ
# ---------------------------------------------------------------------------

# Уровень доступа, выдаваемый каждому персонажу при создании.
# /!\ Любое значение выше 0 превращает каждого игрока в ГМа.
# По умолчанию: 0
DefaultAccessLevel = 0


# ---------------------------------------------------------------------------
# Вход ГМа
# ---------------------------------------------------------------------------

# Выдавать ГМу ауру героя.
# По умолчанию: False
GMHeroAura = False

# Делать ГМа неуязвимым при входе.
# По умолчанию: False
GMStartupInvulnerable = False

# Делать ГМа невидимым при входе.
# По умолчанию: False
GMStartupInvisible = False

# Блокировать приватные сообщения, отправляемые ГМу, при входе.
# По умолчанию: False
GMStartupBlockAll = False

# Показывать ГМа в /gmlist при входе.
# По умолчанию: True
GMStartupAutoList = True


# ---------------------------------------------------------------------------
# Петиции
# ---------------------------------------------------------------------------

# Разрешить игрокам отправлять внутриигровые петиции.
# По умолчанию: True
PetitioningAllowed = True

# Количество петиций, которое игрок может отправить за сессию.
# По умолчанию: 5
MaxPetitionsPerPlayer = 5

# Количество петиций в очереди. Сверх этого количества новые отклоняются.
# По умолчанию: 25
MaxPetitionsPending = 25
