# ===========================================================================
# Karma and PvP
# ===========================================================================
# What a karma player is allowed to do, what he drops on death, and how long
# the PvP flag lasts.
#
# The drop chances themselves are set in config/rates.properties.


# ---------------------------------------------------------------------------
# Karma restrictions
# ---------------------------------------------------------------------------
# Actions a player owning karma is allowed to do.

# Default: False
KarmaPlayerCanShop = False

# Default: True
KarmaPlayerCanTeleport = True

# Default: False
KarmaPlayerCanUseGK = False

# Default: True
KarmaPlayerCanTrade = True

# Default: True
KarmaPlayerCanUseWareHouse = True


# ---------------------------------------------------------------------------
# Death drops
# ---------------------------------------------------------------------------

# Amount of PK kills required before a player starts dropping items on death.
# Default: 5
MinimumPKRequiredToDrop = 5

# If True, a GM also drops his equipment on death.
# Default: False
CanGMDropEquipment = False

# Items which can't be dropped on death.
# /!\ No trailing space, and no space between the numbers.

# Pet items.
# Default: 2375,3500,3501,3502,4422,4423,4424,4425,6648,6649,6650
ListOfPetItems = 2375,3500,3501,3502,4422,4423,4424,4425,6648,6649,6650

# Items a PK never drops.
# Default: 1147,425,1146,461,10,2368,7,6,2370,2369
ListOfNonDroppableItemsForPK = 57,1147,425,1146,461,10,2368,7,6,2370,2369


# ---------------------------------------------------------------------------
# PvP flag
# ---------------------------------------------------------------------------

# If True, killing a player owning karma awards a PvP point.
# Default: True
AwardPKKillPVPPoint = False

# Duration, in ms, of the PvP flag after hitting an innocent player.
# Default: 40000
PvPVsNormalTime = 40000

# Duration, in ms, of the PvP flag after hitting a flagged player.
# Default: 20000
PvPVsPvPTime = 20000
