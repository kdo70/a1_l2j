# ===========================================================================
# Enchant
# ===========================================================================
# Chances and limits of the item enchantment.


# ---------------------------------------------------------------------------
# Chances
# ---------------------------------------------------------------------------
# Chances of success, on a base of 1 = 100%. The "15Plus" variants take over
# from +15 onwards.

# Magic weapons.
# Default: 0.4 / 0.2
EnchantChanceMagicWeapon = 0.4
EnchantChanceMagicWeapon15Plus = 0.2

# Non magic weapons.
# Default: 0.7 / 0.35
EnchantChanceNonMagicWeapon = 0.7
EnchantChanceNonMagicWeapon15Plus = 0.35

# Armors and jewels.
# Default: 0.66
EnchantChanceArmor = 0.66


# ---------------------------------------------------------------------------
# Limits
# ---------------------------------------------------------------------------

# Highest enchant level allowed. 0 removes the limit.
# Default: 0 / 0
EnchantMaxWeapon = 0
EnchantMaxArmor = 0

# Enchant level reached without any risk of failure. EnchantSafeMaxFull is
# used by the full body armors, and must stay above 0.
# Default: 3 / 4
EnchantSafeMax = 3
EnchantSafeMaxFull = 4


# ---------------------------------------------------------------------------
# Enchant window
# ---------------------------------------------------------------------------

# Once an enchant attempt is over, hand the "select item to enchant" window
# the next scroll of the same type instead of closing it, so the player
# doesn't have to use a scroll from the inventory again. The window is only
# kept alive if the enchanted item survived (success or blessed failure), if
# it can still be enchanted with that scroll, and if another scroll of the
# exact same id is still owned - otherwise it closes as usual.
#
# On a stock client the window is rebuilt on reopening, so the player still
# has to select the item again. With the client rebuilt from tools/client
# (see tools/client/README.md), the list is refreshed in place and the
# selection survives : pressing "Enchant" again is all it takes.
# Default: False
EnchantKeepWindowOpened = False
