# ===========================================================================
# Заточка
# ===========================================================================
# Шансы и ограничения заточки предметов.


# ---------------------------------------------------------------------------
# Шансы
# ---------------------------------------------------------------------------
# Шансы успеха, где 1 = 100%. Варианты "15Plus" вступают в силу начиная с +15.

# Магическое оружие.
# По умолчанию: 0.4 / 0.2
EnchantChanceMagicWeapon = 0.4
EnchantChanceMagicWeapon15Plus = 0.2

# Немагическое оружие.
# По умолчанию: 0.7 / 0.35
EnchantChanceNonMagicWeapon = 0.7
EnchantChanceNonMagicWeapon15Plus = 0.35

# Броня и бижутерия.
# По умолчанию: 0.66
EnchantChanceArmor = 0.66


# ---------------------------------------------------------------------------
# Ограничения
# ---------------------------------------------------------------------------

# Наибольший допустимый уровень заточки. 0 снимает ограничение.
# По умолчанию: 0 / 0
EnchantMaxWeapon = 0
EnchantMaxArmor = 0

# Уровень заточки, достигаемый без риска неудачи. EnchantSafeMaxFull
# используется цельной бронёй и должен оставаться больше 0.
# По умолчанию: 3 / 4
EnchantSafeMax = 3
EnchantSafeMaxFull = 4


# ---------------------------------------------------------------------------
# Окно заточки
# ---------------------------------------------------------------------------

# После завершения попытки заточки передавать окну «выберите предмет для
# заточки» следующий свиток того же типа, вместо того чтобы закрывать окно,
# — тогда игроку не нужно снова использовать свиток из инвентаря. Окно
# остаётся открытым, только если затачиваемый предмет уцелел (успех или
# неудача с благословенным свитком), если его всё ещё можно точить этим
# свитком и если у игрока есть ещё один свиток ровно с тем же id; иначе оно
# закрывается как обычно.
#
# На стоковом клиенте окно пересобирается при повторном открытии, поэтому
# игроку всё равно приходится выбирать предмет заново. С клиентом,
# пересобранным из tools/client (см. tools/client/README.md), список
# обновляется на месте и выбор сохраняется: достаточно снова нажать
# "Enchant".
# По умолчанию: False
EnchantKeepWindowOpened = True
