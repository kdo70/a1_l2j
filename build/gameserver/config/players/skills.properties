# ===========================================================================
# Skills
# ===========================================================================
# Skill learning, subclasses, crafting and buff slots.


# ---------------------------------------------------------------------------
# Learning
# ---------------------------------------------------------------------------

# If True, skills are granted on level up, without visiting a trainer.
# Default: False
AutoLearnSkills = False

# If True, a spellbook is needed to learn a skill.
# Default: True
SpBookNeeded = True

# If True, a Giant's Codex is needed to enchant a skill.
# Default: True
EnchantSkillSpBookNeeded = True

# If True, a spellbook is needed to learn Divine Inspiration.
# Default: True
DivineInspirationSpBookNeeded = True

# If True, a life crystal is needed to learn a clan skill.
# Default: True
LifeCrystalNeeded = True


# ---------------------------------------------------------------------------
# Casting
# ---------------------------------------------------------------------------

# If False, a magical damage always lands for 100% of its value.
# Default: True
MagicFailures = True

# Chance, in %, of a perfect shield block.
# Default: 5
PerfectShieldBlockRate = 5


# ---------------------------------------------------------------------------
# Subclasses
# ---------------------------------------------------------------------------

# If True, a subclass can be added without owning the related quest items.
# Default: False
SubClassWithoutQuests = False


# ---------------------------------------------------------------------------
# Crafting
# ---------------------------------------------------------------------------

# Enable the crafting.
# Default: True
CraftingEnabled = True

# Amount of recipes a character can register, dwarven and common ones.
# Default: 50 / 50
DwarfRecipeLimit = 50
CommonRecipeLimit = 50

# If False, blacksmiths don't consume the recipe from the player inventory.
# Default: True
BlacksmithUseRecipes = True


# ---------------------------------------------------------------------------
# Buffs
# ---------------------------------------------------------------------------

# Amount of buff slots. Divine Inspiration adds 4 slots on top of that value.
# Default: 20
MaxBuffsAmount = 20

# If True, buffs, debuffs and skill reuse delays survive a logout.
# Default: True
StoreSkillCooltime = True
