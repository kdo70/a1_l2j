# ===========================================================================
# Умения
# ===========================================================================
# Изучение умений, сабклассы, крафт и слоты бафов.


# ---------------------------------------------------------------------------
# Изучение
# ---------------------------------------------------------------------------

# Если True, умения выдаются при повышении уровня, без визита к учителю.
# По умолчанию: False
AutoLearnSkills = False

# Если True, для изучения умения нужна книга заклинаний.
# По умолчанию: True
SpBookNeeded = True

# Если True, для заточки умения нужен Giant's Codex.
# По умолчанию: True
EnchantSkillSpBookNeeded = True

# Если True, для изучения Divine Inspiration нужна книга заклинаний.
# По умолчанию: True
DivineInspirationSpBookNeeded = True

# Если True, для изучения кланового умения нужен кристалл жизни.
# По умолчанию: True
LifeCrystalNeeded = True


# ---------------------------------------------------------------------------
# Каст
# ---------------------------------------------------------------------------

# Если False, магический урон всегда проходит на 100% своего значения.
# По умолчанию: True
MagicFailures = True

# Шанс в %, идеального блока щитом.
# По умолчанию: 5
PerfectShieldBlockRate = 5


# ---------------------------------------------------------------------------
# Сабклассы
# ---------------------------------------------------------------------------

# Если True, сабкласс можно добавить, не имея соответствующих квестовых
# предметов.
# По умолчанию: False
SubClassWithoutQuests = False


# ---------------------------------------------------------------------------
# Крафт
# ---------------------------------------------------------------------------

# Включить крафт.
# По умолчанию: True
CraftingEnabled = True

# Количество рецептов, которое может зарегистрировать персонаж, гномьих и
# общих.
# По умолчанию: 50 / 50
DwarfRecipeLimit = 50
CommonRecipeLimit = 50

# Если False, кузнецы не расходуют рецепт из инвентаря игрока.
# По умолчанию: True
BlacksmithUseRecipes = True


# ---------------------------------------------------------------------------
# Бафы
# ---------------------------------------------------------------------------

# Количество слотов бафов. Divine Inspiration добавляет 4 слота поверх этого
# значения.
# По умолчанию: 20
MaxBuffsAmount = 20

# Если True, бафы, дебафы и задержки повторного использования умений
# переживают выход из игры.
# По умолчанию: True
StoreSkillCooltime = True
