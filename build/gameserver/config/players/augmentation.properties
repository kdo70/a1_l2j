# ===========================================================================
# Аугментация
# ===========================================================================
# Шансы результатов аугментации и стоимость аугментации, выполняемой без
# участия NPC.


# ---------------------------------------------------------------------------
# Шансы
# ---------------------------------------------------------------------------

# Шанс в %, получить умение, для каждого грейда камня жизни.
# По умолчанию: 15 / 30 / 45 / 60
AugmentationNGSkillChance = 15
AugmentationMidSkillChance = 30
AugmentationHighSkillChance = 45
AugmentationTopSkillChance = 60

# Шанс в %, получить модификатор базовой характеристики. Он не зависит от
# грейда камня жизни.
# По умолчанию: 1
AugmentationBaseStatChance = 1

# Шанс в %, получить эффект свечения, для каждого грейда камня жизни. Камни
# жизни без грейда и среднего грейда не могут светиться без умения или
# модификатора базовой характеристики.
# По умолчанию: 0 / 40 / 70 / 100
AugmentationNGGlowChance = 0
AugmentationMidGlowChance = 40
AugmentationHighGlowChance = 70
AugmentationTopGlowChance = 100


# ---------------------------------------------------------------------------
# Аугментация без NPC
# ---------------------------------------------------------------------------

# Разрешить аугментацию надетого оружия двойным кликом по камню жизни в
# инвентаре. NPC при этом не нужен, но обычные проверки грейда оружия и
# уровня камня жизни по-прежнему выполняются. Если False, аугментировать
# может только NPC.
# По умолчанию: True
AugmentationViaLifeStone = True

# Стоимость такой аугментации, по одной записи на грейд камня жизни.
# Формат: idПредмета,количество. Предметы забираются из инвентаря игрока;
# если ему не хватает, сообщение говорит, чего именно недостаёт. Количество 0
# делает аугментацию бесплатной.
# По умолчанию: 2130,20 / 2130,30 / 2131,20 / 2131,25
AugmentationViaLifeStoneCostNoGrade = 2130,20
AugmentationViaLifeStoneCostMidGrade = 2130,30
AugmentationViaLifeStoneCostHighGrade = 2131,20
AugmentationViaLifeStoneCostTopGrade = 2131,25
