# ===========================================================================
# Champion mobs
# ===========================================================================
# Random monsters of the allowed level range are turned into champions, with
# boosted stats and rewards.
#
# Note : .properties files are read as ISO-8859-1, so no localized text can be
# set as a title.


# ---------------------------------------------------------------------------
# General
# ---------------------------------------------------------------------------

# Enable the champion mobs.
# Default: False
ChampionMobsEnable = True

# Force the champions to be passive, whatever the monster aggression is.
# Default: False
ChampionMobsPassive = False

# Chance, in %, for an eligible monster to become a champion. 0 disables it.
# Default: 0
ChampionMobsFrequency = 25

# Title shown above the champions.
# Default: Champion
ChampionMobsTitle = *Champion*

# Level range a monster must fall into to become a champion.
# Default: 1 / 85
ChampionMobsMinLevel = 75
ChampionMobsMaxLevel = 80


# ---------------------------------------------------------------------------
# Stats
# ---------------------------------------------------------------------------

# Multipliers applied on the champion stats.
# Default: 1 for all
ChampionMobsHpMultiplier = 20
ChampionMobsPAtkMultiplier = 3
ChampionMobsPDefMultiplier = 20
ChampionMobsMAtkMultiplier = 5
ChampionMobsMDefMultiplier = 20


# ---------------------------------------------------------------------------
# Rewards
# ---------------------------------------------------------------------------

# Multipliers applied on the experience, skill points and Adena rewards.
# Default: 1 / 1.
ChampionMobsXpSpMultiplier = 20
ChampionMobsAdenaMultiplier = 10

# Multipliers applied on the drop and the spoil rates of a champion, on top of
# the server rates (RateDropItems, RateDropSpoil). A rate is an amount of rolls
# of a drop category, not a multiplier of its chance, so 2 means every category
# is rolled twice as often - which is also what the shift click drop list window
# shows, since it folds the champion bonus in along the server rates.
#
# The currency categories are left out : the Adena of a champion is already
# scaled by ChampionMobsAdenaMultiplier above, and doubling the rolls on top of
# it would multiply the two. The herbs are left out as well.
# Default: 2 / 2
ChampionMobsDropMultiplier = 2
ChampionMobsSpoilMultiplier = 2

# Bonus item dropped on a champion kill, and its amount.
# Default: 0 (disabled) / 1
ChampionMobsRewardItemId = 6673
ChampionMobsRewardItemQty = 5

# Chance, in %, to get that bonus item. 0 disables it.
# Default: 0
ChampionMobsRewardChance = 100
