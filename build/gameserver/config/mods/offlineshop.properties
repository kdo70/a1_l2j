# ===========================================================================
# Offline shop
# ===========================================================================
# Lets a player keep his private store running once disconnected. The shop is
# kept on disconnection, or when the ".offline" command is used with an opened
# store, and is restored on server restart.


# ---------------------------------------------------------------------------
# General
# ---------------------------------------------------------------------------

# Allow a private store (buy/sell) to stay opened offline.
# Default: False
OfflineTradeEnable = True

# Allow a manufacture store to stay opened offline.
# Default: False
OfflineCraftEnable = True

# If True, a shop can only be left offline inside a peace zone.
# Default: False
OfflineModeInPeaceZone = True

# If True, an offline shop takes no damage, and can't be killed.
# Default: False
OfflineModeNoDamage = True


# ---------------------------------------------------------------------------
# Display
# ---------------------------------------------------------------------------

# Change the name color of a character entering the offline mode.
# Default: False
OfflineSetNameColor = True

# That color, as an hexadecimal value, sent as is to the client.
# Default: 808080
OfflineNameColor = 808080


# ---------------------------------------------------------------------------
# Restore
# ---------------------------------------------------------------------------

# Restore the offline shops on server startup.
# Default: False
RestoreOffliners = True

# Amount of days an offline shop is restored for. Past that delay, it isn't
# restored anymore - which needs a restart to happen. 0 always restores.
# Default: 10
OfflineMaxDays = 10

# Disconnect the shop once everything is sold or bought.
# Default: True
OfflineDisconnectFinished = True
