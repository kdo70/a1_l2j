# ===========================================================================
# Оффлайн-торговля
# ===========================================================================
# Позволяет игроку оставить свою приватную лавку работающей после отключения.
# Лавка сохраняется при отключении или при использовании команды ".offline"
# с открытой лавкой и восстанавливается при перезапуске сервера.


# ---------------------------------------------------------------------------
# Общее
# ---------------------------------------------------------------------------

# Разрешить приватной лавке (покупка/продажа) оставаться открытой в оффлайне.
# По умолчанию: False
OfflineTradeEnable = True

# Разрешить лавке крафта оставаться открытой в оффлайне.
# По умолчанию: False
OfflineCraftEnable = True

# Если True, лавку можно оставить в оффлайне только внутри мирной зоны.
# По умолчанию: False
OfflineModeInPeaceZone = True

# Если True, оффлайн-лавка не получает урона и не может быть убита.
# По умолчанию: False
OfflineModeNoDamage = True


# ---------------------------------------------------------------------------
# Отображение
# ---------------------------------------------------------------------------

# Менять цвет имени персонажа, переходящего в оффлайн-режим.
# По умолчанию: False
OfflineSetNameColor = True

# Этот цвет в шестнадцатеричном виде, отправляется клиенту как есть.
# По умолчанию: 808080
OfflineNameColor = 808080


# ---------------------------------------------------------------------------
# Восстановление
# ---------------------------------------------------------------------------

# Восстанавливать оффлайн-лавки при запуске сервера.
# По умолчанию: False
RestoreOffliners = True

# Количество дней, в течение которых оффлайн-лавка восстанавливается. По
# истечении этого срока она больше не восстанавливается — что происходит
# только при перезапуске. 0 восстанавливает всегда.
# По умолчанию: 10
OfflineMaxDays = 10

# Отключать лавку, когда всё продано или куплено.
# По умолчанию: True
OfflineDisconnectFinished = True
