# ===========================================================================
# Drop list window
# ===========================================================================
# Behavior of the drop list a player opens by shift clicking a monster - a
# raid boss being one - handled by the DropListManager.
#
# The whole appearance (colors, labels, column widths and captions) lives on
# the datapack side, in data/xml/droplist.xml, and the item icons in
# data/xml/itemIcons.xml. Nothing is duplicated between those files and this
# one : this one only holds what the server owner tunes, the XMLs hold what
# the player sees.
#
# Note : .properties files are read as ISO-8859-1, so no localized text can be
# set here. Every player facing string is defined on the XML.


# False removes the whole feature ; a shift click keeps its regular meaning.
# Default: True
DropListEnabled = True

# Id of the skill a player must own to open the window. 0 opens it to
# everyone. A player without that skill isn't told anything, and keeps the
# retail shift click behavior - attacking without moving - so this is also the
# way to leave that behavior alone for everyone but the buyers of the skill.
# Default: 0
DropListSkillId = 0

# Amount of drops shown per page. It also drives the height reserved for the
# list, which keeps the page selector pinned to the bottom of the dialog
# whatever the amount of shown rows - see the "pageHeight" of the XML.
# Default: 9
DropListRowsPerPage = 9

# False removes the spoil groups, whatever the monster holds.
# Default: True
DropListShowSpoil = True

# True opens the first page on a header telling what the kill itself is worth :
# the amount of HP which has to be dealt to kill the monster, and the experience
# and the SP the very player reading the window earns for it. All three carry
# the champion bonuses of the monster.
#
# The header takes the room of the item rows it covers, so the first page shows
# fewer drops instead of growing taller - see the "headerHeight" of the XML.
# Default: True
DropListShowHeader = True

# True folds the server rates (RateDropItems, RateDropItemsByRaid,
# RateDropSpoil, RateDropCurrency, RateDropHerbs) into the shown chances, so
# the window tells what actually happens on this server. False shows the raw
# retail chances of the droplist table.
#
# A rate is an amount of rolls of a category, not a multiplier of its chance,
# so the folded chance is capped at 100% instead of growing past it.
# Default: True
DropListApplyRates = True

# True folds the deep blue penalty of the very player reading the window into
# the shown chances, so an overleveled player is told what he actually gets and
# not what the droplist table holds. False shows the chances of a player the
# monster is still worth killing for.
#
# The penalty is the one "UseDeepBlueDropRules" of character.properties drives,
# computed here against the level of that single player rather than against the
# highest attacker of the monster - nobody has attacked it yet when the window
# is opened. Mind that the engine floors that penalty at 10% of the base chance,
# so this never brings a chance down to a plain 0%.
# Default: True
DropListApplyLevelPenalty = True
