# ===========================================================================
# Raid boss book
# ===========================================================================
# Behavior of the raid boss book, an item a player right clicks to open a
# window listing every raid boss of the server - handled by the
# RaidBookManager.
#
# Which item carries the book, and how a player gets it, isn't set here : the
# book is bound to an item by the "handler" attribute of data/xml/items
# ("RaidBossBook"), so any amount of items can open it.
#
# The whole appearance (colors, labels, column widths and the level ranges of
# the filter menu) lives on the datapack side, in data/xml/raidbook.xml, and
# the item icons in data/xml/itemIcons.xml. Nothing is duplicated between
# those files and this one : this one only holds what the server owner tunes,
# the XMLs hold what the player sees.
#
# Note : .properties files are read as ISO-8859-1, so no localized text can be
# set here. Every player facing string is defined on the XML.


# False removes the whole feature : the book item does nothing, no kill is
# recorded and no hunting level scales any damage.
# Default: True
RaidBookEnabled = True

# Amount of raid bosses shown per page of the main list, and of ranking
# positions per page of the ladder. It also drives the height reserved for the
# list, which keeps the page selector pinned to the bottom of the dialog
# whatever the amount of shown rows - see the "pageHeight" of the XML.
# Default: 8
RaidBookRowsPerPage = 8

# Amount of rows shown per page of a detail page tab - the rewards, the drop,
# the history and the ranking of one raid boss. It is lower than the list one
# because a detail page already spends most of its height on the statistics
# and the hunting blocks sitting above the tab.
#
# Mind the client limit : a generated page above 8192 characters is refused
# and replaced by an error message, so raising this too high breaks the tabs
# rather than making them longer.
# Default: 4
RaidBookTabRowsPerPage = 4

# Amount of kills one hunting level takes. The very first level is reached on
# the first kill, and every following one takes that amount : with the default
# 5, level 1 is 1 kill, level 2 is 5 kills, level 3 is 10, level 4 is 15, and
# so on without any end.
#
# It can't be set below 2 : a single kill per level would make the first level
# - which is already reached on the first kill - as long as any other one, and
# leave the progress bar of a fresh level already full.
# Default: 5
RaidBookKillsPerLevel = 5

# Highest hunting level reachable on a single raid boss. 0 leaves them
# endless, which is what the feature is built for ; a positive value caps both
# the damage bonus and the reward list, and the progress bar of a capped level
# reads as full.
# Default: 0
RaidBookMaxLevel = 0

# Amount of damage, in percent, one hunting level adds to what the owner of
# that level deals to that very raid boss - and to that boss only. It is
# applied on the damage the boss takes rather than on the damage the attacker
# rolls, so it rides on top of every damage source : hits, skills and damage
# over time alike. Mind that the numbers flying over the boss are the ones the
# attacker rolled, so they don't show the bonus.
# Default: 1
RaidBookDamagePerLevel = 1

# Highest damage bonus, in percent, the hunting levels can add up to. 0
# removes the cap, which lets the bonus grow along with the levels.
# Default: 0
RaidBookMaxDamageBonus = 0

# Ranking points one raid boss kill is worth :
#   RaidBookPointsPerKill + boss level * RaidBookPointsPerBossLevel
# The points are summed over every raid boss into one single server wide
# ladder, the one the head of the book links to.
# Default: 10 / 1
RaidBookPointsPerKill = 10
RaidBookPointsPerBossLevel = 1

# True credits the kill to every member of the party of the killer, False to
# the sole character who landed the killing blow. A raid boss is a party
# target, so crediting the killer alone leaves the book unreadable to everyone
# else who fought it.
#
# The kill history always names the character who landed the killing blow,
# whatever this is set to.
# Default: True
RaidBookCreditParty = True

# Amount of kills kept on the history of one raid boss. Whatever falls out of
# that window is dropped from the database too, on the next kill of that boss,
# so the table never grows past bosses * this amount.
# Default: 20
RaidBookHistorySize = 20

# Amount of ranking positions kept on the ladders - the server wide one and
# the per boss one alike.
# Default: 100
RaidBookRankingSize = 100

# Amount of coming hunting levels shown by the "rewards" tab. It opens on the
# very next level rather than on the first one : what a player reads a reward
# list for is what he is about to earn.
# Default: 5
RaidBookShownRewards = 5

# Rewards given when a hunting level is reached, written as
#   level:itemId,count[,itemId,count...];level:...
# A level which isn't listed falls back to RaidBookDefaultReward, which is
# what answers for the endless levels past the listed ones. An empty default
# simply gives nothing.
#
# Both are read by the "rewards" tab too, so whatever is set here is what the
# player is shown.
# Default: (empty)
RaidBookLevelRewards = 1:57,100000;2:57,250000;3:57,500000;4:57,1000000;5:57,2000000
RaidBookDefaultReward = 57,2000000

# True folds the server rates (RateDropItemsByRaid, RateDropCurrency,
# RateDropHerbs) into the chances shown by the "drop" tab, so the book tells
# what actually happens on this server. False shows the raw retail chances of
# the droplist table.
#
# A rate is an amount of rolls of a category, not a multiplier of its chance,
# so the folded chance is capped at 100% instead of growing past it.
# Default: True
RaidBookApplyRates = True

# True folds the deep blue penalty of the very player reading the book into
# the chances shown by the "drop" tab, so an overleveled player is told what he
# actually gets. The penalty is the one "UseDeepBlueDropRules" of
# character.properties drives, and a raid boss forgives 2 levels where a
# regular monster forgives 5.
# Default: True
RaidBookApplyLevelPenalty = True
