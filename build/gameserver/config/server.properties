# ===========================================================================
# Сервер
# ===========================================================================
# Идентичность этой установки: адреса, которые сервер слушает и объявляет,
# база данных, с которой он работает, и то, как он отображается в списке
# серверов клиента.
#
# Именно эти настройки CI-пайплайн переписывает при деплое (см.
# .github/actions/configure-server); всё, что относится к игровому процессу,
# лежит в других файлах этой папки.


# ---------------------------------------------------------------------------
# Сеть
# ---------------------------------------------------------------------------

# Адрес, передаваемый клиентам, поэтому это должен быть IP или разрешаемое
# имя хоста. Оставьте *, чтобы логин-сервер определил его сам.
# По умолчанию: *
Hostname = *

# Адрес привязки игрового сервера. * привязывает все доступные IP.
# По умолчанию: * / 7777
GameserverHostname = *
GameserverPort = 7777

# Адрес и порт логин-сервера, на котором регистрируется этот игровой сервер.
# По умолчанию: 127.0.0.1 / 9014
LoginHost = 127.0.0.1
LoginPort = 9014

# Идентификатор сервера, запрашиваемый у логин-сервера. Он определяет имя,
# показываемое в списке серверов, из login/serverNames.xml.
# По умолчанию: 0
RequestServerID = 1

# Если True, логин-сервер выдаёт другой идентификатор, когда запрошенный уже
# занят, вместо отказа в регистрации.
# По умолчанию: True
AcceptAlternateID = True

# Шифровать данные пакетов, которыми обмениваются сервер и клиент, алгоритмом
# Blowfish.
# /!\ Не меняйте это значение с перезагрузкой конфига на работающем сервере.
# Все подключённые клиенты зависнут, ожидая рас/шифрованные пакеты и получая
# противоположное.
# По умолчанию: True
UseBlowfishCipher = True


# ---------------------------------------------------------------------------
# База данных
# ---------------------------------------------------------------------------

# JDBC-строка подключения к базе данных игрового сервера. Несколько вариантов
# оставлены ниже в комментариях как напоминание об ожидаемом синтаксисе.
# По умолчанию: jdbc:mariadb://localhost/acis
URL = jdbc:mariadb://localhost/acis
#URL = jdbc:mysql://localhost/acis?serverTimezone=UTC
#URL = jdbc:hsqldb:hsql://localhost/acis
#URL = jdbc:sqlserver://localhost/database=acis/user=sa/password=

# Учётные данные этой базы данных.
# По умолчанию: root / (пусто)
Login = root
Password =


# ---------------------------------------------------------------------------
# Список серверов
# ---------------------------------------------------------------------------
# Как сервер представлен в списке серверов клиента.

# Показывать [] перед названием сервера.
# По умолчанию: False
ServerListBrackets = False

# Показывать часы рядом с названием сервера.
# По умолчанию: False
ServerListClock = False

# Минимальный возраст, требуемый для входа на сервер. 0 отключает
# ограничение.
# По умолчанию: 0
ServerListAgeLimit = 0

# Если True, входить разрешено только ГМам.
# По умолчанию: False
ServerGMOnly = False

# Если True, сервер помечается как тестовый и отображается только в тестовых
# клиентах.
# По умолчанию: False
TestServer = False

# Если True, сервер отображается как обычный PvP-сервер.
# По умолчанию: True
PvpServer = True


# ---------------------------------------------------------------------------
# Персонажи
# ---------------------------------------------------------------------------

# Задержка в днях перед тем, как персонаж, помеченный на удаление, будет
# действительно удалён. 0 удаляет его мгновенно.
# По умолчанию: 7
DeleteCharAfterDays = 7

# Количество игроков, которым разрешено играть одновременно.
# По умолчанию: 100
MaximumOnlineUsers = 100
