# ===========================================================================
# Рейты
# ===========================================================================
# Все множители, применяемые к опыту, очкам умений, дропу и наградам за
# квесты, а также шансы дропа при смерти игрока или ПК.


# ---------------------------------------------------------------------------
# Опыт и очки умений
# ---------------------------------------------------------------------------

# Множители опыта / очков умений в одиночку и в группе.
# По умолчанию: 1. для всех
RateXp = 1.
RateSp = 1.
RatePartyXp = 1.
RatePartySp = 1.


# ---------------------------------------------------------------------------
# Дроп с монстров
# ---------------------------------------------------------------------------

# RateDropCurrency влияет и на адену, и на печатные камни (Seal Stones).
# По умолчанию: 1. для всех
RateDropCurrency = 1.
RateDropItems = 1.
RateRaidDropItems = 1.
RateDropSpoil = 1.
RateDropHerbs = 1.

# Количество урожая и семян, получаемых с моба мануфактуры. Целое число.
# По умолчанию: 1
RateDropManor = 1


# ---------------------------------------------------------------------------
# Квесты
# ---------------------------------------------------------------------------

# Шанс дропа и количество квестовых предметов, затем количество опыта, очков
# умений и адены, выдаваемых в награду за квест.
# По умолчанию: 1. для всех
RateQuestDrop = 1.
RateQuestReward = 1.
RateQuestRewardXP = 1.
RateQuestRewardSP = 1.
RateQuestRewardAdena = 1.


# ---------------------------------------------------------------------------
# Разное
# ---------------------------------------------------------------------------

# Количество опыта, теряемого при смерти игрока с кармой.
# По умолчанию: 1.
RateKarmaExpLost = 1

# Цена наёмников, нанимаемых для осады.
# По умолчанию: 1.
RateSiegeGuardsPrice = 1


# ---------------------------------------------------------------------------
# Дроп при смерти игрока
# ---------------------------------------------------------------------------
# Применяется, когда игрок погибает с кармой или его убивает ПК. Значения в
# процентах (%), кроме лимитов, которые задают количество предметов.

# Максимальное количество предметов, выпадающих с обычного игрока, затем
# шансы выронить хоть что-нибудь, предмет, надетую вещь и надетое оружие.
# По умолчанию: 3 / 5 / 70 / 25 / 5
PlayerDropLimit = 0
PlayerRateDrop = 0
PlayerRateDropItem = 0
PlayerRateDropEquip = 0
PlayerRateDropEquipWeapon = 0

# Те же значения, применяемые к игроку с кармой.
# По умолчанию: 10 / 70 / 50 / 40 / 10
KarmaDropLimit = 10
KarmaRateDrop = 40
KarmaRateDropItem = 50
KarmaRateDropEquip = 40
KarmaRateDropEquipWeapon = 10


# ---------------------------------------------------------------------------
# Питомцы
# ---------------------------------------------------------------------------

# Опыт, получаемый питомцами, количество потребляемой еды и опыт, получаемый
# Sin Eater. PetFoodRate — целое число.
# По умолчанию: 1. / 1 / 1.
PetXpRate = 1.
PetFoodRate = 1
SinEaterXpRate = 1.
