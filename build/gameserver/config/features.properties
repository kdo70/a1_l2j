# ===========================================================================
# Возможности
# ===========================================================================
# Общесерверные переключатели, включающие или отключающие целые игровые
# возможности.
#
# Примечание: файлы .properties читаются в кодировке ISO-8859-1, поэтому
# задавать здесь локализованный текст (в значениях) нельзя.


# ---------------------------------------------------------------------------
# Мир
# ---------------------------------------------------------------------------

# Разрешить игрокам плавать.
# По умолчанию: True
AllowWater = True

# Разрешить лодкам ходить, а игрокам — подниматься на борт.
# По умолчанию: True
AllowBoat = True

# Разрешить выпадение и надевание проклятого оружия (Zariche, Akamanah).
# По умолчанию: True
AllowCursedWeapons = True

# Разрешить персонажам получать урон от падения.
# По умолчанию: True
EnableFallingDamage = True

# Поведение PvP в городских зонах.
#   0 : мирная зона всё время
#   1 : PvP во время осады, только для участников осады
#   2 : PvP всё время
# По умолчанию: 0
ZoneTown = 0


# ---------------------------------------------------------------------------
# Комьюнити-борд
# ---------------------------------------------------------------------------

# Включить комьюнити-борд (Alt+B).
# По умолчанию: False
EnableCommunityBoard = False

# Раздел, открываемый при вызове комьюнити-борда.
# По умолчанию: _bbshome
BBSDefault = _bbshome


# ---------------------------------------------------------------------------
# Разное
# ---------------------------------------------------------------------------

# Показывать "data/html/servnews.htm" при входе персонажа в мир.
# По умолчанию: False
ShowServerNews = False
