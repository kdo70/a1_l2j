# ===========================================================================
# Осады
# ===========================================================================
# Осады замков и осаждаемые кланхоллы. Сами расписания хранятся в базе данных
# и редактируются в игре.


# ---------------------------------------------------------------------------
# Замки
# ---------------------------------------------------------------------------

# Длительность осады в минутах до начала обратного отсчёта.
# По умолчанию: 120
SiegeLength = 120

# Минимальный уровень клана, необходимый для регистрации на осаду.
# По умолчанию: 4
SiegeClanMinLevel = 4

# Максимальное количество кланов, зарегистрированных с каждой стороны.
# По умолчанию: 10 / 10
AttackerMaxClans = 10
DefenderMaxClans = 10

# Задержка в мс перед телепортацией погибшего атакующего обратно к флагу.
# По умолчанию: 10000
AttackerRespawn = 10000


# ---------------------------------------------------------------------------
# Осаждаемые кланхоллы
# ---------------------------------------------------------------------------

# Минимальный уровень клана, необходимый для регистрации на осаду кланхолла.
# По умолчанию: 4
ChSiegeClanMinLevel = 4

# Максимальное количество кланов, зарегистрированных на осаду кланхолла.
# По умолчанию: 10
ChAttackerMaxClans = 10
