# ===========================================================================
# Сеть
# ===========================================================================
# Настройки сетевого слоя: селектора ввода-вывода (MMO) и очереди клиентских
# пакетов, которая ловит флуд. Файл читают оба сервера — и игровой, и
# логин-сервер, — но очередь пакетов используется только игровым.
#
# /!\ Это не игровая механика. Неудачное значение здесь роняет не баланс, а
# сам сервер: игроков начинает отключать, пакеты — теряться, а нагрузка на
# процессор — расти. В апстриме aCis этих настроек не было в конфиге именно
# поэтому. Если нет конкретной причины что-то менять — не меняйте.
#
# Отсутствие этого файла не мешает серверу запуститься: каждый параметр
# откатывается к значению по умолчанию, указанному ниже.


# ---------------------------------------------------------------------------
# Селектор (MMO)
# ---------------------------------------------------------------------------

# Пауза в мс между двумя проходами селектора. Меньшее значение снижает
# задержку и повышает нагрузку на процессор, большее — наоборот.
# По умолчанию: 20
SelectorSleepTime = 20

# Количество пакетов, отправляемых и читаемых за один проход селектора.
# По умолчанию: 80 / 80
MaxSendPerPass = 80
MaxReadPerPass = 80

# Количество вспомогательных буферов, которые селектор держит наготове.
# По умолчанию: 20
HelperBufferCount = 20

# Если True, игровой сервер просит логин-сервер зарезервировать за ним его
# адрес при регистрации.
# По умолчанию: False
ReserveHostOnLogin = False


# ---------------------------------------------------------------------------
# Очередь клиентских пакетов
# ---------------------------------------------------------------------------
# Защита от флуда пакетами на стороне игрового сервера. Клиент, превысивший
# эти пороги, считается флудящим и отключается.

# Размер очереди пакетов одного клиента и максимальный размер всплеска.
# 0 означает «рассчитать»: MaxReadPerPass + 2 и MaxReadPerPass + 1
# соответственно.
# По умолчанию: 0 / 0
PacketQueueSize = 0
PacketQueueMaxBurstSize = 0

# Максимальное количество пакетов в секунду от одного клиента.
# По умолчанию: 160
PacketQueueMaxPacketsPerSecond = 160

# Длина окна усреднения, в секундах, по которому считается средний темп.
# По умолчанию: 5
PacketQueueMeasureInterval = 5

# Максимальное среднее количество пакетов в секунду на этом окне.
# По умолчанию: 80
PacketQueueMaxAveragePacketsPerSecond = 80

# Допустимое количество за минуту: обнаруженных флудов, переполнений очереди,
# недочитанных пакетов и неизвестных пакетов. Превышение любого из порогов
# отключает клиента.
# По умолчанию: 2 / 1 / 1 / 5
PacketQueueMaxFloodsPerMin = 2
PacketQueueMaxOverflowsPerMin = 1
PacketQueueMaxUnderflowsPerMin = 1
PacketQueueMaxUnknownPerMin = 5
