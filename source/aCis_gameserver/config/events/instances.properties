# ===========================================================================
# Instances
# ===========================================================================
# Party content instantiated per group : the Four Sepulchers and the
# Dimensional Rift.


# ---------------------------------------------------------------------------
# Four Sepulchers
# ---------------------------------------------------------------------------

# Amount of party members required to enter. Clamped to 2 - 9.
# Default: 4
NeededPartyMembers = 4


# ---------------------------------------------------------------------------
# Dimensional Rift
# ---------------------------------------------------------------------------

# Amount of party members required to enter. Retail is 2, and the whole party
# is teleported out as soon as it drops below that amount.
# Default: 2
RiftMinPartySize = 2

# Delay, in minutes, between two automatic jumps, plus a random amount of 30
# seconds intervals. Retail is 8 minutes, plus 0 to 5 intervals.
# Default: 8 / 5
AutoJumpsDelayMin = 8
AutoJumpsDelayRnd = 5

# Amount of Dimensional Fragments each party member pays to enter, per rift
# level.
# Default: 21 / 24 / 27 / 30 / 33 / 36
RecruitCost = 21
SoldierCost = 24
OfficerCost = 27
CaptainCost = 30
CommanderCost = 33
HeroCost = 36

# Chance, in %, to be teleported to the raid boss Anakazel on a jump.
# Default: 15
AnakazelPortChance = 15
