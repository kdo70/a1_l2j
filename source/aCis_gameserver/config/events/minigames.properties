# ===========================================================================
# Мини-игры
# ===========================================================================
# Два регулярных побочных занятия: лотерея и турнир по рыбалке.


# ---------------------------------------------------------------------------
# Лотерея
# ---------------------------------------------------------------------------

# Включить лотерею вместе с продавцами билетов.
# По умолчанию: True
AllowLottery = True

# Начальный размер джекпота, в аденах.
# По умолчанию: 50000
LotteryPrize = 50000

# Цена билета, в аденах.
# По умолчанию: 2000
LotteryTicketPrice = 2000

# Доля джекпота, делимая между игроками, угадавшими 5, 4 и 3 выигрышных
# номера.
# По умолчанию: 0.6 / 0.2 / 0.2
Lottery5NumberRate = 0.6
Lottery4NumberRate = 0.2
Lottery3NumberRate = 0.2

# Количество адены, выдаваемое игрокам, угадавшим 2 выигрышных номера или
# меньше.
# По умолчанию: 200
Lottery2and1NumberPrize = 200


# ---------------------------------------------------------------------------
# Турнир по рыбалке
# ---------------------------------------------------------------------------

# Включить турнир по рыбалке.
# По умолчанию: True
AllowFishChampionship = True

# Предмет, выдаваемый в награду.
# По умолчанию: 57 (адена)
FishChampionshipRewardItemId = 57

# Количество этого предмета, выдаваемое пяти первым победителям.
# По умолчанию: 800000 / 500000 / 300000 / 200000 / 100000
FishChampionshipReward1 = 800000
FishChampionshipReward2 = 500000
FishChampionshipReward3 = 300000
FishChampionshipReward4 = 200000
FishChampionshipReward5 = 100000
