# ===========================================================================
# Кланы
# ===========================================================================
# Кланы, альянсы и система мануфактуры (manor) на принадлежащих им замках.


# ---------------------------------------------------------------------------
# Штрафы
# ---------------------------------------------------------------------------
# Количество дней, которое персонаж или клан обязан выждать после наступления
# одного из перечисленных событий.

# Перед вступлением в другой клан.
# По умолчанию: 5
DaysBeforeJoinAClan = 1

# Перед созданием нового клана.
# По умолчанию: 10
DaysBeforeCreateAClan = 10

# Перед тем, как роспуск клана вступит в силу.
# По умолчанию: 7
DaysToPassToDissolveAClan = 7

# Перед вступлением в новый альянс, если клан сам покинул свой альянс.
# По умолчанию: 1
DaysBeforeJoinAllyWhenLeaved = 1

# Перед вступлением в новый альянс, если клан был исключён из альянса.
# По умолчанию: 1
DaysBeforeJoinAllyWhenDismissed = 1

# Перед принятием нового клана, если альянс исключил один из своих кланов.
# По умолчанию: 1
DaysBeforeAcceptNewClanWhenDismissed = 1

# Перед созданием нового альянса, если предыдущий был распущен.
# По умолчанию: 10
DaysBeforeCreateNewAllyWhenDissolved = 10


# ---------------------------------------------------------------------------
# Альянсы и войны
# ---------------------------------------------------------------------------

# Максимальное количество кланов в альянсе.
# По умолчанию: 3
MaxNumOfClansInAlly = 3

# Количество участников, необходимое обоим кланам для объявления войны кланов.
# По умолчанию: 15
ClanMembersForWar = 15

# Количество дней, которое клан должен выждать, чтобы объявить ответную войну
# клану.
# По умолчанию: 5
ClanWarPenaltyWhenEnded = 5


# ---------------------------------------------------------------------------
# Клановый склад
# ---------------------------------------------------------------------------

# Если True, привилегия «просмотр склада» также даёт право забирать с него
# предметы.
# По умолчанию: False
MembersCanWithdrawFromClanWH = False


# ---------------------------------------------------------------------------
# Мануфактура (manor)
# ---------------------------------------------------------------------------

# Включить систему мануфактуры на всех замках.
# По умолчанию: True
AllowManor = True

# Время суток (час и минута), в которое обновляется период мануфактуры.
# По умолчанию: 20 / 0 (20:00)
ManorRefreshTime = 20
ManorRefreshMin = 0

# Время суток (час и минута), в которое утверждается следующий период.
# По умолчанию: 6 / 0 (06:00)
ManorApproveTime = 6
ManorApproveMin = 0

# Длительность периода технического обслуживания, в минутах.
# По умолчанию: 6
ManorMaintenanceMin = 6

# Интервал, в часах, между двумя сохранениями производства мануфактуры.
# По умолчанию: 2
ManorSavePeriodRate = 2
