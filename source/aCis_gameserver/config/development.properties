# ===========================================================================
# Development
# ===========================================================================
# Debug switches and audit logs. All of them are meant for a test server ;
# they either flood the logs or cripple the world.


# ---------------------------------------------------------------------------
# Debug
# ---------------------------------------------------------------------------

# Skip the spawn tables loading, leaving the world empty of NPCs.
# Default: False
NoSpawns = False

# Verbose debug messages. They easily flood the gameserver logs.
# Default: False
Developer = False

# Log every unknown or unhandled client packet.
# Default: False
PacketHandlerDebug = False


# ---------------------------------------------------------------------------
# Logs
# ---------------------------------------------------------------------------

# Log the chat, on log/chat.
# Default: False
LogChat = False

# Log the item handling, on log/item. This can be very space consuming.
# Default: False
LogItems = False

# Log the GM actions, on log/gmaudit.
# Default: False
GMAudit = False
