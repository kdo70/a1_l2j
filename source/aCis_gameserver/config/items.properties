# ===========================================================================
# Items
# ===========================================================================
# Life cycle of the items lying on the ground : how they are picked up, how
# long they survive, and what a player is allowed to do with them.


# ---------------------------------------------------------------------------
# Auto-loot
# ---------------------------------------------------------------------------

# Send regular monster drops straight to the killer's inventory.
# Default: False
AutoLoot = False

# Same, for raid boss drops.
# Default: False
AutoLootRaid = False

# If False, herbs keep dropping on the ground even when AutoLoot is enabled.
# Default: False
AutoLootHerbs = False


# ---------------------------------------------------------------------------
# Ground items
# ---------------------------------------------------------------------------

# Allow players to drop items on the ground.
# Default: True
AllowDiscardItem = True

# Allow the creation of multiple non-stackable items at once.
# Default: True
MultipleItemDrop = True

# Delay, in seconds, before a dropped herb is destroyed. 0 disables it.
# Default: 15
AutoDestroyHerbTime = 15

# Delay, in seconds, before a dropped item is destroyed. 0 disables it.
# Default: 600
AutoDestroyItemTime = 600

# Same, for equipable items (armors, weapons, jewels). 0 disables it.
# Default: 0
AutoDestroyEquipableItemTime = 0

# Per item exceptions, overriding the delays above.
# Format: itemId-seconds,itemId-seconds...
#   57-0   : item id 57 is never destroyed.
#   57-600 : item id 57 is destroyed after 600 seconds.
# Default: 57-0,5575-0,6673-0
AutoDestroySpecialItemTime = 57-0,5575-0,6673-0

# Multiplier applied on the destroy delay of the items dropped by players.
# 0 makes them stay forever.
# Default: 1
PlayerDroppedItemMultiplier = 1


# ---------------------------------------------------------------------------
# Try on
# ---------------------------------------------------------------------------

# Allow players to try weapons and armors on in shops. Each try costs
# WearPrice Adena, and the item is worn for WearDelay seconds.
# Default: True / 5 / 10
AllowWear = True
WearDelay = 5
WearPrice = 10
