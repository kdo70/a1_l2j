# ===========================================================================
# Server
# ===========================================================================
# Identity of this installation : the addresses it binds and announces, the
# database it talks to, and the way it shows up on the client server list.
#
# These are the settings the CI pipeline rewrites on deploy (see
# .github/actions/configure-server) ; everything gameplay related lives in the
# other files of this folder.


# ---------------------------------------------------------------------------
# Network
# ---------------------------------------------------------------------------

# Address transmitted to the clients, so it has to be an IP or a resolvable
# hostname. Leave * to let the loginserver resolve it.
# Default: *
Hostname = *

# Bind address of the gameserver. * binds every available IP.
# Default: * / 7777
GameserverHostname = *
GameserverPort = 7777

# Address and port of the loginserver this gameserver registers on.
# Default: 127.0.0.1 / 9014
LoginHost = 127.0.0.1
LoginPort = 9014

# Server id requested to the loginserver. It picks the name shown on the
# server list, out of login/serverNames.xml.
# Default: 0
RequestServerID = 1

# If True, the loginserver hands another id over when the requested one is
# already taken, instead of refusing the registration.
# Default: True
AcceptAlternateID = True

# Encrypt the packet data exchanged between server and client with Blowfish.
# /!\ Don't edit this value and reload the config while the server is running.
# Every connected client would hang, waiting for de/crypted packets while
# receiving the opposite.
# Default: True
UseBlowfishCipher = True


# ---------------------------------------------------------------------------
# Database
# ---------------------------------------------------------------------------

# JDBC URL of the gameserver database. A few alternatives are kept commented
# out below, as a reminder of the expected syntax.
# Default: jdbc:mariadb://localhost/acis
URL = jdbc:mariadb://localhost/acis
#URL = jdbc:mysql://localhost/acis?serverTimezone=UTC
#URL = jdbc:hsqldb:hsql://localhost/acis
#URL = jdbc:sqlserver://localhost/database=acis/user=sa/password=

# Credentials of that database.
# Default: root / (empty)
Login = root
Password =


# ---------------------------------------------------------------------------
# Server list
# ---------------------------------------------------------------------------
# How the server is advertised on the client server list.

# Display [] in front of the server name.
# Default: False
ServerListBrackets = False

# Display a clock next to the server name.
# Default: False
ServerListClock = False

# Minimum age required to enter the server. 0 disables the restriction.
# Default: 0
ServerListAgeLimit = 0

# If True, only GMs are allowed to log in.
# Default: False
ServerGMOnly = False

# If True, the server is flagged as a test server, and is only listed by
# testserver clients.
# Default: False
TestServer = False

# If True, the server is listed as a regular PvP server.
# Default: True
PvpServer = True


# ---------------------------------------------------------------------------
# Characters
# ---------------------------------------------------------------------------

# Delay, in days, before a character marked for deletion is actually erased.
# 0 deletes it instantly.
# Default: 7
DeleteCharAfterDays = 7

# Amount of players allowed to play simultaneously.
# Default: 100
MaximumOnlineUsers = 100
