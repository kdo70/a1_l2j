# ===========================================================================
# Rates
# ===========================================================================
# Every multiplier applied on experience, skill points, drops and quest
# rewards, plus the drop chances used when a player or a PK dies.


# ---------------------------------------------------------------------------
# Experience and skill points
# ---------------------------------------------------------------------------

# Solo and party experience / skill points multipliers.
# Default: 1. for all
RateXp = 1.
RateSp = 1.
RatePartyXp = 1.
RatePartySp = 1.


# ---------------------------------------------------------------------------
# Monster drops
# ---------------------------------------------------------------------------

# RateDropCurrency affects both Adena and Seal Stones.
# Default: 1. for all
RateDropCurrency = 1.
RateDropItems = 1.
RateRaidDropItems = 1.
RateDropSpoil = 1.
RateDropHerbs = 1.

# Amount of crops and seeds harvested on a manor mob. Integer value.
# Default: 1
RateDropManor = 1


# ---------------------------------------------------------------------------
# Quests
# ---------------------------------------------------------------------------

# Drop chance and reward amount of the quest items, then the amount of
# experience, skill points and Adena given as a quest reward.
# Default: 1. for all
RateQuestDrop = 1.
RateQuestReward = 1.
RateQuestRewardXP = 1.
RateQuestRewardSP = 1.
RateQuestRewardAdena = 1.


# ---------------------------------------------------------------------------
# Misc
# ---------------------------------------------------------------------------

# Amount of experience lost when a karma player dies.
# Default: 1.
RateKarmaExpLost = 1

# Price of the mercenaries hired for a siege.
# Default: 1.
RateSiegeGuardsPrice = 1


# ---------------------------------------------------------------------------
# Player death drops
# ---------------------------------------------------------------------------
# Applied when a player dies with karma, or is killed by a PK. Percent (%)
# values, except the limits which are item amounts.

# Maximum amount of items dropped by a regular player, then the chances to
# drop anything at all, an item, an equipped piece and an equipped weapon.
# Default: 3 / 5 / 70 / 25 / 5
PlayerDropLimit = 0
PlayerRateDrop = 0
PlayerRateDropItem = 0
PlayerRateDropEquip = 0
PlayerRateDropEquipWeapon = 0

# Same values, applied on a player owning karma.
# Default: 10 / 70 / 50 / 40 / 10
KarmaDropLimit = 10
KarmaRateDrop = 40
KarmaRateDropItem = 50
KarmaRateDropEquip = 40
KarmaRateDropEquipWeapon = 10


# ---------------------------------------------------------------------------
# Pets
# ---------------------------------------------------------------------------

# Experience gained by pets, amount of food consumed, and experience gained by
# the Sin Eater. PetFoodRate is an integer value.
# Default: 1. / 1 / 1.
PetXpRate = 1.
PetFoodRate = 1
SinEaterXpRate = 1.
