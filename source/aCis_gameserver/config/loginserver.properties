# ===========================================================================
# Loginserver
# ===========================================================================
# Identity of the loginserver : the addresses it binds and announces, the
# database it talks to, and how it protects itself against brute force.
#
# These are the settings the CI pipeline rewrites on deploy (see
# .github/actions/configure-server).


# ---------------------------------------------------------------------------
# Network
# ---------------------------------------------------------------------------

# Address transmitted to the clients, so it has to be an IP or a resolvable
# hostname.
# Default: localhost
Hostname = localhost

# Bind address and port of the loginserver, the ones the clients connect to.
# * binds every available IP.
# Default: * / 2106
LoginserverHostname = *
LoginserverPort = 2106

# Bind address and port the gameservers register on.
# Default: * / 9014
LoginHostname = *
LoginPort = 9014

# If True, any gameserver can register on a free slot of this loginserver.
# Default: False
AcceptNewGameServer = False

# If False, the licence shown right after the login is skipped.
# Default: True
ShowLicence = True


# ---------------------------------------------------------------------------
# Database
# ---------------------------------------------------------------------------

# JDBC URL of the loginserver database. A few alternatives are kept commented
# out below, as a reminder of the expected syntax.
# Default: jdbc:mariadb://localhost/acis
URL = jdbc:mariadb://localhost/acis
#URL = jdbc:mysql://localhost/acis?serverTimezone=UTC
#URL = jdbc:hsqldb:hsql://localhost/acis
#URL = jdbc:sqlserver://localhost/database=acis/user=sa/password=

# Credentials of that database.
# Default: root / (empty)
Login = root
Password =


# ---------------------------------------------------------------------------
# Accounts
# ---------------------------------------------------------------------------

# If True, an account is created on the fly on the first login attempt.
# Default: True
AutoCreateAccounts = True


# ---------------------------------------------------------------------------
# Security
# ---------------------------------------------------------------------------

# Amount of invalid account/password attempts tolerated before the IP is
# banned.
# Default: 3
LoginTryBeforeBan = 3

# Duration, in seconds, of that ban.
# Default: 600 (10 minutes)
LoginBlockAfterBan = 600

# Enable the connection flood protection.
# Default: True
EnableFloodProtection = True

# Amount of connections an IP is allowed to open before NormalConnectionTime
# starts being enforced.
# Default: 15
FastConnectionLimit = 15

# Delay, in ms, required between two connections of an IP which went past
# FastConnectionLimit.
# Default: 700
NormalConnectionTime = 700

# Delay, in ms, required between two connections of any IP. Anything faster is
# refused right away.
# Default: 350
FastConnectionTime = 350

# Amount of simultaneous connections tolerated per IP.
# Default: 50
MaxConnectionPerIP = 50
