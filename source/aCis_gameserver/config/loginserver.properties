# ===========================================================================
# Логин-сервер
# ===========================================================================
# Идентичность логин-сервера: адреса, которые он слушает и объявляет, база
# данных, с которой он работает, и то, как он защищается от перебора.
#
# Именно эти настройки CI-пайплайн переписывает при деплое (см.
# .github/actions/configure-server).


# ---------------------------------------------------------------------------
# Сеть
# ---------------------------------------------------------------------------

# Адрес, передаваемый клиентам, поэтому это должен быть IP или разрешаемое
# имя хоста.
# По умолчанию: localhost
Hostname = localhost

# Адрес привязки и порт логин-сервера — те, к которым подключаются клиенты.
# * привязывает все доступные IP.
# По умолчанию: * / 2106
LoginserverHostname = *
LoginserverPort = 2106

# Адрес привязки и порт, на которых регистрируются игровые серверы.
# По умолчанию: * / 9014
LoginHostname = *
LoginPort = 9014

# Если True, любой игровой сервер может зарегистрироваться на свободном слоте
# этого логин-сервера.
# По умолчанию: False
AcceptNewGameServer = False

# Если False, лицензия, показываемая сразу после входа, пропускается.
# По умолчанию: True
ShowLicence = True


# ---------------------------------------------------------------------------
# База данных
# ---------------------------------------------------------------------------

# JDBC-строка подключения к базе данных логин-сервера. Несколько вариантов
# оставлены ниже в комментариях как напоминание об ожидаемом синтаксисе.
# По умолчанию: jdbc:mariadb://localhost/acis
URL = jdbc:mariadb://localhost/acis
#URL = jdbc:mysql://localhost/acis?serverTimezone=UTC
#URL = jdbc:hsqldb:hsql://localhost/acis
#URL = jdbc:sqlserver://localhost/database=acis/user=sa/password=

# Учётные данные этой базы данных.
# По умолчанию: root / (пусто)
Login = root
Password =


# ---------------------------------------------------------------------------
# Аккаунты
# ---------------------------------------------------------------------------

# Если True, аккаунт создаётся на лету при первой попытке входа.
# По умолчанию: True
AutoCreateAccounts = True


# ---------------------------------------------------------------------------
# Безопасность
# ---------------------------------------------------------------------------

# Количество неверных попыток ввода аккаунта/пароля, после которого IP
# банится.
# По умолчанию: 3
LoginTryBeforeBan = 3

# Длительность этого бана, в секундах.
# По умолчанию: 600 (10 минут)
LoginBlockAfterBan = 600

# Включить защиту от флуда подключениями.
# По умолчанию: True
EnableFloodProtection = True

# Количество подключений, которое IP разрешено открыть до того, как начнёт
# применяться NormalConnectionTime.
# По умолчанию: 15
FastConnectionLimit = 15

# Задержка в мс, требуемая между двумя подключениями IP, превысившего
# FastConnectionLimit.
# По умолчанию: 700
NormalConnectionTime = 700

# Задержка в мс, требуемая между двумя подключениями любого IP. Всё, что
# быстрее, отклоняется сразу.
# По умолчанию: 350
FastConnectionTime = 350

# Количество одновременных подключений, допустимое для одного IP.
# По умолчанию: 50
MaxConnectionPerIP = 50
