# ===========================================================================
# Sieges
# ===========================================================================
# Castle sieges and siegable clan halls. The schedules themselves are stored
# on the database, and edited in game.


# ---------------------------------------------------------------------------
# Castles
# ---------------------------------------------------------------------------

# Duration, in minutes, of a siege before the countdown starts.
# Default: 120
SiegeLength = 120

# Minimum clan level required to register on a siege.
# Default: 4
SiegeClanMinLevel = 4

# Maximum amount of clans registered on each side.
# Default: 10 / 10
AttackerMaxClans = 10
DefenderMaxClans = 10

# Delay, in ms, before a dead attacker is teleported back to the flag.
# Default: 10000
AttackerRespawn = 10000


# ---------------------------------------------------------------------------
# Siegable halls
# ---------------------------------------------------------------------------

# Minimum clan level required to register on a clan hall siege.
# Default: 4
ChSiegeClanMinLevel = 4

# Maximum amount of clans registered on a clan hall siege.
# Default: 10
ChAttackerMaxClans = 10
