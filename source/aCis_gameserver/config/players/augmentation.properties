# ===========================================================================
# Augmentation
# ===========================================================================
# Chances of the augmentation results, and cost of the augmentation made
# without any NPC.


# ---------------------------------------------------------------------------
# Chances
# ---------------------------------------------------------------------------

# Chance, in %, to get a skill, per life stone grade.
# Default: 15 / 30 / 45 / 60
AugmentationNGSkillChance = 15
AugmentationMidSkillChance = 30
AugmentationHighSkillChance = 45
AugmentationTopSkillChance = 60

# Chance, in %, to get a base stat modifier. It doesn't depend on the life
# stone grade.
# Default: 1
AugmentationBaseStatChance = 1

# Chance, in %, to get a glow effect, per life stone grade. No and mid grade
# life stones can't glow without a skill or a base stat modifier.
# Default: 0 / 40 / 70 / 100
AugmentationNGGlowChance = 0
AugmentationMidGlowChance = 40
AugmentationHighGlowChance = 70
AugmentationTopGlowChance = 100


# ---------------------------------------------------------------------------
# Augmentation without NPC
# ---------------------------------------------------------------------------

# Allow the equipped weapon to be augmented by double-clicking a life stone in
# the inventory. No NPC is needed, but the usual weapon grade and life stone
# level checks still apply. If False, only the NPC can augment.
# Default: True
AugmentationViaLifeStone = True

# Cost of that augmentation, one entry per life stone grade.
# Format: itemId,count. The items are taken from the player inventory ; when
# he can't afford it, a message tells him what is missing. A count of 0 makes
# the augmentation free.
# Default: 2130,20 / 2130,30 / 2131,20 / 2131,25
AugmentationViaLifeStoneCostNoGrade = 2130,20
AugmentationViaLifeStoneCostMidGrade = 2130,30
AugmentationViaLifeStoneCostHighGrade = 2131,20
AugmentationViaLifeStoneCostTopGrade = 2131,25
