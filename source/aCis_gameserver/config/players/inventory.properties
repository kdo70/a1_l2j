# ===========================================================================
# Inventory
# ===========================================================================
# Storage owned by a character : inventory, warehouses and freight.


# ---------------------------------------------------------------------------
# Inventory
# ---------------------------------------------------------------------------

# Amount of inventory slots, per race and for the pets.
# Default: 80 / 100 / 12
MaximumSlotsForNoDwarf = 80
MaximumSlotsForDwarf = 100
MaximumSlotsForPet = 12

# Weight limit multiplier, applied on both players and pets.
# Default: 1.
WeightLimit = 1.


# ---------------------------------------------------------------------------
# Warehouse
# ---------------------------------------------------------------------------

# Enable the private and clan warehouses.
# Default: True
AllowWarehouse = True

# Amount of warehouse slots. Keep them below 300, or the client crashes.
# Dwarves get their bonus from level 60.
# Default: 120 / 100 / 150
MaximumWarehouseSlotsForDwarf = 120
MaximumWarehouseSlotsForNoDwarf = 100
MaximumWarehouseSlotsForClan = 200


# ---------------------------------------------------------------------------
# Freight
# ---------------------------------------------------------------------------

# Enable the freight.
# Default: True
AllowFreight = True

# Amount of freight slots.
# Default: 20
MaximumFreightSlots = 20

# If True, a freight can only be withdrawn on the region it was sent to.
# If False, it can be withdrawn from anywhere.
# Default: True
RegionBasedFreight = True

# Price, in Adena, charged per item slot sent to the freight.
# Note : the client keeps showing the retail price, but the player is really
# charged the value set here.
# Default: 1000
FreightPrice = 1000
