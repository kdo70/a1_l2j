# ===========================================================================
# Инвентарь
# ===========================================================================
# Хранилища, принадлежащие персонажу: инвентарь, склады и пересылка (freight).


# ---------------------------------------------------------------------------
# Инвентарь
# ---------------------------------------------------------------------------

# Количество слотов инвентаря, по расам и для питомцев.
# По умолчанию: 80 / 100 / 12
MaximumSlotsForNoDwarf = 80
MaximumSlotsForDwarf = 100
MaximumSlotsForPet = 12

# Множитель предела веса, применяемый и к игрокам, и к питомцам.
# По умолчанию: 1.
WeightLimit = 1.


# ---------------------------------------------------------------------------
# Склад
# ---------------------------------------------------------------------------

# Включить личный и клановый склады.
# По умолчанию: True
AllowWarehouse = True

# Количество слотов склада. Держите их ниже 300, иначе клиент падает. Гномы
# получают свой бонус с 60-го уровня.
# По умолчанию: 120 / 100 / 150
MaximumWarehouseSlotsForDwarf = 120
MaximumWarehouseSlotsForNoDwarf = 100
MaximumWarehouseSlotsForClan = 200


# ---------------------------------------------------------------------------
# Пересылка (freight)
# ---------------------------------------------------------------------------

# Включить пересылку.
# По умолчанию: True
AllowFreight = True

# Количество слотов пересылки.
# По умолчанию: 20
MaximumFreightSlots = 20

# Если True, посылку можно забрать только в том регионе, куда она была
# отправлена. Если False, её можно забрать откуда угодно.
# По умолчанию: True
RegionBasedFreight = True

# Цена в аденах, взимаемая за каждый слот предмета, отправленный посылкой.
# Примечание: клиент продолжает показывать ретейльную цену, но с игрока
# реально берётся заданное здесь значение.
# По умолчанию: 1000
FreightPrice = 1000
