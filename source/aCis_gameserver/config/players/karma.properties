# ===========================================================================
# Карма и PvP
# ===========================================================================
# Что разрешено игроку с кармой, что с него падает при смерти и сколько
# держится PvP-флаг.
#
# Сами шансы дропа задаются в config/rates.properties.


# ---------------------------------------------------------------------------
# Ограничения по карме
# ---------------------------------------------------------------------------
# Действия, разрешённые игроку, имеющему карму.

# По умолчанию: False
KarmaPlayerCanShop = False

# По умолчанию: True
KarmaPlayerCanTeleport = True

# По умолчанию: False
KarmaPlayerCanUseGK = False

# По умолчанию: True
KarmaPlayerCanTrade = True

# По умолчанию: True
KarmaPlayerCanUseWareHouse = True


# ---------------------------------------------------------------------------
# Дроп при смерти
# ---------------------------------------------------------------------------

# Количество убийств ПК, после которого игрок начинает ронять предметы при
# смерти.
# По умолчанию: 5
MinimumPKRequiredToDrop = 5

# Если True, ГМ тоже роняет своё снаряжение при смерти.
# По умолчанию: False
CanGMDropEquipment = False

# Предметы, которые не могут выпасть при смерти.
# /!\ Без пробела в конце и без пробелов между числами.

# Предметы питомцев.
# По умолчанию: 2375,3500,3501,3502,4422,4423,4424,4425,6648,6649,6650
ListOfPetItems = 2375,3500,3501,3502,4422,4423,4424,4425,6648,6649,6650

# Предметы, которые ПК никогда не роняет.
# По умолчанию: 1147,425,1146,461,10,2368,7,6,2370,2369
ListOfNonDroppableItemsForPK = 57,1147,425,1146,461,10,2368,7,6,2370,2369


# ---------------------------------------------------------------------------
# PvP-флаг
# ---------------------------------------------------------------------------

# Если True, убийство игрока с кармой приносит очко PvP.
# По умолчанию: True
AwardPKKillPVPPoint = False

# Длительность PvP-флага в мс после удара по невиновному игроку.
# По умолчанию: 40000
PvPVsNormalTime = 40000

# Длительность PvP-флага в мс после удара по игроку с флагом.
# По умолчанию: 20000
PvPVsPvPTime = 20000
