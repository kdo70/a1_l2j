# ===========================================================================
# Окно списка дропа
# ===========================================================================
# Поведение списка дропа, который игрок открывает shift+кликом по монстру —
# в том числе по рейд-боссу, — обрабатываемого DropListManager.
#
# Весь внешний вид (цвета, подписи, ширины колонок и заголовки) живёт на
# стороне датапака, в data/xml/droplist.xml, а иконки предметов — в
# data/xml/itemIcons.xml. Между теми файлами и этим ничего не дублируется:
# здесь только то, что настраивает владелец сервера, в XML — то, что видит
# игрок.
#
# Примечание: файлы .properties читаются в кодировке ISO-8859-1, поэтому
# задавать здесь локализованный текст нельзя. Все строки, видимые игроку,
# определены в XML.


# False полностью убирает эту возможность; shift+клик сохраняет своё обычное
# значение.
# По умолчанию: True
DropListEnabled = True

# Id умения, которым должен обладать игрок, чтобы открыть окно. 0 открывает
# его всем. Игроку без этого умения ничего не сообщается, и у него сохраняется
# ретейльное поведение shift+клика — атака без перемещения, — так что это ещё
# и способ оставить это поведение нетронутым для всех, кроме покупателей
# умения.
# По умолчанию: 0
DropListSkillId = 0

# Количество позиций дропа, показываемых на странице. Оно же задаёт высоту,
# отведённую под список, благодаря чему переключатель страниц остаётся
# прижатым к низу диалога при любом количестве показанных строк — см.
# "pageHeight" в XML.
# По умолчанию: 9
DropListRowsPerPage = 9

# False убирает группы споила, что бы монстр ни нёс.
# По умолчанию: True
DropListShowSpoil = True

# True открывает первую страницу с заголовком, свёрстанным так же, как окно
# состояния персонажа, — два блока по две колонки, — сообщающим, чего стоит
# само убийство и чем сражается монстр: количество HP, которое нужно снять,
# чтобы его убить, и его запас MP, опыт и SP, которые получит за него именно
# тот игрок, что читает окно, затем его физическая и магическая атака, защита
# и скорость. Все числа учитывают чемпионские бонусы монстра.
#
# Заголовок занимает место строк с предметами, которые он перекрывает,
# поэтому первая страница показывает меньше позиций дропа, а не становится
# выше — см. "headerHeight" в XML.
# По умолчанию: True
DropListShowHeader = True

# True учитывает серверные рейты (RateDropItems, RateDropItemsByRaid,
# RateDropSpoil, RateDropCurrency, RateDropHerbs) в показываемых шансах, так
# что окно сообщает, что действительно происходит на этом сервере. False
# показывает исходные ретейльные шансы из таблицы droplist.
#
# Рейт — это количество бросков по категории, а не множитель её шанса,
# поэтому итоговый шанс ограничивается 100%, а не растёт выше.
# По умолчанию: True
DropListApplyRates = True

# True учитывает штраф deep blue именно того игрока, который читает окно, в
# показываемых шансах, так что переросшему игроку сообщается то, что он
# действительно получит, а не то, что записано в таблице droplist. False
# показывает шансы игрока, для которого монстра ещё имеет смысл убивать.
#
# Это тот самый штраф, которым управляет "UseDeepBlueDropRules" из
# character.properties, рассчитанный здесь относительно уровня одного этого
# игрока, а не самого высокоуровневого атакующего монстра — на момент
# открытия окна его ещё никто не атаковал. Учтите, что движок ограничивает
# этот штраф снизу 10% базового шанса, поэтому шанс никогда не падает до
# чистого 0%.
# По умолчанию: True
DropListApplyLevelPenalty = True
