# ===========================================================================
# Глобальный телепортёр
# ===========================================================================
# Поведение и экономика телепортёра, управляемого датапаком и обрабатываемого
# скриптом script.teleport.GlobalGatekeeper.
#
# Содержимое (NPC, вкладки, области, точки телепорта) и весь внешний вид
# (цвета, подписи, ширины колонок и заголовки) живут на стороне датапака, в
# data/xml/gatekeeper.xml. Между этими двумя файлами ничего не дублируется:
# здесь только то, что настраивает владелец сервера, в XML — то, что видит
# игрок.
#
# Примечание: файлы .properties читаются в кодировке ISO-8859-1, поэтому
# задавать здесь локализованный текст нельзя. Все строки, видимые игроку,
# определены в XML.


# ---------------------------------------------------------------------------
# Общее
# ---------------------------------------------------------------------------

# Количество строк, показываемых на странице в каждом генерируемом списке.
# Оно же задаёт высоту, отведённую под список, благодаря чему переключатель
# страниц остаётся прижатым к низу диалога при любом количестве показанных
# строк.
# По умолчанию: 12
RowsPerPage = 12

# Количество точек, хранимых на вкладке «популярное».
# По умолчанию: 20
PopularLimit = 20

# Минимальное количество телепортов, чтобы точка попала на вкладку
# «популярное».
# По умолчанию: 1
PopularMinCount = 1

# Время каста в мс для анимации в духе /unstuck, проигрываемой перед
# телепортом. 0 отключает её, 60000 — максимум.
# По умолчанию: 5000
TeleportDelay = 5000


# ---------------------------------------------------------------------------
# Цены по умолчанию
# ---------------------------------------------------------------------------
# Наследуются меню, вкладками, областями и точками, каждая из которых может
# их переопределить.

# Валюта по умолчанию.
# По умолчанию: 57 (адена)
DefaultPriceId = 57

# Цена по умолчанию для точек STANDARD. -1 означает «рассчитывается по
# формуле ценообразования».
# По умолчанию: -1
DefaultPrice = -1

# Цена по умолчанию для точек NOBLE. -1 назначает им цену как для STANDARD,
# 0 делает их бесплатными (как на официальных серверах).
# По умолчанию: -1
DefaultNoblePrice = -1


# ---------------------------------------------------------------------------
# Динамическое ценообразование
# ---------------------------------------------------------------------------
# Цена точек, у которых нет явной цены в XML. Формула:
#   цена = base * levelRate * karmaRate * nightRate, округлённая до
#          PriceRounding,
#   base = цена точки из XML, если она задана, иначе
#          NearPrice + (FarPrice - NearPrice) * (расстояние / RefDistance) ^ DistanceCurve.
#
# При значениях по умолчанию игрок максимального уровня, телепортирующийся
# днём и без кармы, платит чистую цену за расстояние: ~18k рядом, ~100k на
# другой конец континента.
#
# Отношение расстояний не ограничивается сверху RefDistance — результат
# ограничивает только CapPrice. Ограничение отношения давало бы совершенно
# одинаковую цену для всех точек удалённой области.

# False заставляет телепортёра использовать только цены из XML (незаданные
# цены становятся бесплатными).
# По умолчанию: True
PricingEnabled = True

# Цены округляются до этого шага ради читаемости. 1 отключает округление.
# По умолчанию: 100
PriceRounding = 100

# False убирает базу по расстоянию; точки без явной цены становятся
# бесплатными.
# По умолчанию: True
DistancePriceEnabled = True

# Цена телепорта на месте.
# По умолчанию: 15000
NearPrice = 15000

# Цена телепорта на расстояние RefDistance.
# По умолчанию: 100000
FarPrice = 100000

# Опорное расстояние в игровых единицах. ~240k — это поездка через континент.
# По умолчанию: 240000
RefDistance = 240000

# Показатель степени, применяемый к отношению расстояний. Значения выше 1
# оставляют короткие поездки более дешёвыми.
# По умолчанию: 1.35
DistanceCurve = 1.35

# Абсолютный потолок базы по расстоянию, достигаемый на самых краях карты.
# 0 убирает его.
# По умолчанию: 200000
CapPrice = 200000

# False убирает модификатор по уровню.
# По умолчанию: True
LevelPriceEnabled = True

# Диапазон уровней, на котором растёт коэффициент.
# По умолчанию: 1 / 80
LevelPriceFrom = 1
LevelPriceTo = 80

# Коэффициент, применяемый на LevelPriceFrom и растущий до 1 на LevelPriceTo.
# Значение 1 делает уровень бесплатным.
# По умолчанию: 0.4
LevelPriceMinRate = 0.4

# False убирает модификатор по карме.
# По умолчанию: True
KarmaPriceEnabled = True

# Количество кармы, при котором достигается максимальный штраф за карму.
# По умолчанию: 10000
KarmaPriceCap = 10000

# Дополнительный коэффициент при KarmaPriceCap. 1 означает «двойная цена»,
# 0 — отсутствие штрафа.
# По умолчанию: 1.0
KarmaPriceRate = 1.0

# False убирает модификатор дня/ночи.
# По умолчанию: True
NightPriceEnabled = True

# Коэффициент, применяемый во время игровой ночи.
# По умолчанию: 1.25
NightPriceRate = 1.25
