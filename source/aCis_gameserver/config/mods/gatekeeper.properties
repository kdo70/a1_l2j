# ===========================================================================
# Global Gatekeeper
# ===========================================================================
# Behavior and economy of the datapack driven gatekeeper, handled by the
# script.teleport.GlobalGatekeeper script.
#
# The content (npcs, tabs, areas, teleport points) and the whole appearance
# (colors, labels, column widths and captions) live on the datapack side, in
# data/xml/gatekeeper.xml. Nothing is duplicated between both files : this one
# only holds what the server owner tunes, the XML holds what the player sees.
#
# Note : .properties files are read as ISO-8859-1, so no localized text can be
# set here. Every player facing string is defined on the XML.


# ---------------------------------------------------------------------------
# General
# ---------------------------------------------------------------------------

# Amount of rows shown per page, on every generated list. It also drives the
# height reserved for the list, which keeps the page selector pinned to the
# bottom of the dialog whatever the amount of shown rows.
# Default: 12
RowsPerPage = 12

# Amount of points kept on the "popular" tab.
# Default: 20
PopularLimit = 20

# Minimum amount of teleports for a point to enter the "popular" tab.
# Default: 1
PopularMinCount = 1

# Casting time, in ms, of the /unstuck like animation played before the
# teleport. 0 disables it, 60000 is the maximum.
# Default: 5000
TeleportDelay = 5000


# ---------------------------------------------------------------------------
# Default prices
# ---------------------------------------------------------------------------
# Inherited by menus, tabs, areas and points, which can all override them.

# Default currency.
# Default: 57 (adena)
DefaultPriceId = 57

# Default price of STANDARD points. -1 means "computed by the pricing formula".
# Default: -1
DefaultPrice = -1

# Default price of NOBLE points. -1 prices them like STANDARD ones, 0 makes
# them free (retail-like).
# Default: -1
DefaultNoblePrice = -1


# ---------------------------------------------------------------------------
# Dynamic pricing
# ---------------------------------------------------------------------------
# Price of the points which don't own an explicit XML price. Formula :
#   price = base * levelRate * karmaRate * nightRate, rounded to PriceRounding,
#   base  = the XML price of the point when set, otherwise
#           NearPrice + (FarPrice - NearPrice) * (distance / RefDistance) ^ DistanceCurve.
#
# With the default values, a max level player teleporting by day, without
# karma, pays the raw distance price : ~18k nearby, ~100k on the other side of
# the continent.
#
# The distance ratio isn't capped at RefDistance - only CapPrice bounds the
# result. Capping the ratio would give the very same price to every single
# point of a remote area.

# False makes the gatekeeper use XML prices only (unset prices become free).
# Default: True
PricingEnabled = True

# Prices are rounded to that step, for the sake of readability. 1 disables it.
# Default: 100
PriceRounding = 100

# False removes the distance base ; points without an explicit price become free.
# Default: True
DistancePriceEnabled = True

# Price of a teleport on the spot.
# Default: 15000
NearPrice = 15000

# Price of a teleport at RefDistance.
# Default: 100000
FarPrice = 100000

# Reference distance, in game units. ~240k is a cross continent trip.
# Default: 240000
RefDistance = 240000

# Exponent applied on the distance ratio. Above 1 keeps short trips cheaper.
# Default: 1.35
DistanceCurve = 1.35

# Absolute ceiling of the distance base, reached by the very extremities of the
# map. 0 removes it.
# Default: 200000
CapPrice = 200000

# False removes the level modifier.
# Default: True
LevelPriceEnabled = True

# Level range on which the rate grows.
# Default: 1 / 80
LevelPriceFrom = 1
LevelPriceTo = 80

# Rate applied at LevelPriceFrom, growing up to 1 at LevelPriceTo. 1 makes the
# level free of charge.
# Default: 0.4
LevelPriceMinRate = 0.4

# False removes the karma modifier.
# Default: True
KarmaPriceEnabled = True

# Karma amount at which the maximum karma penalty is reached.
# Default: 10000
KarmaPriceCap = 10000

# Extra rate at KarmaPriceCap. 1 means "twice the price", 0 means no penalty.
# Default: 1.0
KarmaPriceRate = 1.0

# False removes the day/night modifier.
# Default: True
NightPriceEnabled = True

# Rate applied during the game night.
# Default: 1.25
NightPriceRate = 1.25
