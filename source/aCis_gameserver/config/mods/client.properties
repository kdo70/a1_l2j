# ===========================================================================
# Кастомный клиент
# ===========================================================================
# Возможности, существующие только для клиента, пересобранного из tools/client
# (см. tools/client/README.md). Стоковый клиент либо игнорирует их, либо, если
# это отдельно отмечено ниже, ведёт себя некорректно — поэтому все они
# выключены по умолчанию.
#
# Примечание: файлы .properties читаются в кодировке ISO-8859-1, поэтому
# нелатинские символы нужно записывать escape-последовательностями \uXXXX.


# ---------------------------------------------------------------------------
# Проверка версии
# ---------------------------------------------------------------------------
# См. docs/client-version-check.md.

# Версия, которую пересобранный клиент должен сообщить при входе в мир
# (константа CLIENTVER_VALUE его класса ToolTip). Клиенту, сообщившему что-то
# другое, — как и стоковому клиенту, который не сообщает ничего, — выводится
# ClientVersionMessage, после чего его отключают. Поднимайте это значение
# вместе с той константой при каждой пересборке interface.u, которую игроки
# должны получить. Пустое значение принимает любой клиент и полностью
# отключает проверку.
# По умолчанию: (пусто)
ClientVersion =

# Задержка в секундах, которая даётся клиенту после входа в мир, чтобы
# сообщить свою версию. По её истечении это считается несовпадением.
# По умолчанию: 10
ClientVersionTimeout = 10

# Сообщение, выводимое на экран и в чат перед отключением такого клиента.
# По умолчанию: Your game client is out of date. Please update it to play on this server.
ClientVersionMessage = Your game client is out of date. Please update it to play on this server.


# ---------------------------------------------------------------------------
# Цвета названий предметов
# ---------------------------------------------------------------------------
# См. docs/item-name-colors.md.

# Отправлять клиенту цвета названий предметов, заданные в data/xml/items
# (свойство "name_color", шестнадцатеричное значение RRGGBB). Предметы без
# этого свойства сохраняют цвет, который им даёт клиент, поэтому на нетронутом
# датапаке эта настройка ничего не меняет.
#
# В Interlude в пакетах предметов нет места под цвет, поэтому таблица
# отправляется помеченными сообщениями чата сразу после входа. Пересобранный
# клиент читает их, раскрашивает названия предметов в подсказках и не
# показывает ничего; СТОКОВЫЙ КЛИЕНТ ПОКАЗЫВАЕТ ИХ КАК СТРОКИ ЧАТА. Включайте
# только после того, как ваши игроки перейдут на пересобранный interface.u.
# По умолчанию: False
SendItemNameColors = True


# ---------------------------------------------------------------------------
# Характеристики предметов
# ---------------------------------------------------------------------------
# См. docs/item-stats-from-server.md.

# Передавать клиенту числовые характеристики предметов, которые он иначе
# читает из собственных weapongrp.dat / armorgrp.dat / etcitemgrp.dat: физ.
# атака, маг. атака, физ. защита, маг. защита, защита щита, уклонение, бонус
# MP, расход MP, скорость атаки, количество соул- и спиритшотов, вес. Они
# берутся из data/xml/items, который становится единственным местом хранения
# характеристик предметов, так что .dat-файлы клиента больше не нужно
# поддерживать в актуальном состоянии.
#
# Сервер никогда не отправляет это сам по себе: пересобранный клиент
# запрашивает предметы, для которых собирается показать подсказку, и только
# тогда получает ответ. Стоковый клиент не запрашивает ничего, поэтому
# включение ничего ему не стоит — но он и продолжает показывать свои
# собственные числа без изменений.
#
# Охватывается только то, что выводится в подсказке. Названия предметов,
# иконки, грейды и описания остаются на стороне клиента.
# По умолчанию: False
SendItemStats = True


# ---------------------------------------------------------------------------
# Умения предметов
# ---------------------------------------------------------------------------
# См. docs/item-skills.md.

# Показывать в подсказке предмета умения, которые он даёт тому, кто его
# надевает, — колонка "skills" таблицы items, группы "skillId:level",
# разделённые ';', — и раскрашивать его название цветом из колонки
# "name_color".
#
# И то, и другое хранится на самом предмете, а не на его шаблоне: два Short
# Sword могут нести разные умения и разные цвета. Сервер выдаёт эти умения
# при надевании и снимает при снятии независимо от того, включена настройка
# или нет; включается ею лишь то, что об этом сообщают клиенту.
#
# Сервер никогда не отправляет это сам по себе: пересобранный клиент
# запрашивает предметы, которые несёт, и те, для которых собирается показать
# подсказку, и только тогда получает ответ. Стоковый клиент не запрашивает
# ничего, поэтому включение ничего ему не стоит — он просто никогда не
# покажет ни умения, ни цвет.
# По умолчанию: False
SendItemSkills = True
