# ===========================================================================
# Custom client
# ===========================================================================
# Features which only exist for the client rebuilt from tools/client (see
# tools/client/README.md). A stock client either ignores them or, where said
# so below, misbehaves - which is why they are all off by default.
#
# Note : .properties files are read as ISO-8859-1, so non latin characters
# have to be written as \uXXXX escapes.


# ---------------------------------------------------------------------------
# Version check
# ---------------------------------------------------------------------------
# See docs/client-version-check.md.

# Version a rebuilt client is expected to report on entering the world (the
# CLIENTVER_VALUE constant of its ToolTip class). A client reporting anything
# else - and a stock client, which reports nothing at all - is shown
# ClientVersionMessage and disconnected. Bump this together with that constant
# on every interface.u rebuild the players must pick up. Empty accepts any
# client, and turns the whole check off.
# Default: (empty)
ClientVersion =

# Delay, in seconds, a client is given once in the world to report its
# version. Past that delay, it counts as a mismatch.
# Default: 10
ClientVersionTimeout = 10

# Message shown on screen and in chat before such a client is disconnected.
# Default: Your game client is out of date. Please update it to play on this server.
ClientVersionMessage = Your game client is out of date. Please update it to play on this server.


# ---------------------------------------------------------------------------
# Item name colors
# ---------------------------------------------------------------------------
# See docs/item-name-colors.md.

# Send the item name colors defined in data/xml/items (the "name_color"
# property, an hexadecimal RRGGBB value) to the client. The items without that
# property keep the color the client gives them, so with an untouched datapack
# this setting changes nothing.
#
# Interlude has no room for a color in its item packets, so the table is sent
# as tagged chat messages right after login. A rebuilt client reads them,
# paints the item names in the tooltips accordingly and displays nothing ; a
# STOCK CLIENT SHOWS THEM AS CHAT LINES. Turn it on only once your players run
# the rebuilt interface.u.
# Default: False
SendItemNameColors = False


# ---------------------------------------------------------------------------
# Item statistics
# ---------------------------------------------------------------------------
# See docs/item-stats-from-server.md.

# Hand the client the item numbers it otherwise reads from its own
# weapongrp.dat / armorgrp.dat / etcitemgrp.dat - P.Atk, M.Atk, P.Def, M.Def,
# shield defense, evasion, MP bonus, MP consumption, attack speed, soulshot
# and spiritshot counts, weight. They are taken from data/xml/items, which
# becomes the single place where the item statistics live, so the client .dat
# files don't have to be kept in sync anymore.
#
# The server never sends this on its own : a rebuilt client asks for the items
# it is about to show a tooltip for, and only then gets an answer. A stock
# client never asks, so turning this on costs it nothing - but it also keeps
# showing its own numbers, unchanged.
#
# Only what a tooltip prints is covered. Item names, icons, grades and
# descriptions stay client side.
# Default: False
SendItemStats = True


# ---------------------------------------------------------------------------
# Item skills
# ---------------------------------------------------------------------------
# See docs/item-skills.md.

# Show, in the item tooltip, the skills an item grants to whoever equips it -
# the "skills" column of the items table, "skillId:level" groups separated by
# ';' - and paint its name with the color of its "name_color" column.
#
# Both live on the item itself, not on its template : two Short Swords can
# hold different skills and different colors. The server grants those skills
# on equip and drops them on unequip whether this setting is on or off ; what
# it turns on is only the client being told about them.
#
# The server never sends this on its own : a rebuilt client asks for the items
# it carries and for the ones it is about to show a tooltip for, and only then
# gets an answer. A stock client never asks, so turning this on costs it
# nothing - it just never shows the skills nor the color.
# Default: False
SendItemSkills = True
