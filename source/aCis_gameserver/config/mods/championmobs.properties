# ===========================================================================
# Мобы-чемпионы
# ===========================================================================
# Случайные монстры из разрешённого диапазона уровней превращаются в
# чемпионов — с усиленными характеристиками и наградами.
#
# Примечание: файлы .properties читаются в кодировке ISO-8859-1, поэтому
# задавать локализованный текст в качестве титула нельзя.


# ---------------------------------------------------------------------------
# Общее
# ---------------------------------------------------------------------------

# Включить мобов-чемпионов.
# По умолчанию: False
ChampionMobsEnable = True

# Принудительно делать чемпионов пассивными, независимо от агрессивности
# монстра.
# По умолчанию: False
ChampionMobsPassive = False

# Шанс в %, что подходящий монстр станет чемпионом. 0 отключает.
# По умолчанию: 0
ChampionMobsFrequency = 25

# Титул, отображаемый над чемпионами.
# По умолчанию: Champion
ChampionMobsTitle = *Champion*

# Диапазон уровней, в который должен попадать монстр, чтобы стать чемпионом.
# По умолчанию: 1 / 85
ChampionMobsMinLevel = 75
ChampionMobsMaxLevel = 80


# ---------------------------------------------------------------------------
# Характеристики
# ---------------------------------------------------------------------------

# Множители, применяемые к характеристикам чемпиона.
# По умолчанию: 1 для всех
ChampionMobsHpMultiplier = 20
ChampionMobsPAtkMultiplier = 3
ChampionMobsPDefMultiplier = 20
ChampionMobsMAtkMultiplier = 5
ChampionMobsMDefMultiplier = 20


# ---------------------------------------------------------------------------
# Награды
# ---------------------------------------------------------------------------

# Множители, применяемые к наградам в опыте, очках умений и адене.
# По умолчанию: 1 / 1.
ChampionMobsXpSpMultiplier = 20
ChampionMobsAdenaMultiplier = 10

# Множители, применяемые к рейтам дропа и споила чемпиона поверх серверных
# рейтов (RateDropItems, RateDropSpoil). Рейт — это количество бросков по
# категории дропа, а не множитель её шанса, поэтому 2 означает, что каждая
# категория разыгрывается вдвое чаще, — именно это и показывает окно списка
# дропа по shift+клик, так как оно учитывает бонус чемпиона вместе с
# серверными рейтами.
#
# Категории валюты исключены: адена чемпиона уже масштабируется параметром
# ChampionMobsAdenaMultiplier выше, и удвоение бросков поверх этого умножило
# бы одно на другое. Трава также исключена.
# По умолчанию: 2 / 2
ChampionMobsDropMultiplier = 2
ChampionMobsSpoilMultiplier = 2

# Бонусный предмет, выпадающий при убийстве чемпиона, и его количество.
# По умолчанию: 0 (отключено) / 1
ChampionMobsRewardItemId = 6673
ChampionMobsRewardItemQty = 5

# Шанс в %, получить этот бонусный предмет. 0 отключает.
# По умолчанию: 0
ChampionMobsRewardChance = 100
