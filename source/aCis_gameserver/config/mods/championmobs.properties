# ===========================================================================
# Мобы-чемпионы
# ===========================================================================
# Случайные монстры из разрешённого диапазона уровней превращаются в
# чемпионов — с усиленными характеристиками и наградами.
#
# Чемпионы бывают двух видов — красные и синие. У каждого своя аура, свой цвет
# имени и титула над головой и свой полностью независимый набор настроек: в
# ключах они отличаются только словом Red или Blue после ChampionMobs.
#
# Когда оба вида включены и подходят одному и тому же монстру, они
# разыгрываются по очереди со случайного места, поэтому ни один из них не
# «съедает» монстров другого: при одинаковой частоте шансы стать красным и
# синим равны.
#
# Примечание: файлы .properties читаются в кодировке ISO-8859-1, поэтому
# задавать локализованный текст в качестве титула нельзя.


# ---------------------------------------------------------------------------
# Расписание
# ---------------------------------------------------------------------------

# Когда чемпионы вообще выдаются. Список окон через «;», окно записывается как
#
#     дни-часНачала:часКонца:вид
#
# Дни — номера от 1 (понедельник) до 7 (воскресенье): по одному, списком через
# запятую, диапазоном, или «*» на всю неделю. От часов дни отделяются
# последним дефисом строки, поэтому диапазон может содержать свой собственный.
#
# Часы — от 0 до 24, час конца не включается: 20:23 это с 20:00 до 22:59:59,
# а 0:24 — целые сутки. Час конца меньше часа начала означает окно через
# полночь: 22:2 это с 22:00 до 01:59:59 следующего дня.
#
# Вид — red, blue или all (сразу оба).
#
# Примеры:
#     1-20:23:red      понедельник с 20 до 23, красные
#     1-5-19:24:blue   будни с 19 до полуночи, синие
#     6,7-0:24:all     все выходные, оба вида
#     *-22:2:red       каждую ночь с 22 до 2, красные
#
# Пустое значение означает, что ограничения по времени нет вообще: вид
# включается одним только своим ChampionMobs<вид>Enable. А вот вид, у которого
# в непустом расписании нет ни одного своего окна, не выдаётся никогда.
#
# Расписание проверяется в момент спавна монстра. Уже заспавнившийся чемпион
# остаётся чемпионом до своей смерти или до респавна, даже если окно за это
# время закрылось.
# По умолчанию: пусто
ChampionMobsSchedule = *-0:24:all


# ---------------------------------------------------------------------------
# Красные чемпионы
# ---------------------------------------------------------------------------

# Включить красных чемпионов.
# По умолчанию: False
ChampionMobsRedEnable = True

# Шанс в %, что подходящий монстр станет красным чемпионом. 0 отключает.
# По умолчанию: 0
ChampionMobsRedFrequency = 35

# Принудительно делать красных чемпионов пассивными, независимо от
# агрессивности монстра.
# По умолчанию: False
ChampionMobsRedPassive = False

# Титул, отображаемый над красными чемпионами. Пустое значение отключает
# подмену титула — тогда над монстром остаётся его обычный титул из датапака
# (у монстров это сгенерированный «Lvl 80»).
# По умолчанию: Champion
ChampionMobsRedTitle = *Champion*

# Цвет имени и титула красного чемпиона, шесть шестнадцатеричных цифр RRGGBB
# без «#». Одно значение красит обе строки надписи над головой. Требует
# пропатченного engine.dll (см. docs/npc-name-colors.md). Пустое значение
# оставляет цвет надписи таким, каким его задаёт датапак.
# По умолчанию: FF4040
ChampionMobsRedNameColor = FF4040

# Диапазон уровней, в который должен попадать монстр, чтобы стать красным
# чемпионом.
# По умолчанию: 1 / 85
ChampionMobsRedMinLevel = 1
ChampionMobsRedMaxLevel = 85

# Множители, применяемые к характеристикам красного чемпиона.
# По умолчанию: 1 для всех
ChampionMobsRedHpMultiplier = 20
ChampionMobsRedPAtkMultiplier = 3
ChampionMobsRedPDefMultiplier = 20
ChampionMobsRedMAtkMultiplier = 5
ChampionMobsRedMDefMultiplier = 20

# Множители, применяемые к наградам в опыте, очках умений и адене. Опыт и SP
# настраиваются по отдельности.
# По умолчанию: 1 для всех
ChampionMobsRedXpMultiplier = 20
ChampionMobsRedSpMultiplier = 20
ChampionMobsRedAdenaMultiplier = 10

# Множители, применяемые к рейтам дропа и споила красного чемпиона поверх
# серверных рейтов (RateDropItems, RateDropSpoil). Рейт — это количество
# бросков по категории дропа, а не множитель её шанса, поэтому 2 означает, что
# каждая категория разыгрывается вдвое чаще, — именно это и показывает окно
# списка дропа по shift+клик, так как оно учитывает бонус чемпиона вместе с
# серверными рейтами.
#
# Категории валюты исключены: адена чемпиона уже масштабируется параметром
# ChampionMobsRedAdenaMultiplier выше, и удвоение бросков поверх этого умножило
# бы одно на другое. Трава также исключена.
# По умолчанию: 2 / 2
ChampionMobsRedDropMultiplier = 2
ChampionMobsRedSpoilMultiplier = 2

# Собственный дроп красного чемпиона, поверх обычной таблицы его шаблона.
# Список через «;», запись:
#
#     idПредмета:минКоличество-максКоличество:шанс
#
# Количество можно задать одним числом, если оно фиксированное. Шанс — обычные
# проценты, дробные допустимы (0.01 — сотая доля процента).
#
# Каждая запись разыгрывается сама по себе и от остальных не зависит.
# Серверные рейты дропа и множители выше на неё не распространяются —
# написанный шанс и есть итоговый; а вот штраф за разницу уровней
# (DeepBlueDropRules) распространяется, как и на любой другой дроп.
#
# Этот дроп видно в окне списка дропа по shift+клик отдельной группой, самой
# верхней.
# По умолчанию: пусто
ChampionMobsRedDrop = 6673:1-5:100;4037:1-2:25


# ---------------------------------------------------------------------------
# Синие чемпионы
# ---------------------------------------------------------------------------
# Всё то же самое, что и у красных, и читается точно так же.

# Включить синих чемпионов.
# По умолчанию: False
ChampionMobsBlueEnable = True

# Шанс в %, что подходящий монстр станет синим чемпионом. 0 отключает.
# По умолчанию: 0
ChampionMobsBlueFrequency = 35

# Принудительно делать синих чемпионов пассивными, независимо от агрессивности
# монстра.
# По умолчанию: False
ChampionMobsBluePassive = False

# Титул, отображаемый над синими чемпионами. Пустое значение отключает подмену
# титула.
# По умолчанию: Champion
ChampionMobsBlueTitle = *Champion*

# Цвет имени и титула синего чемпиона, RRGGBB.
# По умолчанию: 4080FF
ChampionMobsBlueNameColor = 4080FF

# Диапазон уровней, в который должен попадать монстр, чтобы стать синим
# чемпионом.
# По умолчанию: 1 / 85
ChampionMobsBlueMinLevel = 1
ChampionMobsBlueMaxLevel = 85

# Множители, применяемые к характеристикам синего чемпиона.
# По умолчанию: 1 для всех
ChampionMobsBlueHpMultiplier = 10
ChampionMobsBluePAtkMultiplier = 2
ChampionMobsBluePDefMultiplier = 10
ChampionMobsBlueMAtkMultiplier = 3
ChampionMobsBlueMDefMultiplier = 10

# Множители, применяемые к наградам в опыте, очках умений и адене.
# По умолчанию: 1 для всех
ChampionMobsBlueXpMultiplier = 10
ChampionMobsBlueSpMultiplier = 15
ChampionMobsBlueAdenaMultiplier = 5

# Множители, применяемые к рейтам дропа и споила синего чемпиона.
# По умолчанию: 2 / 2
ChampionMobsBlueDropMultiplier = 3
ChampionMobsBlueSpoilMultiplier = 3

# Собственный дроп синего чемпиона.
# По умолчанию: пусто
ChampionMobsBlueDrop = 4037:1-3:100;57:3000-6000:50
