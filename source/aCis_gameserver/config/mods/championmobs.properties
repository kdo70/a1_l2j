# ===========================================================================
# Мобы-чемпионы
# ===========================================================================
# Часть монстров при спавне становится чемпионами: у них выше характеристики и
# богаче награда.
#
# Чемпионы бывают двух видов, красные и синие. Настройки у них раздельные:
# два одинаковых набора ключей, отличаются только словом Red или Blue после
# ChampionMobs. Ниже сначала описаны два формата, которые встречаются в обоих
# наборах (расписание и дроп), а потом идут сами наборы.
#
# Если монстр подходит сразу обоим видам, они разыгрываются по очереди, и
# очередь каждый раз случайная — при одинаковой частоте красных и синих
# получается поровну.
#
# Чемпионами не становятся рейдбоссы, их минионы, призванные монстры и
# сундуки.
#
# Примечание: файлы .properties читаются в кодировке ISO-8859-1, поэтому
# задавать локализованный текст в качестве титула нельзя.


# ---------------------------------------------------------------------------
# Формат расписания
# ---------------------------------------------------------------------------
# Расписание задаёт время, когда вид чемпионов выдаётся. Это список окон через
# «;», одно окно записывается так:
#
#     дни-часНачала:часКонца
#
# Дни — 1 понедельник, 7 воскресенье:
#     1        один день
#     1,3,5    несколько дней
#     1-5      диапазон
#     *        вся неделя
#
# Часы — от 0 до 24. Час начала входит в окно, час конца уже нет:
#     0:24     круглые сутки
#     20:23    с 20:00 до 22:59
#     22:2     с 22:00 до 01:59 следующего дня
#
# Примеры целиком:
#     1-5-0:24          будни
#     6,7-0:24          выходные
#     1-20:23           понедельник, с 20 до 23
#     *-22:2;6,7-0:24   каждую ночь с 22 до 2 плюс выходные целиком
#
# Пустое расписание означает «всегда»: ограничения по времени нет, вид
# включается одним только своим ...Enable.
#
# Расписание проверяется в момент спавна монстра. Уже заспавнившийся чемпион
# остаётся чемпионом до смерти или до респавна, даже если окно закрылось.


# ---------------------------------------------------------------------------
# Формат дропа
# ---------------------------------------------------------------------------
# Собственный дроп чемпиона — список через «;», одна запись:
#
#     idПредмета:минКоличество-максКоличество:шанс
#
# Количество можно написать одним числом, если оно фиксированное. Шанс —
# проценты, дробные допустимы: 0.01 это сотая доля процента.
#
#     6673:1-5:100;4037:1-2:25;57:3000:0.5
#
# Каждая запись разыгрывается отдельно от остальных. Написанный шанс и есть
# итоговый: серверные рейты дропа и множители ниже на него не действуют. А вот
# штраф за разницу уровней (DeepBlueDropRules) действует, как на любой другой
# дроп.
#
# Этот дроп виден игроку в окне дроп-листа по shift+клик отдельной группой,
# самой верхней.
#
# Пустое значение — своего дропа у вида нет, выпадает только обычная таблица
# монстра.


# ---------------------------------------------------------------------------
# Красные чемпионы
# ---------------------------------------------------------------------------

# Включить красных чемпионов.
# По умолчанию: False
ChampionMobsRedEnable = True

# Когда они выдаются. Формат — в разделе «Формат расписания».
# По умолчанию: пусто (всегда)
ChampionMobsRedSchedule = 6-7-20:24

# Шанс в %, что подходящий монстр станет красным чемпионом. 0 отключает.
# По умолчанию: 0
ChampionMobsRedFrequency = 1

# Уровень монстра, при котором он может стать красным чемпионом.
# По умолчанию: 1 / 85
ChampionMobsRedMinLevel = 1
ChampionMobsRedMaxLevel = 85

# Делать красных чемпионов пассивными, даже если монстр агрессивный.
# По умолчанию: False
ChampionMobsRedPassive = False

# Титул над красным чемпионом. Пустое значение отключает подмену титула, и
# тогда остаётся обычный титул монстра из датапака (у монстров это
# сгенерированный «Lvl 80»).
# По умолчанию: Champion
ChampionMobsRedTitle =

# Цвет надписи над красным чемпионом — шесть шестнадцатеричных цифр RRGGBB,
# без «#». Строк две, и цвет у каждой свой: NameColor красит имя, нижнюю
# строку, TitleColor — титул, верхнюю. Если TitleColor не задан вовсе, титул
# берёт цвет имени. Пустое значение оставляет строку такой, какой её задаёт
# датапак. Требует пропатченного engine.dll, см. docs/npc-name-colors.md.
# По умолчанию: FF4040 / как имя
ChampionMobsRedNameColor = FF4040
ChampionMobsRedTitleColor = FF4040

# Во сколько раз красный чемпион крепче обычного монстра.
# HP он получает не пулом, а делением входящего урона, но выглядит это так же.
# По умолчанию: 1 для всех
ChampionMobsRedHpMultiplier = 6
ChampionMobsRedPAtkMultiplier = 4
ChampionMobsRedPDefMultiplier = 4
ChampionMobsRedMAtkMultiplier = 4
ChampionMobsRedMDefMultiplier = 4

# Во сколько раз больше опыта, SP и адены даёт красный чемпион.
# По умолчанию: 1 для всех
ChampionMobsRedXpMultiplier = 10
ChampionMobsRedSpMultiplier = 10
ChampionMobsRedAdenaMultiplier = 10

# Во сколько раз чаще разыгрывается обычная таблица дропа и спойла красного
# чемпиона. Домножается к серверным рейтам (RateDropItems, RateDropSpoil).
#
# Рейт — это количество бросков по категории дропа, а не множитель её шанса,
# поэтому 2 означает «категория разыгрывается вдвое чаще». Именно так это и
# показывает окно дроп-листа по shift+клик: чемпионский бонус там учтён вместе
# с серверными рейтами.
#
# Адены и травы это не касается: адена и так умножается на
# ChampionMobsRedAdenaMultiplier выше, и удвоение бросков перемножилось бы с
# ним.
# По умолчанию: 2 / 2
ChampionMobsRedDropMultiplier = 10
ChampionMobsRedSpoilMultiplier = 10

# Собственный дроп красного чемпиона, сверх обычной таблицы монстра.
# Формат — в разделе «Формат дропа».
# По умолчанию: пусто
ChampionMobsRedDrop = 6673:1-5:100;4037:1-2:25


# ---------------------------------------------------------------------------
# Синие чемпионы
# ---------------------------------------------------------------------------
# Те же самые настройки, читаются точно так же.

# Включить синих чемпионов.
# По умолчанию: False
ChampionMobsBlueEnable = True

# Когда они выдаются.
# По умолчанию: пусто (всегда)
ChampionMobsBlueSchedule = 1-5-20:24

# Шанс в %, что подходящий монстр станет синим чемпионом. 0 отключает.
# По умолчанию: 0
ChampionMobsBlueFrequency = 1

# Уровень монстра, при котором он может стать синим чемпионом.
# По умолчанию: 1 / 85
ChampionMobsBlueMinLevel = 1
ChampionMobsBlueMaxLevel = 85

# Делать синих чемпионов пассивными, даже если монстр агрессивный.
# По умолчанию: False
ChampionMobsBluePassive = False

# Титул над синим чемпионом, пустое значение оставляет титул из датапака.
# По умолчанию: Champion
ChampionMobsBlueTitle =

# Цвет надписи над синим чемпионом, RRGGBB. Имя и титул по отдельности.
# По умолчанию: 4080FF / как имя
ChampionMobsBlueNameColor = 4080FF
ChampionMobsBlueTitleColor = 4080FF

# Во сколько раз синий чемпион крепче обычного монстра.
# По умолчанию: 1 для всех
ChampionMobsBlueHpMultiplier = 3
ChampionMobsBluePAtkMultiplier = 2
ChampionMobsBluePDefMultiplier = 2
ChampionMobsBlueMAtkMultiplier = 2
ChampionMobsBlueMDefMultiplier = 2

# Во сколько раз больше опыта, SP и адены даёт синий чемпион.
# По умолчанию: 1 для всех
ChampionMobsBlueXpMultiplier = 5
ChampionMobsBlueSpMultiplier = 5
ChampionMobsBlueAdenaMultiplier = 5

# Во сколько раз чаще разыгрывается обычная таблица дропа и спойла синего
# чемпиона.
# По умолчанию: 2 / 2
ChampionMobsBlueDropMultiplier = 5
ChampionMobsBlueSpoilMultiplier = 5

# Собственный дроп синего чемпиона, сверх обычной таблицы монстра.
# По умолчанию: пусто
ChampionMobsBlueDrop = 4037:1-3:100;57:3000-6000:50
