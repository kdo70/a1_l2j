# ===========================================================================
# Книга рейд-боссов
# ===========================================================================
# Поведение книги рейд-боссов — предмета, по которому игрок кликает правой
# кнопкой, чтобы открыть окно со списком всех рейд-боссов сервера, —
# обрабатываемой RaidBookManager.
#
# То, какой предмет несёт книгу и как игрок её получает, здесь не задаётся:
# книга привязана к предмету атрибутом "handler" в data/xml/items
# ("RaidBossBook"), так что открывать её может любое количество предметов.
#
# Весь внешний вид (цвета, подписи, ширины колонок и диапазоны уровней в меню
# фильтра) живёт на стороне датапака, в data/xml/raidbook.xml, а иконки
# предметов — в data/xml/itemIcons.xml. Между теми файлами и этим ничего не
# дублируется: здесь только то, что настраивает владелец сервера, в XML — то,
# что видит игрок.
#
# Примечание: файлы .properties читаются в кодировке ISO-8859-1, поэтому
# задавать здесь локализованный текст нельзя. Все строки, видимые игроку,
# определены в XML.


# False полностью убирает эту возможность: предмет-книга ничего не делает,
# убийства не записываются, уровни охоты не масштабируют урон и книга никому
# не выдаётся.
# По умолчанию: True
RaidBookEnabled = True

# Id предмета, выдаваемого персонажу в самый первый раз, когда он касается
# рейд-босса. Он выдаётся один и только один раз: отметка хранится на
# персонаже (character_memo), а не в его инвентаре, поэтому книга, которая
# каким-то образом была уничтожена, повторно не выдаётся. Единственный случай,
# когда она всё же выдаётся снова, — полный инвентарь: ничего не выдано,
# значит, ничего и не запомнено.
#
# 0 не выдаёт ничего, оставляя книгу тому, что продаёт или выдаёт в награду
# датапак. Учтите, что это управляет только выдачей: окно открывает атрибут
# "handler" в data/xml/items, поэтому указанный здесь предмет без этого
# атрибута будет выдан и не будет делать ничего.
#
# Штатный предмет 9300 привязан к владельцу — его нельзя продать, выбросить,
# обменять, положить на склад или уничтожить.
# По умолчанию: 9300
RaidBookItemId = 9300

# Количество рейд-боссов, показываемых на странице основного списка, и
# позиций рейтинга на странице таблицы лидеров. Оно же задаёт высоту,
# отведённую под список, благодаря чему переключатель страниц остаётся
# прижатым к низу диалога при любом количестве показанных строк — см.
# "pageHeight" в XML.
# По умолчанию: 8
RaidBookRowsPerPage = 8

# Количество строк, показываемых на странице вкладки с подробностями —
# награды, дроп, история и рейтинг одного рейд-босса. Оно меньше, чем у
# списка, потому что страница подробностей и так тратит большую часть высоты
# на блоки статистики и охоты, расположенные над вкладкой.
#
# Помните об ограничении клиента: сгенерированная страница длиннее 8192
# символов отклоняется и заменяется сообщением об ошибке, поэтому слишком
# большое значение ломает вкладки, а не удлиняет их.
# По умолчанию: 4
RaidBookTabRowsPerPage = 4

# Количество убийств, которое занимает один уровень охоты. Самый первый
# уровень достигается с первого убийства, а каждый следующий требует этого
# количества: при значении по умолчанию 5 уровень 1 — это 1 убийство,
# уровень 2 — 5 убийств, уровень 3 — 10, уровень 4 — 15 и так далее без
# ограничения.
#
# Значение нельзя задать ниже 2: одно убийство на уровень сделало бы первый
# уровень — который и так достигается с первого убийства — таким же длинным,
# как любой другой, и полоса прогресса нового уровня оказалась бы уже
# заполненной.
# По умолчанию: 5
RaidBookKillsPerLevel = 5

# Наивысший уровень охоты, достижимый на одном рейд-боссе. 0 оставляет их
# бесконечными, ради чего эта возможность и сделана; положительное значение
# ограничивает и бонус к урону, и список наград, а полоса прогресса
# упирающегося в потолок уровня читается как заполненная.
# По умолчанию: 0
RaidBookMaxLevel = 0

# Количество урона в процентах, которое один уровень охоты добавляет к тому,
# что владелец этого уровня наносит именно этому рейд-боссу — и только ему.
# Оно применяется к урону, который получает босс, а не к урону, который
# бросает атакующий, поэтому работает поверх любого источника урона: и ударов,
# и умений, и урона со временем. Учтите, что числа, всплывающие над боссом, —
# это то, что бросил атакующий, поэтому бонус в них не виден.
# По умолчанию: 1
RaidBookDamagePerLevel = 1

# Наибольший бонус к урону в процентах, до которого могут суммироваться
# уровни охоты. 0 снимает ограничение, позволяя бонусу расти вместе с
# уровнями.
# По умолчанию: 0
RaidBookMaxDamageBonus = 0

# Очки рейтинга, которых стоит одно убийство рейд-босса:
#   RaidBookPointsPerKill + уровень босса * RaidBookPointsPerBossLevel
# Очки суммируются по всем рейд-боссам в рейтинг дня — тот самый, на который
# ссылается заголовок книги.
#
# Рейтинг дня считается с момента прошлой выдачи награды дня: выдав награды,
# ежедневная задача обнуляет очки всем, поэтому побеждает тот, у кого их
# больше всех к моменту следующей выдачи. Обнуление идёт независимо от того,
# выдал ли день что-нибудь. Убийства при этом не трогаются — они дают уровни
# охоты и остаются за всё время.
# По умолчанию: 10 / 1
RaidBookPointsPerKill = 10
RaidBookPointsPerBossLevel = 1

# Убийство засчитывается каждому персонажу, который нанёс боссу урон и стоял
# достаточно близко в момент его гибели, — по тому же правилу, по которому
# начисляется опыт, так что тот, кто получил опыт за убийство, получил и
# засчитанное убийство для охоты. Урон саммона засчитывается его владельцу, а
# радиус — это "PartyRange" из config/players/character.properties.
#
# В истории указывается персонаж, нанёсший наибольший урон, а не тот, кто
# нанёс последний удар: рейд-босса валит толпа, и последний удар мало что
# говорит о том, кто его убил. Ни то, ни другое не настраивается.

# True дополнительно показывает информационные сообщения книги на экране,
# помимо чата, который получает их всегда. Сообщение о каждом убийстве
# выводится только в чат независимо от этой настройки — иначе оно мигало бы
# при каждом убийстве.
#
# Сами тексты и то, сколько они держатся на экране, живут в XML.
# По умолчанию: True
RaidBookScreenMessages = True

# Количество убийств, хранимых в истории одного рейд-босса. Всё, что выходит
# за это окно, удаляется и из базы данных при следующем убийстве этого босса,
# поэтому таблица никогда не разрастается больше, чем боссы * это количество.
# По умолчанию: 20
RaidBookHistorySize = 20

# Количество позиций рейтинга, хранимых в таблицах лидеров — как в
# общесерверной, так и в таблице по каждому боссу.
# По умолчанию: 100
RaidBookRankingSize = 100

# Количество будущих уровней охоты, показываемых на вкладке «награды». Она
# открывается на самом следующем уровне, а не на первом: игрок читает список
# наград ради того, что вот-вот заработает.
#
# Эта вкладка не разбита на страницы — весь обзор рассчитан на чтение за один
# раз, — поэтому значение напрямую задаёт длину страницы. Помните о 8192
# символах, которые принимает клиент (см. RaidBookTabRowsPerPage), когда
# уровень награждает сразу несколькими предметами.
# По умолчанию: 5
RaidBookShownRewards = 5

# Награды, выдаваемые при достижении уровня охоты, записываются как
#   уровень:idПредмета,количество[,idПредмета,количество...];уровень:...
# Уровень, которого нет в списке, откатывается к RaidBookDefaultReward —
# именно он отвечает за бесконечные уровни за пределами перечисленных. Пустое
# значение по умолчанию просто ничего не даёт.
#
# Оба параметра читает и вкладка «награды», так что заданное здесь — это то,
# что показывается игроку.
# По умолчанию: (пусто)
RaidBookLevelRewards = 1:57,100000;2:57,250000;3:57,500000;4:57,1000000;5:57,2000000
RaidBookDefaultReward = 57,2000000

# False убирает ежедневные награды общесерверной таблицы лидеров вместе со
# страницей книги, которая о них сообщает.
# По умолчанию: True
RaidBookDailyRewardEnabled = True

# Что каждая позиция общесерверной таблицы лидеров получает раз в сутки,
# записывается так же, как RaidBookLevelRewards, — только ключом выступает
# позиция в рейтинге, а не уровень охоты:
#   место:idПредмета,количество[,idПредмета,количество...];место:...
# Позиция, которой нет в списке, не получает ничего; значения по умолчанию
# здесь нет, поэтому перечисление 1, 2 и 3 награждает первую тройку и больше
# никого.
#
# Задача запускается в час, заданный в data/xml/scripts.xml
# ("task.RaidBookDailyReward"). Победитель, оказавшийся оффлайн, ничего не
# теряет: награда ждёт его в базе данных и выдаётся при следующем входе.
# По умолчанию: (пусто)
RaidBookDailyRewards = 1:57,5000000;2:57,3000000;3:57,1000000

# False убирает награды месяца вместе с рейтингом месяца и страницей книги,
# которая о них сообщает.
#
# Победителем месяца становится тот, кто чаще всех занимал первое место в
# рейтинге дня: каждый прогон ежедневной задачи засчитывает одну победу тому,
# кто в этот момент возглавляет дневной рейтинг. Именно эти победы считает
# рейтинг месяца, и именно они обнуляются в момент выдачи наград месяца.
# По умолчанию: True
RaidBookMonthlyRewardEnabled = True

# Что каждая позиция рейтинга месяца получает раз в месяц, записывается так же,
# как RaidBookDailyRewards:
#   место:idПредмета,количество[,idПредмета,количество...];место:...
#
# Задача запускается 1 числа каждого месяца, в час, заданный в
# data/xml/scripts.xml ("task.RaidBookMonthlyReward"). Она намеренно стоит
# позже ежедневной задачи той же ночи: закончившийся день ещё принадлежит
# закрываемому месяцу, поэтому его победа должна быть засчитана до того, как
# рейтинг будет прочитан. Победитель, оказавшийся оффлайн, ничего не теряет:
# награда ждёт его в базе данных и выдаётся при следующем входе.
#
# Дату и время следующей выдачи книга берёт из этого расписания и показывает на
# странице наград, так что второго места, где её нужно было бы записывать, нет.
# По умолчанию: (пусто)
RaidBookMonthlyRewards = 1:57,10000000;2:57,5000000;3:57,3000000

# Наибольшая длина строки поиска по имени рейд-босса на главной странице. Поиск
# идёт по тем боссам, которых персонаж уже бил, — по списку, который и так лежит
# в памяти и отсортирован один раз при старте, — поэтому он стоит одного прохода
# по этому списку и ничего больше: ни запроса в базу, ни обхода мира, ни индекса,
# который пришлось бы поддерживать. Само значение ограничивает лишь то, сколько
# символов из введённого учитывается.
# По умолчанию: 24
RaidBookSearchChars = 24

# True учитывает серверные рейты (RateDropItemsByRaid, RateDropCurrency,
# RateDropHerbs) в шансах, показываемых вкладкой «дроп», так что книга
# сообщает, что действительно происходит на этом сервере. False показывает
# исходные ретейльные шансы из таблицы droplist.
#
# Рейт — это количество бросков по категории, а не множитель её шанса,
# поэтому итоговый шанс ограничивается 100%, а не растёт выше.
# По умолчанию: True
RaidBookApplyRates = True

# True учитывает штраф deep blue именно того игрока, который читает книгу, в
# шансах, показываемых вкладкой «дроп», так что переросшему игроку
# сообщается, что он действительно получит. Это тот самый штраф, которым
# управляет "UseDeepBlueDropRules" из character.properties, причём рейд-босс
# прощает 2 уровня там, где обычный монстр прощает 5.
# По умолчанию: True
RaidBookApplyLevelPenalty = True
