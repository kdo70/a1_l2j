# ===========================================================================
# Боссы
# ===========================================================================
# Рейд-боссы и гранд-боссы. Их точки спавна и задержки респавна живут на
# стороне датапака, в data/xml.


# ---------------------------------------------------------------------------
# Рейд-боссы
# ---------------------------------------------------------------------------

# Регенерация и защита рейд-боссов и их прислужников, где 1 = 100%.
# По умолчанию: 1. для всех
RaidHpRegenMultiplier = 1.
RaidMpRegenMultiplier = 1.
RaidDefenceMultiplier = 1.

# Если True, парализующее проклятие, накладываемое на игроков, чей уровень
# сильно ниже уровня босса, отключается.
# По умолчанию: False
DisableRaidCurse = False


# ---------------------------------------------------------------------------
# Гранд-боссы
# ---------------------------------------------------------------------------

# Задержка в минутах между входом группы и появлением босса.
# По умолчанию: 30 / 20 / 10
AntharasWaitTime = 30
ValakasWaitTime = 20
FrintezzaWaitTime = 10
