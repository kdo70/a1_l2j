# ===========================================================================
# NPC managers
# ===========================================================================
# The service NPCs which aren't spawned by default, and the wyvern manager.
# Spawn the first three with //spawn <id>.


# ---------------------------------------------------------------------------
# Class Master - //spawn 50000
# ---------------------------------------------------------------------------

# If True, the class master offers every occupation of the class tree, not
# only the next one. A Dwarven Fighter can then directly become Artisan,
# Scavenger, Warsmith, Bounty Hunter, Maestro or Fortune Seeker, while a
# Warsmith can only become Maestro.
# Default: False
AllowEntireTree = False

# Cost and reward of each occupation change.
# Format: job;[claimed items];[rewarded items];job;...
#   1;[57(100000)];[];2;[57(1000000)];[];3;[57(10000000),5575(1000000)];[6622(1)]
#     1st change for 100k Adena, 2nd for 1kk Adena, 3rd for 10kk Adena plus
#     1kk Ancient Adena, rewarding one Book of Giants.
#   1;[];[];2;[];[];3;[];[]
#     every change is free, without any reward.
#   1;[];[];2;[];[]
#     only the first and the second changes are offered.
# Default: (empty, which disables the NPC)
ConfigClassMaster = 1;[];[];2;[];[];3;[];[]


# ---------------------------------------------------------------------------
# Wedding Manager - //spawn 50001
# ---------------------------------------------------------------------------

# Price of a wedding, in Adena.
# Default: 1000000
WeddingPrice = 1000000

# Allow same sex marriages.
# Default: False
WeddingAllowSameSex = False

# Require both players to wear a formal wear.
# Default: True
WeddingFormalWear = True


# ---------------------------------------------------------------------------
# Scheme Buffer - //spawn 50002
# ---------------------------------------------------------------------------

# Amount of schemes a character can save.
# Default: 4
BufferMaxSchemesPerChar = 4

# Static price of a buff, which overrides the skill price. -1 keeps the skill
# price.
# Default: -1
BufferStaticCostPerBuff = -1


# ---------------------------------------------------------------------------
# Wyvern Manager
# ---------------------------------------------------------------------------

# Level the strider must have reached to be turned into a wyvern.
# Default: 55
RequiredStriderLevel = 55

# Amount of Crystals (B-grade) consumed by that transformation.
# Default: 10
RequiredCrystalsNumber = 10
