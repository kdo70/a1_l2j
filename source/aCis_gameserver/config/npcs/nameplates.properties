# ===========================================================================
# Надпись над монстром
# ===========================================================================
# Над каждым монстром висят две строки — титул и имя, — и этот файл целиком про
# них: какими словами пишется титул и каким цветом красится каждая строка.
#
#     Raid Boss Lvl 80*     <- титул, верхняя строка: ...TitleColor
#     Ruin Zombie           <- имя,   нижняя строка:  ...NameColor
#
# Титул складывается так:
#
#     <вид> <словоУровня> <уровень><знакАгрессии>
#
#     Lvl 12                 обычный монстр
#     Lvl 80*                он же, агрессивный (aggroRange > 0)
#     Raid Boss Lvl 80*      рейд-босс
#
# Сам титул в data/xml/npcs пишет генератор
# tools/datapack/npc_level_titles.ps1 — он читает этот файл и складывает
# титул по строчкам ниже. Сервер читает этот же файл обратно и красит по нему
# монстра: цвета в XML не хранятся вовсе.
#
# Порядок такой:
#   - цвета по умолчанию берутся отсюда, по виду монстра;
#   - «nameColor» / «titleColor» у конкретного NPC в data/xml/npcs
#     перебивают их.
#
# Цвета у строк независимы. Если ...TitleColor не задан вовсе, титул берёт
# цвет имени — так же, как было, когда цвет был один на обе строки. Пустое
# значение, наоборот, означает «эту строку не красить».
#
# Цвета требуют пропатченного engine.dll. См. docs/npc-name-colors.md и
# docs/npc-level-titles.md.
#
# Примечания:
#   - после правки текстов нужно заново прогнать генератор, иначе титулы в
#     датапаке останутся старыми и сервер перестанет узнавать их вид;
#   - файлы .properties читаются в кодировке ISO-8859-1, поэтому
#     локализованный текст в титулах задавать нельзя;
#   - цвет — шесть шестнадцатеричных цифр RRGGBB, без «#».


# ---------------------------------------------------------------------------
# Общая часть титула
# ---------------------------------------------------------------------------
# Эти две строчки одинаковы у всех видов.

# Слово, которым объявляется уровень.
# По умолчанию: Lvl
MonsterLevelLabel = Lvl

# Знак в самом конце титула у монстра, который подходит сам, то есть у
# которого aggroRange > 0. Пустое значение убирает знак совсем.
# По умолчанию: *
MonsterAggressiveMark = *


# ---------------------------------------------------------------------------
# Виды монстров
# ---------------------------------------------------------------------------
# У каждого вида три ключа: слова перед уровнем, цвет имени и цвет титула.
# Третий можно не писать — тогда титул красится цветом имени.
#
# Кто из монстров какого вида — решает генератор: боссов он берёт из типа NPC,
# минионов из списка спавна, а квестовых монстров и минионов рейд-боссов из
# стоковой разметки клиента. См. docs/npc-level-titles.md, раздел 3.

# Эпик-босс.
# По умолчанию: Epic Boss / FF0000 / как имя
MonsterEpicText = Epic Boss
MonsterEpicNameColor = FF0000
MonsterEpicTitleColor = FF0000

# Миньон эпик-босса.
# По умолчанию: Epic Fighter / FF0000 / как имя
MonsterEpicMinionText = Epic Fighter
MonsterEpicMinionNameColor = FF0000
MonsterEpicMinionTitleColor = FF0000

# Рейд-босс. Оранжевый — тот самый цвет, которым стоковый клиент красит титул
# «Raid Boss» в npcname-e.dat, так что покрашенные сервером боссы выглядят как
# непокрашенные.
# По умолчанию: Raid Boss / FE8B3F / как имя
MonsterRaidText = Raid Boss
MonsterRaidNameColor = FE8B3F
MonsterRaidTitleColor = FE8B3F

# Миньон рейд-босса.
# По умолчанию: Raid Fighter / FE8B3F / как имя
MonsterRaidMinionText = Raid Fighter
MonsterRaidMinionNameColor = FE8B3F
MonsterRaidMinionTitleColor = FE8B3F

# Квестовый монстр. Свой оттенок оранжевого, и он тоже стоковый — им клиент
# красит титул «Quest Monster».
# По умолчанию: Quest Monster / FF8000 / как имя
MonsterQuestText = Quest Monster
MonsterQuestNameColor = FF8000
MonsterQuestTitleColor = FF8000

# Обычный монстр: слов перед уровнем нет, цвета нет — имя остаётся белым, а
# титул бледно-зелёным, как их рисует сам клиент.
#
# Здесь и видно, зачем строки разведены: поставить сюда цвет имени, оставив
# титул пустым, — и у всех обычных монстров покрасится имя, а титул останется
# стоковым.
# По умолчанию: пусто / пусто / пусто
MonsterPlainText =
MonsterPlainNameColor =
MonsterPlainTitleColor =
