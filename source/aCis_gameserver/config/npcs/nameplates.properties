# ===========================================================================
# Надпись над монстром
# ===========================================================================
# Над монстром висят две строки, и у каждой свой цвет:
#
#     Raid Boss Lvl 80*     титул, верхняя строка   ...TitleColor
#     Ruin Zombie           имя,   нижняя строка    ...NameColor
#
# Титул собирает сервер, по этому файлу и по виду монстра — свойству
# «monsterKind» в data/xml/npcs, которое расставляет генератор
# tools/datapack/npc_level_titles.ps1:
#
#     <вид> <словоУровня> <уровень><знакАгрессии>
#
#     Lvl 12                 обычный монстр
#     Lvl 80*                он же, агрессивный (aggroRange > 0)
#     Raid Boss Lvl 80*      рейд-босс
#
# Уровень и агрессивность берутся из характеристик самого монстра, так что
# разъехаться с ними надпись не может.
#
# ЧТО ОТКУДА. Правило одно и то же для титула и для обоих цветов: **пусто в
# data/xml/npcs — берём отсюда, задано там — берём оттуда**. То есть строчки
# ниже задают вид целиком, а «title», «nameColor» и «titleColor» у конкретного
# NPC перебивают их поштучно.
#
# Правка этого файла доезжает рестартом сервера; генератор для неё не нужен.
#
# ВАЖНО: «ShowNpcLevel» в npcs.properties должен быть False. Это стоковая и
# более грубая версия того же самого: включённая, она допишет спереди свой
# «Lv 80*», и выйдет «Lv 80* Lvl 80*».
#
# Файл читается в кодировке ISO-8859-1 — локализованный текст в титулах
# задавать нельзя.
#
# Подробности: docs/npc-level-titles.md.


# ---------------------------------------------------------------------------
# Какие бывают цвета
# ---------------------------------------------------------------------------
# Шесть шестнадцатеричных цифр RRGGBB, без «#». Прозрачность задавать негде и
# не нужно, оба патча клиента ставят её сами.
#
# Поддерживается ЛЮБОЙ из 16 777 216 цветов — фиксированной палитры у клиента
# нет. Оговорок ровно три:
#
#   - FFFFFF у ИМЕНИ не работает: внутри движка белый совпадает со значением
#     «цвета нет», и имя уходит на стоковую ветку. Выйдет всё равно белое, но
#     не потому, что мы так сказали. У титула FFFFFF работает нормально;
#   - 000000 — это чёрный, а не «без цвета». На тёмном фоне не читается;
#   - «без цвета» — это пустое значение ключа.
#
# Цвета требуют пропатченного engine.dll, см. docs/npc-name-colors.md. На
# клиенте без патча обе строки останутся стоковыми, ничего не сломается.
#
# Несколько ходовых значений:
#
#     FF0000  красный          FFFF00  жёлтый           00FF00  зелёный
#     FE8B3F  оранжевый (1)    FFD700  золотой          A9E89C  бледно-зелёный (3)
#     FF8000  оранжевый (2)    00FFFF  голубой          808080  серый
#     FF4040  алый             4080FF  синий            FF00FF  пурпурный
#
#     (1) стоковый цвет титула «Raid Boss» / «Raid Fighter» в npcname-e.dat
#     (2) стоковый цвет титула «Quest Monster» там же
#     (3) стоковый цвет титула у всех остальных NPC


# ---------------------------------------------------------------------------
# Общая часть титула
# ---------------------------------------------------------------------------
# Одинаковая у всех видов.

# Слово, которым объявляется уровень.
# По умолчанию: Lvl
MonsterLevelLabel = Lvl

# Знак в самом конце титула у монстра, который подходит сам (aggroRange > 0).
# Пустое значение убирает знак совсем.
# По умолчанию: *
MonsterAggressiveMark = *


# ---------------------------------------------------------------------------
# Виды монстров
# ---------------------------------------------------------------------------
# У каждого вида три ключа: слова перед уровнем, цвет имени и цвет титула.
#
# ЦВЕТ ТИТУЛА. Пустое значение — «титул не красить», он останется стоковым.
# Убрать ключ совсем — титул возьмёт цвет имени.
#
# Кто из монстров какого вида — решает генератор: боссов по типу NPC, минионов
# по списку спавна, квестовых монстров и минионов рейд-боссов по стоковой
# разметке клиента. См. docs/npc-level-titles.md, раздел 3.

# Эпик-босс.
# По умолчанию: Epic Boss / FF0000 / как имя
MonsterEpicText = Epic Boss
MonsterEpicNameColor = FF0000
MonsterEpicTitleColor =

# Миньон эпик-босса.
# По умолчанию: Epic Fighter / FF0000 / как имя
MonsterEpicMinionText = Epic Fighter
MonsterEpicMinionNameColor = FF0000
MonsterEpicMinionTitleColor =

# Рейд-босс.
# По умолчанию: Raid Boss / FE8B3F / как имя
MonsterRaidText = Raid Boss
MonsterRaidNameColor = FE8B3F
MonsterRaidTitleColor =

# Миньон рейд-босса.
# По умолчанию: Raid Fighter / FE8B3F / как имя
MonsterRaidMinionText = Raid Fighter
MonsterRaidMinionNameColor = FE8B3F
MonsterRaidMinionTitleColor =

# Квестовый монстр.
# По умолчанию: Quest Monster / FF8000 / как имя
MonsterQuestText = Quest Monster
MonsterQuestNameColor = FF8000
MonsterQuestTitleColor =

# Обычный монстр: слов перед уровнем нет. Поставить сюда цвет имени — покрасятся
# имена всех обычных мобов сразу.
# По умолчанию: пусто / пусто / пусто
MonsterPlainText =
MonsterPlainNameColor =
MonsterPlainTitleColor =
