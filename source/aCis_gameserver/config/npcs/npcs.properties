# ===========================================================================
# NPCs
# ===========================================================================
# Spawn manager, generic NPC display, and the AI shared by every monster.


# ---------------------------------------------------------------------------
# Spawn manager
# ---------------------------------------------------------------------------

# Multiplier applied on the spawn amount of the spawn lists. 1.5 spawns 50%
# more monsters.
# Default: 1.
SpawnMultiplier = 1.

# NPC maker events spawned on server startup.
#   extra_mob    : extra and few unique monsters
#   18age        : lottery ticket sellers
#   start_weapon : Miss Queen weapon dealer
# Default: extra_mob;18age;start_weapon
SpawnEvents = extra_mob;18age;start_weapon

# Other events, possibly usable later on. All of them either miss their HTMs
# or the function driving them :
#   medal, bak_event, christmas, event_gate, fire_event, gmshop, gmshop2,
#   heart_event, letter_collector, lottery, net_cafe_event_1, omegas_revenge,
#   test_2nd_class, trick_or_transmutation, zaken_curse


# ---------------------------------------------------------------------------
# Display
# ---------------------------------------------------------------------------

# Show the monster level and aggression next to its name.
# Default: False
ShowNpcLevel = False

# Show the clan and alliance crests on the NPCs.
# Default: False
ShowNpcCrest = False

# Show the clan and alliance crests on the summons.
# Default: False
ShowSummonCrest = False

# Send every NPC's name and title from the datapack instead of letting the client
# read them from its own npcname-e.dat. Per NPC this is the "usingServerSideName"
# / "usingServerSideTitle" property ; these two turn it on for all of them at once
# and the per NPC properties keep working on top.
#
# It makes data/xml/npcs the single place where those strings live, so renaming an
# NPC no longer needs a client patch. What the players see becomes exactly what the
# XML says, in the language the XML is written in - on a localized client that
# replaces the localized names with the datapack ones.
#
# The COLOR of the title is not a string and keeps coming from npcname-e.dat by npc
# id, so it survives this untouched. See docs/npc-title-colors.md.
# Default: False
ServerSideNpcName = True

# Default: False
ServerSideNpcTitle = True


# ---------------------------------------------------------------------------
# AI
# ---------------------------------------------------------------------------

# If True, guards attack the aggressive monsters at sight.
# Default: False
GuardAttackAggroMob = False

# If False, monsters don't auto-aggro on the players standing in a peace zone.
# Default: True
MobAggroInPeaceZone = True

# Chance, in %, for a monster to randomly walk or buff itself.
# Default: 30
RandomWalkRate = 30

# Maximum range a monster can randomly walk to, from its spawn point. Also
# used as the flee range of archers and feared NPCs, and by the boss spawn
# checks.
# Default: 200
MaxDriftRange = 200

# Default range an NPC uses to check its surroundings.
# Default: 450
DefaultSeeRange = 450


# ---------------------------------------------------------------------------
# Misc
# ---------------------------------------------------------------------------

# If True, every teleport handled by a teleporter NPC is free of charge.
# Default: False
FreeTeleport = False
