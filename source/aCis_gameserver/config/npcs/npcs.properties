# ===========================================================================
# NPC
# ===========================================================================
# Менеджер спавна, общее отображение NPC и ИИ, общий для всех монстров.


# ---------------------------------------------------------------------------
# Менеджер спавна
# ---------------------------------------------------------------------------

# Множитель, применяемый к количеству спавна из списков спавна. 1.5 спавнит
# на 50% больше монстров.
# По умолчанию: 1.
SpawnMultiplier = 1.

# События NPC maker, спавнящиеся при запуске сервера.
#   extra_mob    : дополнительные и несколько уникальных монстров
#   18age        : продавцы лотерейных билетов
#   start_weapon : торговец оружием Miss Queen
# По умолчанию: extra_mob;18age;start_weapon
SpawnEvents = extra_mob;18age;start_weapon

# Прочие события, возможно, применимые в дальнейшем. У всех них отсутствуют
# либо HTM-файлы, либо управляющая ими функция:
#   medal, bak_event, christmas, event_gate, fire_event, gmshop, gmshop2,
#   heart_event, letter_collector, lottery, net_cafe_event_1, omegas_revenge,
#   test_2nd_class, trick_or_transmutation, zaken_curse


# ---------------------------------------------------------------------------
# Отображение
# ---------------------------------------------------------------------------

# Показывать уровень и агрессивность монстра рядом с его именем.
# По умолчанию: False
ShowNpcLevel = False

# Показывать клановые и альянсовые гербы на NPC.
# По умолчанию: False
ShowNpcCrest = True

# Показывать клановые и альянсовые гербы на саммонах.
# По умолчанию: False
ShowSummonCrest = True

# Отправлять имя и титул каждого NPC из датапака, вместо того чтобы клиент
# читал их из собственного npcname-e.dat. Для отдельного NPC это свойства
# "usingServerSideName" / "usingServerSideTitle"; эти две настройки включают
# режим сразу для всех, а свойства отдельных NPC продолжают работать поверх.
#
# Так data/xml/npcs становится единственным местом, где живут эти строки, и
# переименование NPC больше не требует патча клиента. То, что видят игроки,
# становится ровно тем, что написано в XML, на том языке, на котором XML
# написан, — на локализованном клиенте это заменяет локализованные имена
# именами из датапака.
#
# ЦВЕТ титула строкой не является и это переживает без изменений: его задаёт
# сервер («nameColor» у NPC, а у монстров — их вид, см. nameplates.properties),
# а если не задаёт никто, то клиент берёт его из npcname-e.dat по id NPC. См.
# docs/npc-title-colors.md.
# По умолчанию: False
ServerSideNpcName = True

# По умолчанию: False
ServerSideNpcTitle = True


# ---------------------------------------------------------------------------
# ИИ
# ---------------------------------------------------------------------------

# Если True, стражники атакуют агрессивных монстров при виде.
# По умолчанию: False
GuardAttackAggroMob = False

# Если False, монстры не агрятся автоматически на игроков, стоящих в мирной
# зоне.
# По умолчанию: True
MobAggroInPeaceZone = True

# Шанс в %, что монстр случайно пройдётся или забафает себя.
# По умолчанию: 30
RandomWalkRate = 30

# Максимальное расстояние, на которое монстр может отойти в случайной
# прогулке от точки своего спавна. Также используется как дистанция бегства
# лучников и напуганных NPC и в проверках спавна боссов.
# По умолчанию: 200
MaxDriftRange = 200

# Дистанция по умолчанию, на которой NPC осматривает окрестности.
# По умолчанию: 450
DefaultSeeRange = 450


# ---------------------------------------------------------------------------
# Разное
# ---------------------------------------------------------------------------

# Если True, любой телепорт, выполняемый NPC-телепортёром, бесплатен.
# По умолчанию: False
FreeTeleport = False
