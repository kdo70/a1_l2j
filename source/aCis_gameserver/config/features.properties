# ===========================================================================
# Features
# ===========================================================================
# Server wide switches, enabling or disabling whole game features.
#
# Note : .properties files are read as ISO-8859-1, so no localized text can be
# set here.


# ---------------------------------------------------------------------------
# World
# ---------------------------------------------------------------------------

# Allow players to swim.
# Default: True
AllowWater = True

# Allow boats to sail, and players to board them.
# Default: True
AllowBoat = True

# Allow cursed weapons (Zariche, Akamanah) to drop and to be equipped.
# Default: True
AllowCursedWeapons = True

# Allow characters to take damage from falling.
# Default: True
EnableFallingDamage = True

# PvP behavior of the town zones.
#   0 : peace all the time
#   1 : PvP during a siege, for the siege participants only
#   2 : PvP all the time
# Default: 0
ZoneTown = 0


# ---------------------------------------------------------------------------
# Community board
# ---------------------------------------------------------------------------

# Enable the community board (Alt+B).
# Default: False
EnableCommunityBoard = False

# Section shown when the community board is opened.
# Default: _bbshome
BBSDefault = _bbshome


# ---------------------------------------------------------------------------
# Misc
# ---------------------------------------------------------------------------

# Show "data/html/servnews.htm" when a character enters the world.
# Default: False
ShowServerNews = False
