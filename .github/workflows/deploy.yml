name: 🚀 Деплой на VPS

on:
  push:
    branches:
      - main

jobs:
  # ═══════════════════════════════════════════════════════════════
  # JOB 1: BUILD - Компиляция ядра и инъекция jar в готовую структуру из Git
  # ═══════════════════════════════════════════════════════════════
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Клонирование репозитория
        uses: actions/checkout@v4

      - name: ☕ Установка JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 🐜 Установка Apache Ant
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📦 Устанавливаем Apache Ant..."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          sudo apt-get update -qq
          sudo apt-get install -y ant
          echo "✅ Версия Ant: $(ant -version)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: 🔨 Компиляция aCis_gameserver
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🔨 Компиляция aCis_gameserver для получения l2jserver.jar..."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          cd source/aCis_gameserver
          ant
          echo "✅ Компиляция завершена успешно"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: 💉 Инъекция нового JAR в папку build
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "💉 Инъекция нового l2jserver.jar в папку build..."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          if [ ! -d "build" ]; then
            echo "❌ ОШИБКА: Папка 'build' не найдена в репозитории!"
            echo "   Убедитесь, что структура проекта корректна"
            exit 1
          fi
          
          mkdir -p build/login/libs
          mkdir -p build/gameserver/libs
          
          cp source/aCis_gameserver/build/l2jserver.jar build/login/libs/
          cp source/aCis_gameserver/build/l2jserver.jar build/gameserver/libs/
          
          echo "✅ JAR файлы успешно скопированы"
          echo "📊 Общее количество файлов в папке build: $(find build -type f | wc -l)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: 📦 Создание архива build
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📦 Создание архива build.tar.gz..."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          tar -czf build.tar.gz -C build .
          echo "✅ Архив создан"
          echo "📏 Размер архива: $(du -h build.tar.gz | cut -f1)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: 📤 Загрузка архива на VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "build.tar.gz"
          target: "/tmp"
          strip_components: 0

      - name: 🛠️ Распаковка и настройка на VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🛑 Остановка текущих серверов..."
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            killall -9 java > /dev/null 2>&1 || true
            sleep 3
            echo "✅ Все Java процессы остановлены"
            
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "💾 Резервное копирование важных файлов..."
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            mkdir -p /tmp/l2backup
            
            cp /root/l2server/login/hexid.txt /tmp/l2backup/ 2>/dev/null || true
            cp /root/l2server/gameserver/config/hexid.txt /tmp/l2backup/ 2>/dev/null || true
            cp -r /root/l2server/gameserver/data/geodata /tmp/l2backup/ 2>/dev/null || true
            echo "✅ Резервная копия создана"
            
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "📂 Распаковка новой сборки..."
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            rm -rf /root/l2server
            mkdir -p /root/l2server
            
            tar -xzf /tmp/build.tar.gz -C /root/l2server/
            rm -f /tmp/build.tar.gz
            echo "✅ Сборка распакована"
            
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🔄 Восстановление важных файлов..."
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            cp /tmp/l2backup/hexid.txt /root/l2server/login/ 2>/dev/null || true
            cp /tmp/l2backup/hexid.txt /root/l2server/gameserver/config/ 2>/dev/null || true
            cp -r /tmp/l2backup/geodata/* /root/l2server/gameserver/data/geodata/ 2>/dev/null || true
            
            rm -rf /tmp/l2backup
            echo "✅ Сборка успешно задеплоена"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

  # ═══════════════════════════════════════════════════════════════
  # JOB 2: CONFIGURE - Заполнение конфигов на сервере
  # ═══════════════════════════════════════════════════════════════
  configure:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: ⚙️ Настройка loginserver.properties
        uses: appleboy/ssh-action@master
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME_LOGIN: ${{ secrets.DB_NAME_LOGIN }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          EXTERNAL_HOSTNAME: ${{ secrets.EXTERNAL_HOSTNAME }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DB_HOST,DB_PORT,DB_NAME_LOGIN,DB_USER,DB_PASSWORD,EXTERNAL_HOSTNAME
          script: |
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "⚙️ Настройка loginserver.properties..."
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            LOGIN_CFG="/root/l2server/login/config/loginserver.properties"
            
            if [ ! -f "$LOGIN_CFG" ]; then
              echo "❌ ОШИБКА: Файл $LOGIN_CFG не найден!"
              exit 1
            fi
            
            sed -i "s#^Hostname *=.*#Hostname = ${EXTERNAL_HOSTNAME}#" "$LOGIN_CFG"
            sed -i "s#^LoginHostname *=.*#LoginHostname = ${EXTERNAL_HOSTNAME}#" "$LOGIN_CFG"
            sed -i "s#^LoginserverHostname *=.*#LoginserverHostname = ${EXTERNAL_HOSTNAME}#" "$LOGIN_CFG"
            sed -i "s#^Login *=.*#Login = ${DB_USER}#" "$LOGIN_CFG"
            sed -i "s#^Password *=.*#Password = ${DB_PASSWORD}#" "$LOGIN_CFG"
            
            echo "✅ loginserver.properties успешно настроен"
            echo "   Hostname: ${EXTERNAL_HOSTNAME}"
            echo "   DB User: ${DB_USER}"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: ⚙️ Настройка server.properties
        uses: appleboy/ssh-action@master
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME_GAME: ${{ secrets.DB_NAME_GAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          EXTERNAL_HOSTNAME: ${{ secrets.EXTERNAL_HOSTNAME }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DB_HOST,DB_PORT,DB_NAME_GAME,DB_USER,DB_PASSWORD,EXTERNAL_HOSTNAME
          script: |
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "⚙️ Настройка server.properties..."
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            GAME_CFG="/root/l2server/gameserver/config/server.properties"
            
            if [ ! -f "$GAME_CFG" ]; then
              echo "❌ ОШИБКА: Файл $GAME_CFG не найден!"
              exit 1
            fi
            
            sed -i "s#^Hostname *=.*#Hostname = ${EXTERNAL_HOSTNAME}#" "$GAME_CFG"
            sed -i "s#^GameserverHostname *=.*#GameserverHostname = ${EXTERNAL_HOSTNAME}#" "$GAME_CFG"
            sed -i "s#^LoginHost *=.*#LoginHost = ${EXTERNAL_HOSTNAME}#" "$GAME_CFG"
            sed -i "s#^Login *=.*#Login = ${DB_USER}#" "$GAME_CFG"
            sed -i "s#^Password *=.*#Password = ${DB_PASSWORD}#" "$GAME_CFG"
            
            echo "✅ server.properties успешно настроен"
            echo "   Hostname: ${EXTERNAL_HOSTNAME}"
            echo "   DB User: ${DB_USER}"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: 🔐 Установка прав доступа
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🔐 Установка прав на скрипты запуска..."
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            chmod +x /root/l2server/login/*.sh
            chmod +x /root/l2server/gameserver/*.sh
            echo "✅ Права установлены"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

  # ═══════════════════════════════════════════════════════════════
  # JOB 3: START - Запуск серверов и проверка
  # ═══════════════════════════════════════════════════════════════
  start:
    needs: configure
    runs-on: ubuntu-latest

    steps:
      - name: 🚀 Запуск Login Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🚀 Запуск Login Server..."
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            cd /root/l2server/login
            ./startLoginServer.sh > /dev/null 2>&1 &
            sleep 5
            
            if pgrep -f "l2jserver" > /dev/null; then
              echo "✅ Login Server запущен успешно"
              echo "📡 PID процесса: $(pgrep -f "l2jserver")"
            else
              echo "⚠️ Login Server возможно не запустился"
            fi
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: 🎮 Запуск Game Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🎮 Запуск Game Server..."
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            cd /root/l2server/gameserver
            ./startGameServer.sh > /dev/null 2>&1 &
            sleep 8
            
            echo "📋 Последние 15 строк лога Game Server:"
            echo "────────────────────────────────────────"
            tail -n 15 /root/l2server/gameserver/log/stdout.log || echo "Лог не найден"
            echo "────────────────────────────────────────"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: ✅ Финальная проверка
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🔍 ФИНАЛЬНАЯ ПРОВЕРКА"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            
            echo "📊 Активные Java процессы:"
            PROCESSES=$(ps aux | grep -E "l2jserver" | grep -v grep)
            if [ -n "$PROCESSES" ]; then
              echo "$PROCESSES" | awk '{print "   PID:", $2, "CPU:", $3"%", "MEM:", $4"%"}'
            else
              echo "   ⚠️ Процессы Java не найдены!"
            fi
            
            echo ""
            echo "⏳ Ожидание запуска сервисов (дополнительные 15 секунд)..."
            sleep 15
            
            echo ""
            echo "🔌 Проверка портов:"
            
            # Проверяем Login Server (2106)
            LOGIN_PORT=$(ss -tlnp | grep :2106)
            if [ -n "$LOGIN_PORT" ]; then
              echo "   ✅ Login Server (2106): слушается"
            else
              echo "   ❌ Login Server (2106): НЕ слушается"
              echo "   📋 Последние 10 строк лога Login Server:"
              tail -n 10 /root/l2server/login/log/stdout.log 2>/dev/null || echo "      Лог не найден"
            fi
            
            # Проверяем Game Server (7777)
            GAME_PORT=$(ss -tlnp | grep :7777)
            if [ -n "$GAME_PORT" ]; then
              echo "   ✅ Game Server (7777): слушается"
            else
              echo "   ❌ Game Server (7777): НЕ слушается"
              echo "   📋 Последние 10 строк лога Game Server:"
              tail -n 10 /root/l2server/gameserver/log/stdout.log 2>/dev/null || echo "      Лог не найден"
            fi
            
            echo ""
            if [ -n "$LOGIN_PORT" ] && [ -n "$GAME_PORT" ]; then
              echo "✅ ДИСПЛОЙ ЗАВЕРШЕН УСПЕШНО!"
              echo "   Все серверы запущены и слушают порты"
            else
              echo "⚠️ ДИСПЛОЙ ЗАВЕРШЕН, НО ЕСТЬ ПРОБЛЕМЫ!"
              echo "   Проверьте логи выше для диагностики"
            fi
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"