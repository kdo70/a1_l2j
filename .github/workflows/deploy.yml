name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  # ═══════════════════════════════════════════════════════════════
  # JOB 1: BUILD - Компиляция ядра и инъекция jar в готовую структуру из Git
  # ═══════════════════════════════════════════════════════════════
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Apache Ant
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ant
          ant -version

      - name: Compile aCis_gameserver ONLY
        run: |
          echo "🔨 Compiling aCis_gameserver to get new l2jserver.jar..."
          cd source/aCis_gameserver
          ant
          echo "✅ Gameserver compiled"

      - name: Inject new JAR into build folder
        run: |
          echo "💉 Injecting new l2jserver.jar into build folder..."
          
          if [ ! -d "build" ]; then
            echo "❌ ERROR: 'build' folder not found in repository!"
            exit 1
          fi
          
          mkdir -p build/login/libs
          mkdir -p build/gameserver/libs
          
          cp source/aCis_gameserver/build/l2jserver.jar build/login/libs/
          cp source/aCis_gameserver/build/l2jserver.jar build/gameserver/libs/
          
          echo "✅ JAR files injected successfully"
          echo "   Files in build folder: $(find build -type f | wc -l)"

      - name: Archive build folder
        run: |
          echo "📦 Creating build archive..."
          tar -czf build.tar.gz -C build .
          echo "✓ Archive created: $(du -h build.tar.gz | cut -f1)"

      - name: Upload archive to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "build.tar.gz"
          target: "/tmp"

      - name: Extract build on VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "🛑 Остановка сервера..."
            # Убиваем ТОЛЬКО процессы java. Это на 100% безопасно для SSH-сессии.
            # || true гарантирует, что скрипт продолжится, даже если java уже не запущена
            killall -9 java > /dev/null 2>&1 || true
            sleep 3
            echo "   ✓ Сервер остановлен"

            echo "💾 Backing up important files..."
            mkdir -p /tmp/l2backup
            
            # Копируем с подавлением ошибок, если файлов вдруг нет
            cp /root/l2server/login/hexid.txt /tmp/l2backup/ 2>/dev/null || true
            cp /root/l2server/gameserver/config/hexid.txt /tmp/l2backup/ 2>/dev/null || true
            cp -r /root/l2server/gameserver/data/geodata /tmp/l2backup/ 2>/dev/null || true

            echo "📂 Extracting new build..."
            # Полностью удаляем и создаем заново для абсолютной чистоты
            rm -rf /root/l2server
            mkdir -p /root/l2server
            
            tar -xzf /tmp/build.tar.gz -C /root/l2server/
            rm -f /tmp/build.tar.gz

            echo "🔄 Restoring important files..."
            cp /tmp/l2backup/hexid.txt /root/l2server/login/ 2>/dev/null || true
            cp /tmp/l2backup/hexid.txt /root/l2server/gameserver/config/ 2>/dev/null || true
            cp -r /tmp/l2backup/geodata/* /root/l2server/gameserver/data/geodata/ 2>/dev/null || true

            rm -rf /tmp/l2backup
            echo "✅ Build deployed successfully"

  # ═══════════════════════════════════════════════════════════════
  # JOB 2: CONFIGURE - Заполнение конфигов на сервере
  # ═══════════════════════════════════════════════════════════════
  configure:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Configure loginserver.properties
        uses: appleboy/ssh-action@master
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME_LOGIN: ${{ secrets.DB_NAME_LOGIN }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          EXTERNAL_HOSTNAME: ${{ secrets.EXTERNAL_HOSTNAME }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DB_HOST,DB_PORT,DB_NAME_LOGIN,DB_USER,DB_PASSWORD,EXTERNAL_HOSTNAME
          script: |
            LOGIN_CFG="/root/l2server/login/config/loginserver.properties"
            sed -i "s#^Hostname *=.*#Hostname = ${EXTERNAL_HOSTNAME}#" "$LOGIN_CFG"
            sed -i "s#^LoginHostname *=.*#LoginHostname = ${EXTERNAL_HOSTNAME}#" "$LOGIN_CFG"
            sed -i "s#^LoginserverHostname *=.*#LoginserverHostname = ${EXTERNAL_HOSTNAME}#" "$LOGIN_CFG"
            sed -i "s#^Login *=.*#Login = ${DB_USER}#" "$LOGIN_CFG"
            sed -i "s#^Password *=.*#Password = ${DB_PASSWORD}#" "$LOGIN_CFG"
            echo "✓ loginserver.properties configured"

      - name: Configure server.properties
        uses: appleboy/ssh-action@master
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME_GAME: ${{ secrets.DB_NAME_GAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          EXTERNAL_HOSTNAME: ${{ secrets.EXTERNAL_HOSTNAME }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DB_HOST,DB_PORT,DB_NAME_GAME,DB_USER,DB_PASSWORD,EXTERNAL_HOSTNAME
          script: |
            GAME_CFG="/root/l2server/gameserver/config/server.properties"
            sed -i "s#^Hostname *=.*#Hostname = ${EXTERNAL_HOSTNAME}#" "$GAME_CFG"
            sed -i "s#^GameserverHostname *=.*#GameserverHostname = ${EXTERNAL_HOSTNAME}#" "$GAME_CFG"
            sed -i "s#^LoginHost *=.*#LoginHost = ${EXTERNAL_HOSTNAME}#" "$GAME_CFG"
            sed -i "s#^Login *=.*#Login = ${DB_USER}#" "$GAME_CFG"
            sed -i "s#^Password *=.*#Password = ${DB_PASSWORD}#" "$GAME_CFG"
            echo "✓ server.properties configured"

      - name: Set permissions
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            chmod +x /root/l2server/login/*.sh
            chmod +x /root/l2server/gameserver/*.sh

  # ═══════════════════════════════════════════════════════════════
  # JOB 3: START - Запуск серверов и проверка
  # ═══════════════════════════════════════════════════════════════
  start:
    needs: configure
    runs-on: ubuntu-latest

    steps:
      - name: Start Login Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /root/l2server/login
            ./startLoginServer.sh > /dev/null 2>&1 &
            sleep 5
            echo "✓ Login Server started"

      - name: Start Game Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /root/l2server/gameserver
            ./startGameServer.sh > /dev/null 2>&1 &
            sleep 8
            echo "✓ Game Server started"
            
            echo "📋 Game Server Log (last 15 lines):"
            echo "────────────────────────────────────────"
            tail -n 15 /root/l2server/gameserver/log/stdout.log || echo "Log not found"
            echo "────────────────────────────────────────"

      - name: Final Verification
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "🔍 Финальная проверка:"
            ps aux | grep -E "l2jserver" | grep -v grep || echo "Нет процессов Java!"
            echo "✅ Deployment complete!"