name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  # ═══════════════════════════════════════════════════════════════
  # JOB 1: BUILD - Компиляция через Ant, сборка и деплой на сервер
  # ═══════════════════════════════════════════════════════════════
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Apache Ant
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ant
          ant -version

      - name: Compile aCis_gameserver
        run: |
          echo "🔨 Compiling aCis_gameserver..."
          cd source/aCis_gameserver
          ant
          echo "✅ Gameserver compiled"

      - name: Compile aCis_datapack
        run: |
          echo "🔨 Compiling aCis_datapack..."
          cd source/aCis_datapack
          ant
          echo "✅ Datapack compiled"

      - name: Assemble build folder
        run: |
          echo "📦 Assembling build folder..."
          rm -rf build
          mkdir -p build
          
          # 1. datapack/build -> build (data, sql, tools и т.д.)
          cp -r source/aCis_datapack/build/* build/
          
          # 2. gameserver/build/dist -> build (login/, gameserver/ со скриптами)
          cp -r source/aCis_gameserver/build/dist/* build/
          
          # 3. gameserver/build/l2jserver.jar -> login/libs и gameserver/libs
          mkdir -p build/login/libs
          mkdir -p build/gameserver/libs
          cp source/aCis_gameserver/build/l2jserver.jar build/login/libs/
          cp source/aCis_gameserver/build/l2jserver.jar build/gameserver/libs/
          
          echo "✅ Build folder assembled"
          echo "   Files: $(find build -type f | wc -l)"

      - name: Archive build folder
        run: |
          echo "📦 Creating build archive..."
          tar -czf build.tar.gz -C build .
          echo "✓ Archive created: $(du -h build.tar.gz | cut -f1)"

      - name: Upload archive to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "build.tar.gz"
          target: "/tmp"

      - name: Extract build on VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "🛑 Stopping server..."
            killall -9 java || true
            sleep 2
            
            echo "💾 Backing up important files..."
            mkdir -p /tmp/l2backup
            
            if [ -f /root/l2server/login/hexid.txt ]; then
              cp /root/l2server/login/hexid.txt /tmp/l2backup/
            fi
            if [ -f /root/l2server/gameserver/config/hexid.txt ]; then
              cp /root/l2server/gameserver/config/hexid.txt /tmp/l2backup/
            fi
            if [ -d /root/l2server/gameserver/data/geodata ]; then
              cp -r /root/l2server/gameserver/data/geodata /tmp/l2backup/
            fi
            
            echo "📂 Extracting new build..."
            rm -rf /root/l2server/*
            tar -xzf /tmp/build.tar.gz -C /root/l2server/
            rm -f /tmp/build.tar.gz
            
            echo "🔄 Restoring important files..."
            if [ -f /tmp/l2backup/hexid.txt ]; then
              cp /tmp/l2backup/hexid.txt /root/l2server/login/
              cp /tmp/l2backup/hexid.txt /root/l2server/gameserver/config/
              echo "   ✓ hexid.txt restored"
            fi
            if [ -d /tmp/l2backup/geodata ]; then
              mkdir -p /root/l2server/gameserver/data/geodata
              cp -r /tmp/l2backup/geodata/* /root/l2server/gameserver/data/geodata/
              echo "   ✓ geodata restored"
            fi
            rm -rf /tmp/l2backup
            
            echo "✅ Build deployed successfully"

  # ═══════════════════════════════════════════════════════════════
  # JOB 2: CONFIGURE - Заполнение конфигов на сервере
  # ═══════════════════════════════════════════════════════════════
  configure:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Configure loginserver.properties
        uses: appleboy/ssh-action@master
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME_LOGIN: ${{ secrets.DB_NAME_LOGIN }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          EXTERNAL_HOSTNAME: ${{ secrets.EXTERNAL_HOSTNAME }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DB_HOST,DB_PORT,DB_NAME_LOGIN,DB_USER,DB_PASSWORD,EXTERNAL_HOSTNAME
          script: |
            echo "⚙️ Configuring loginserver.properties..."
            LOGIN_CFG="/root/l2server/login/config/loginserver.properties"
            
            sed -i "s#^Hostname *=.*#Hostname = ${EXTERNAL_HOSTNAME}#" "$LOGIN_CFG"
            sed -i "s#^LoginHostname *=.*#LoginHostname = ${EXTERNAL_HOSTNAME}#" "$LOGIN_CFG"
            sed -i "s#^LoginserverHostname *=.*#LoginserverHostname = ${EXTERNAL_HOSTNAME}#" "$LOGIN_CFG"
            sed -i "s#^Login *=.*#Login = ${DB_USER}#" "$LOGIN_CFG"
            sed -i "s#^Password *=.*#Password = ${DB_PASSWORD}#" "$LOGIN_CFG"
            
            echo "   ✓ loginserver.properties configured"
            echo ""
            echo "🔍 DEBUG - Current login config:"
            grep -iE "^(ExternalHostname|Hostname|LoginHostname|LoginserverHostname|Login|Password)" "$LOGIN_CFG" || echo "Keys not found!"

      - name: Configure server.properties
        uses: appleboy/ssh-action@master
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME_GAME: ${{ secrets.DB_NAME_GAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          EXTERNAL_HOSTNAME: ${{ secrets.EXTERNAL_HOSTNAME }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DB_HOST,DB_PORT,DB_NAME_GAME,DB_USER,DB_PASSWORD,EXTERNAL_HOSTNAME
          script: |
            echo "⚙️ Configuring server.properties..."
            GAME_CFG="/root/l2server/gameserver/config/server.properties"
            
            sed -i "s#^Hostname *=.*#Hostname = ${EXTERNAL_HOSTNAME}#" "$GAME_CFG"
            sed -i "s#^GameserverHostname *=.*#GameserverHostname = ${EXTERNAL_HOSTNAME}#" "$GAME_CFG"
            sed -i "s#^LoginHost *=.*#LoginHost = ${EXTERNAL_HOSTNAME}#" "$GAME_CFG"
            sed -i "s#^Login *=.*#Login = ${DB_USER}#" "$GAME_CFG"
            sed -i "s#^Password *=.*#Password = ${DB_PASSWORD}#" "$GAME_CFG"
            
            echo "   ✓ server.properties configured"
            echo ""
            echo "🔍 DEBUG - Current gameserver config:"
            grep -iE "^(ExternalHostname|Hostname|GameserverHostname|LoginHost|Login|Password)" "$GAME_CFG" || echo "Keys not found!"

      - name: Set permissions
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "🔧 Setting permissions..."
            chmod +x /root/l2server/login/*.sh
            chmod +x /root/l2server/gameserver/*.sh
            echo "✅ Configuration complete"

  # ═══════════════════════════════════════════════════════════════
  # JOB 3: START - Запуск серверов и вывод логов
  # ═══════════════════════════════════════════════════════════════
  start:
    needs: configure
    runs-on: ubuntu-latest

    steps:
      - name: Start Login Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "🚀 Starting Login Server..."
            cd /root/l2server/login
            ./startLoginServer.sh > /dev/null 2>&1 &
            sleep 5
            
            echo "📋 Login Server Log (last 30 lines):"
            echo "────────────────────────────────────────"
            if [ -f log/stdout.log ]; then
              tail -n 30 log/stdout.log
            else
              echo "Log file not found yet..."
            fi
            echo "────────────────────────────────────────"

      - name: Start Game Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "🚀 Starting Game Server..."
            cd /root/l2server/gameserver
            ./startGameServer.sh > /dev/null 2>&1 &
            sleep 5
            
            echo "📋 Game Server Log (last 30 lines):"
            echo "────────────────────────────────────────"
            if [ -f log/stdout.log ]; then
              tail -n 30 log/stdout.log
            else
              echo "Log file not found yet..."
            fi
            echo "────────────────────────────────────────"

      - name: Final Status Check
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo ""
            echo "🔍 Checking server processes..."
            echo "────────────────────────────────────────"
            ps aux | grep -E "(login|game).*[j]ava" | awk '{print "  ✓ " $11 " (PID: " $2 ")"}' || echo "  ✗ No Java processes found"
            echo "────────────────────────────────────────"
            echo ""
            echo "✅ Deployment complete!"