name: 'Сборка и деплой'
description: 'Компиляция aCis_gameserver и деплой сборки на VPS'

inputs:
  vps-host:
    description: 'IP или хост VPS'
    required: true
  vps-username:
    description: 'Имя пользователя VPS'
    required: true
  vps-ssh-key:
    description: 'SSH-ключ для подключения к VPS'
    required: true

runs:
  using: 'composite'
  steps:
    - name: 🐜 Проверка Apache Ant
      shell: bash
      run: |
        if command -v ant > /dev/null 2>&1; then
          echo "✅ Ant уже установлен: $(ant -version)"
        else
          echo "📦 Устанавливаем Apache Ant..."
          sudo apt-get update -qq
          sudo apt-get install -y ant
          echo "✅ Версия Ant: $(ant -version)"
        fi

    - name: 🔨 Компиляция aCis_gameserver
      shell: bash
      run: |
        echo "🔨 Компиляция aCis_gameserver для получения l2jserver.jar..."
        cd source/aCis_gameserver
        ant
        echo "✅ Компиляция завершена успешно"

    - name: 💉 Инъекция JAR в папку build
      shell: bash
      run: |
        echo "💉 Инъекция l2jserver.jar в папку build..."

        if [ ! -d "build" ]; then
          echo "❌ ОШИБКА: Папка 'build' не найдена в репозитории!"
          exit 1
        fi

        mkdir -p build/login/libs build/gameserver/libs

        cp source/aCis_gameserver/build/l2jserver.jar build/login/libs/
        cp source/aCis_gameserver/build/l2jserver.jar build/gameserver/libs/

        echo "✅ JAR-файлы успешно скопированы"
        echo "📊 Общее количество файлов в папке build: $(find build -type f | wc -l)"

    - name: 📦 Создание архива
      shell: bash
      run: |
        echo "📦 Создание архива build.tar.gz..."
        tar -czf build.tar.gz -C build .
        echo "✅ Архив создан, размер: $(du -h build.tar.gz | cut -f1)"

    - name: 📤 Загрузка архива на VPS
      uses: appleboy/scp-action@v1
      with:
        host: ${{ inputs.vps-host }}
        username: ${{ inputs.vps-username }}
        key: ${{ inputs.vps-ssh-key }}
        source: "build.tar.gz"
        target: "/tmp"
        strip_components: 0

    - name: 🛠️ Распаковка и восстановление на VPS
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ inputs.vps-host }}
        username: ${{ inputs.vps-username }}
        key: ${{ inputs.vps-ssh-key }}
        script: |
          echo "🛑 Остановка текущих серверов (мягкое завершение)..."
          killall java > /dev/null 2>&1 || true

          echo "⏳ Ожидание корректного завершения (до 15 сек)..."
          for i in $(seq 1 15); do
            pgrep -x java > /dev/null || break
            sleep 1
          done

          if pgrep -x java > /dev/null; then
            echo "⚠️ Процессы не завершились за 15 секунд, принудительная остановка..."
            killall -9 java > /dev/null 2>&1 || true
            sleep 2
          fi
          echo "✅ Все Java-процессы остановлены"

          echo "💾 Резервное копирование важных файлов..."
          mkdir -p /tmp/l2backup
          cp /root/l2server/login/hexid.txt /tmp/l2backup/ 2>/dev/null || true
          cp /root/l2server/gameserver/config/hexid.txt /tmp/l2backup/ 2>/dev/null || true
          cp -r /root/l2server/gameserver/data/geodata /tmp/l2backup/ 2>/dev/null || true
          echo "✅ Резервная копия создана"

          echo "📂 Распаковка новой сборки..."
          rm -rf /root/l2server
          mkdir -p /root/l2server
          tar -xzf /tmp/build.tar.gz -C /root/l2server/
          rm -f /tmp/build.tar.gz
          echo "✅ Сборка распакована"

          echo "🔄 Восстановление важных файлов..."
          cp /tmp/l2backup/hexid.txt /root/l2server/login/ 2>/dev/null || true
          cp /tmp/l2backup/hexid.txt /root/l2server/gameserver/config/ 2>/dev/null || true
          cp -r /tmp/l2backup/geodata/* /root/l2server/gameserver/data/geodata/ 2>/dev/null || true
          rm -rf /tmp/l2backup

          echo "✅ Сборка успешно развёрнута"