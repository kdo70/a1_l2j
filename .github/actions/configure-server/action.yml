name: 'Настройка сервера'
description: 'Заполнение конфигов на VPS'

inputs:
  vps-host:
    description: 'IP или хост VPS'
    required: true
  vps-username:
    description: 'Имя пользователя VPS'
    required: true
  vps-ssh-key:
    description: 'SSH-ключ для подключения к VPS'
    required: true
  db-host:
    description: 'Хост базы данных'
    required: true
  db-port:
    description: 'Порт базы данных'
    required: true
  db-name-login:
    description: 'Имя БД для Login Server'
    required: true
  db-name-game:
    description: 'Имя БД для Game Server'
    required: true
  db-user:
    description: 'Пользователь БД'
    required: true
  db-password:
    description: 'Пароль БД'
    required: true
  external-hostname:
    description: 'Внешний hostname сервера'
    required: true

runs:
  using: 'composite'
  steps:
    - name: ⚙️ Настройка конфигов и прав доступа
      uses: appleboy/ssh-action@v1
      env:
        DB_HOST: ${{ inputs.db-host }}
        DB_PORT: ${{ inputs.db-port }}
        DB_NAME_LOGIN: ${{ inputs.db-name-login }}
        DB_NAME_GAME: ${{ inputs.db-name-game }}
        DB_USER: ${{ inputs.db-user }}
        DB_PASSWORD: ${{ inputs.db-password }}
        EXTERNAL_HOSTNAME: ${{ inputs.external-hostname }}
      with:
        host: ${{ inputs.vps-host }}
        username: ${{ inputs.vps-username }}
        key: ${{ inputs.vps-ssh-key }}
        envs: DB_HOST,DB_PORT,DB_NAME_LOGIN,DB_NAME_GAME,DB_USER,DB_PASSWORD,EXTERNAL_HOSTNAME
        script: |
          echo "⚙️ Настройка loginserver.properties..."
          LOGIN_CFG="/root/l2server/login/config/loginserver.properties"

          if [ ! -f "$LOGIN_CFG" ]; then
            echo "❌ ОШИБКА: Файл $LOGIN_CFG не найден!"
            exit 1
          fi

          sed -i "s#^Hostname *=.*#Hostname = ${EXTERNAL_HOSTNAME}#" "$LOGIN_CFG"
          sed -i "s#^LoginHostname *=.*#LoginHostname = ${EXTERNAL_HOSTNAME}#" "$LOGIN_CFG"
          sed -i "s#^LoginserverHostname *=.*#LoginserverHostname = ${EXTERNAL_HOSTNAME}#" "$LOGIN_CFG"
          sed -i "s#^Login *=.*#Login = ${DB_USER}#" "$LOGIN_CFG"
          sed -i "s#^Password *=.*#Password = ${DB_PASSWORD}#" "$LOGIN_CFG"

          echo "✅ loginserver.properties настроен (Hostname: ${EXTERNAL_HOSTNAME}, DB User: ${DB_USER})"

          echo "⚙️ Настройка server.properties..."
          GAME_CFG="/root/l2server/gameserver/config/server.properties"

          if [ ! -f "$GAME_CFG" ]; then
            echo "❌ ОШИБКА: Файл $GAME_CFG не найден!"
            exit 1
          fi

          sed -i "s#^Hostname *=.*#Hostname = ${EXTERNAL_HOSTNAME}#" "$GAME_CFG"
          sed -i "s#^GameserverHostname *=.*#GameserverHostname = ${EXTERNAL_HOSTNAME}#" "$GAME_CFG"
          sed -i "s#^LoginHost *=.*#LoginHost = ${EXTERNAL_HOSTNAME}#" "$GAME_CFG"
          sed -i "s#^Login *=.*#Login = ${DB_USER}#" "$GAME_CFG"
          sed -i "s#^Password *=.*#Password = ${DB_PASSWORD}#" "$GAME_CFG"

          echo "✅ server.properties настроен (Hostname: ${EXTERNAL_HOSTNAME}, DB User: ${DB_USER})"

          echo "🔐 Установка прав на скрипты запуска..."
          chmod +x /root/l2server/login/*.sh
          chmod +x /root/l2server/gameserver/*.sh
          echo "✅ Права установлены"
