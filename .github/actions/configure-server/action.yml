name: 'Configure server'
description: 'Fills in the Login/Game server configs on the VPS from GitHub secrets'

inputs:
  vps-host:
    description: 'VPS IP address or hostname'
    required: true
  vps-username:
    description: 'VPS SSH user'
    required: true
  vps-ssh-key:
    description: 'Private SSH key used to connect to the VPS'
    required: true
  vps-port:
    description: 'VPS SSH port'
    required: false
    default: '22'
  vps-fingerprint:
    description: 'Base64 SSH host key fingerprint. Leave empty to skip host key verification.'
    required: false
    default: ''
  remote-path:
    description: 'Installation directory on the VPS'
    required: false
    default: '/root/l2server'
  db-host:
    description: 'Database host'
    required: true
  db-port:
    description: 'Database port'
    required: true
  db-name-login:
    description: 'Database name for the Login Server'
    required: true
  db-name-game:
    description: 'Database name for the Game Server'
    required: true
  db-user:
    description: 'Database user'
    required: true
  db-password:
    description: 'Database password'
    required: true
  external-hostname:
    description: 'Public hostname / IP announced to game clients'
    required: true

runs:
  using: 'composite'
  steps:
    - name: ⚙️ Apply configuration
      uses: appleboy/ssh-action@v1
      env:
        REMOTE_PATH: ${{ inputs.remote-path }}
        DB_HOST: ${{ inputs.db-host }}
        DB_PORT: ${{ inputs.db-port }}
        DB_NAME_LOGIN: ${{ inputs.db-name-login }}
        DB_NAME_GAME: ${{ inputs.db-name-game }}
        DB_USER: ${{ inputs.db-user }}
        DB_PASSWORD: ${{ inputs.db-password }}
        EXTERNAL_HOSTNAME: ${{ inputs.external-hostname }}
      with:
        host: ${{ inputs.vps-host }}
        username: ${{ inputs.vps-username }}
        key: ${{ inputs.vps-ssh-key }}
        port: ${{ inputs.vps-port }}
        fingerprint: ${{ inputs.vps-fingerprint }}
        envs: REMOTE_PATH,DB_HOST,DB_PORT,DB_NAME_LOGIN,DB_NAME_GAME,DB_USER,DB_PASSWORD,EXTERNAL_HOSTNAME
        command_timeout: 5m
        script: |
          set -e
          # An empty password is legitimate, so give it a default before -u.
          DB_PASSWORD="${DB_PASSWORD:-}"
          DB_PORT="${DB_PORT:-3306}"
          set -u

          LOGIN_CFG="${REMOTE_PATH}/login/config/loginserver.properties"
          GAME_CFG="${REMOTE_PATH}/gameserver/config/server.properties"

          for f in "$LOGIN_CFG" "$GAME_CFG"; do
            if [ ! -f "$f" ]; then
              echo "❌ Config file not found: $f"
              exit 1
            fi
          done

          # Rewrites "<key> = <value>" in place, appending the key if it is
          # missing. The value is escaped so passwords and URLs containing
          # \ & or | cannot corrupt the sed replacement.
          set_prop() {
            _file="$1"; _key="$2"; _value="$3"
            _esc=$(printf '%s' "$_value" | sed -e 's/[\\&|]/\\&/g')
            if grep -qE "^[[:space:]]*${_key}[[:space:]]*=" "$_file"; then
              sed -i -E "s|^[[:space:]]*${_key}[[:space:]]*=.*|${_key} = ${_esc}|" "$_file"
            else
              printf '%s = %s\n' "$_key" "$_value" >> "$_file"
            fi
            echo "   • ${_key}"
          }

          echo "⚙️ Configuring the Login Server..."
          # Every address is pinned to the public hostname: it is announced to
          # clients and also used as the bind address, so the VPS must own that
          # IP directly (this does not work behind NAT).
          set_prop "$LOGIN_CFG" 'Hostname'            "$EXTERNAL_HOSTNAME"
          set_prop "$LOGIN_CFG" 'LoginserverHostname' "$EXTERNAL_HOSTNAME"
          set_prop "$LOGIN_CFG" 'LoginHostname'       "$EXTERNAL_HOSTNAME"
          set_prop "$LOGIN_CFG" 'URL'                 "jdbc:mariadb://${DB_HOST}:${DB_PORT}/${DB_NAME_LOGIN}"
          set_prop "$LOGIN_CFG" 'Login'               "$DB_USER"
          set_prop "$LOGIN_CFG" 'Password'            "$DB_PASSWORD"

          echo "⚙️ Configuring the Game Server..."
          # LoginHost must match the address the Login Server binds above.
          set_prop "$GAME_CFG" 'Hostname'           "$EXTERNAL_HOSTNAME"
          set_prop "$GAME_CFG" 'GameserverHostname' "$EXTERNAL_HOSTNAME"
          set_prop "$GAME_CFG" 'LoginHost'          "$EXTERNAL_HOSTNAME"
          set_prop "$GAME_CFG" 'URL'                "jdbc:mariadb://${DB_HOST}:${DB_PORT}/${DB_NAME_GAME}"
          set_prop "$GAME_CFG" 'Login'              "$DB_USER"
          set_prop "$GAME_CFG" 'Password'           "$DB_PASSWORD"

          # Verify every key landed, without echoing any secret value.
          echo "🔍 Verifying the written keys..."
          for f in "$LOGIN_CFG" "$GAME_CFG"; do
            for key in Hostname URL Login Password; do
              if ! grep -qE "^${key} = " "$f"; then
                echo "❌ Key '${key}' is missing from $f after configuration"
                exit 1
              fi
            done
          done

          echo "✅ Configuration applied to both servers"
